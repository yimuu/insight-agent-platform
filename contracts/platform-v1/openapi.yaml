      headers:
        trace-id: {$ref: "#/components/headers/TraceId"}
        ETag: {schema: {type: string, minLength: 1, maxLength: 128}}
        Cache-Control: {$ref: "#/components/headers/PrivateNoStore"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TaskViewV1"}
  headers:
    TraceId:
      required: true
      schema:
        $ref: "#/components/schemas/TraceId"
    NoStore:
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      schema:
        type: string
        const: no-store, private, max-age=0
    NoReferrer:
      schema:
        type: string
        const: no-referrer
  schemas:
    PublicManagementResourceKind:
      type: string
      enum: [agent, skill, capability_interface, capability_implementation, context_source_interface, context_source_implementation, model_provider, model_profile, mcp_server, policy, sandbox_runtime, sandbox_package, sandbox_profile]
    PublicManagementResourceId:
      type: string
      pattern: "^(agt|skl|cap|cim|ctx|xim|mpr|mdl|mcp|pol|srt|spk|sxp)_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    PublicManagementVersionId:
      type: string
      pattern: "^(aif|arev|srev|cirev|cimp|xirev|ximp|mprev|mdrev|mrev|prev|srrev|sprev|sxrev)_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    PublicManagementDeploymentId:
      type: string
      pattern: "^(adep|skdep|cdep|xdep|mpdep|mdep|mcdep|pdep|sxdep)_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    CreateResourceRequestV1:
      type: object
      additionalProperties: false
      required: [display_name, document]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 255}
        document: {$ref: "#/components/schemas/ResourceDocument"}
    ResourceDraftPayload:
      type: object
      additionalProperties: false
      required: [display_name, document, validation]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 255}
        document: {$ref: "#/components/schemas/ResourceDocument"}
        validation:
          oneOf:
            - {$ref: "#/components/schemas/ValidationSummary"}
            - {type: "null"}
    ValidationSummary:
      type: object
      additionalProperties: false
      required: [validator_digest, validated_draft_digest, dependency_closure_digest, security_evidence_digest, warnings]
      properties:
        validator_digest: {$ref: "#/components/schemas/Digest"}
        validated_draft_digest: {$ref: "#/components/schemas/Digest"}
        dependency_closure_digest: {$ref: "#/components/schemas/Digest"}
        security_evidence_digest: {$ref: "#/components/schemas/Digest"}
        warnings:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [code, path]
            properties:
              code: {type: string, minLength: 1, maxLength: 128, pattern: "^[a-z][a-z0-9_.-]*$"}
              path: {type: string, maxLength: 512}
    PublishResourceDraftRequestV1:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, revision_no, content_digest, artifact_id]
          properties:

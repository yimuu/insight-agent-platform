[package]
name = "insight-platform-mcp-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "platform-mcp-host"
path = "src/main.rs"

[[bin]]
name = "platform-mcp-resource-host"
path = "src/resource_main.rs"

[[bin]]
name = "platform-mcp-discovery-worker"
path = "src/discovery_main.rs"

[[bin]]
name = "platform-mcp-subscription-worker"
path = "src/subscription_main.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
axum.workspace = true
insight-platform-artifact-rpc.workspace = true
insight-platform-artifacts.workspace = true
insight-platform-contracts.workspace = true
insight-platform-egress-rpc.workspace = true
insight-platform-mcp-host.workspace = true
insight-platform-jobs.workspace = true
insight-platform-mcp-rpc.workspace = true
insight-platform-observability.workspace = true
insight-platform-postgres.workspace = true
insight-platform-rpc-trace.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tonic.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
insight-platform-capability-adapters.workspace = true
insight-platform-model-adapters.workspace = true
rcgen = { version = "0.14.9", default-features = false, features = ["aws_lc_rs", "pem"] }

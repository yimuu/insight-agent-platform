version: 1
bind_addr: 127.0.0.1:3000

auth:
  mode: disabled

agents:
  directory: ../agents
  enabled:
    - code_node_demo
    - medical_report_interpreter
    - researcher

models:
  config: models.yaml

actions:
  enabled:
    - current_time
    - example.text_metrics

history:
  provider: sqlite
  path: ../data/formal_v1.sqlite3

runtime:
  max_concurrent_runs: 32
  default_node_timeout: 60s
  run_timeout: 5m
  attached_reconnect_grace: 10s
  subscriber_capacity: 128
  replay_ring_capacity: 512
  journal_capacity: 1024
  journal_batch_size: 32
  journal_operation_timeout: 30s

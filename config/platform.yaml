version: 1
deployment_mode: production
bind_addr: 127.0.0.1:3000

auth:
  mode: disabled

agents:
  directory: ../agents
  enabled:
    - action_demo
    - medical_report_interpreter
    - parallel_researcher
    - researcher

models:
  config: models.yaml

actions:
  enabled:
    - current_time
    - example.text_metrics

history:
  provider: postgres
  database_url_env: RUN_HISTORY_POSTGRES_URL
  max_connections: 10

artifacts:
  provider: shared_filesystem
  namespace: production
  directory: ../data/artifacts
  inline_threshold_bytes: 65536
  max_read_bytes: 67108864
  orphan_retention: 24h
  reference_retention: 30d
  gc_interval: 1m
  deletion_claim_seconds: 60

runtime:
  max_concurrent_runs: 32
  max_concurrent_operations: 32
  max_concurrent_operations_per_run: 8
  operation_timeout: 60s
  run_timeout: 5m
  sse_keep_alive_interval: 5s
  subscriber_capacity: 128
  scheduler:
    active_poll_interval: 25ms
    idle_poll_min_interval: 100ms
    idle_poll_max_interval: 2s
    safety_poll_interval: 5s
    claim_batch_size: 8
    notification_reconnect_interval: 250ms
  max_llm_tool_rounds: 16
  max_llm_tool_calls: 64
  response_stream:
    broker: postgres_notify
    body_queue_capacity: 256
    control_queue_capacity: 32
    max_frame_bytes: 4096
    max_item_bytes: 4194304
    max_run_bytes: 16777216
    terminal_barrier_timeout: 2s
    outbound_write_timeout: 10s
  public_event_retention: 24h
  public_event_prune_interval: 1m
  readiness_probe_timeout: 2s
  shutdown_grace_period: 30s
  shutdown_hard_deadline: 35s

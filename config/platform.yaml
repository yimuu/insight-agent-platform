version: 1
deployment_mode: production
bind_addr: 127.0.0.1:3000

auth:
  mode: disabled

management:
  version: 1
  enabled: false
  operator_credentials: []
  provider_secret_resolver:
    type: disabled
  limits:
    max_agent_draft_bytes: 4194304
    max_agent_prompt_files: 128
    max_provider_models: 4096
    max_pending_operations: 256
    operation_retention_days: 30
  debug_execution_profiles: {}

agents:
  directory: ../agents
  enabled:
    - action_demo
    - medical_report_interpreter
    - parallel_researcher
    - researcher
    - tool_assistant
    - progress_tool_assistant

actions:
  enabled:
    - current_time
    - example.text_metrics
    - text_metrics
    - integer_calculator
    - text_replace
    - progress_counter

mcp:
  version: 2
  protocol:
    preferred: "2026-07-28"
    legacy_fallback: []
  client:
    enabled: false
    management_api:
      enabled: false
  server:
    enabled: false
    endpoint: /mcp
    authorization:
      type: disabled
    exports:
      agents: []
      actions: []
      resources: []
      prompts: []

history:
  provider: postgres
  database_url_env: RUN_HISTORY_POSTGRES_URL
  max_connections: 10

object_storage:
  llm_attachment_delivery: inline_data
  s3:
    endpoint: http://rustfs:9000
    public_endpoint: https://files.example.com
    region: us-east-1
    bucket: insight-agent-platform
    force_path_style: true
    access_key_env: S3_ACCESS_KEY
    secret_key_env: S3_SECRET_KEY
    connect_timeout: 5s
    request_timeout: 30s
    presign_upload_ttl: 15m
    presign_download_ttl: 5m
    allow_insecure_internal_endpoint: true
  limits:
    max_file_bytes: 26214400
    max_files_per_invocation: 10
    max_total_file_bytes_per_invocation: 52428800
    pending_upload_ttl: 1h
  gc:
    interval: 1m
    deletion_claim_seconds: 60

artifacts:
  namespace: production
  inline_threshold_bytes: 65536
  max_read_bytes: 67108864
  orphan_retention: 24h
  reference_retention: 30d
  gc_interval: 1m
  deletion_claim_seconds: 60

runtime:
  default_persistence_mode: full
  terminal_only:
    enabled: true
    owner_lease_seconds: 30
    owner_heartbeat_seconds: 10
    terminal_commit_retry_seconds: 10
    run_retention_days: 30
    allow_volatile_waits: false
    max_concurrent_runs: 50
  max_concurrent_runs: 32
  max_concurrent_operations: 32
  max_concurrent_operations_per_run: 8
  operation_timeout: 30s
  run_timeout: 5m
  sse_keep_alive_interval: 5s
  subscriber_capacity: 128
  scheduler:
    active_poll_interval: 25ms
    idle_poll_min_interval: 100ms
    idle_poll_max_interval: 2s
    safety_poll_interval: 5s
    claim_batch_size: 8
    notification_reconnect_interval: 250ms
  max_llm_tool_rounds: 16
  max_llm_tool_calls: 64
  run_stream:
    topology: single_runtime
    broker:
      type: in_memory
    body_queue_capacity: 256
    control_queue_capacity: 32
    max_frame_bytes: 4096
    max_item_bytes: 4194304
    max_run_bytes: 16777216
    terminal_barrier_timeout: 2s
    outbound_write_timeout: 10s
  public_event_retention: 24h
  public_event_prune_interval: 1m
  readiness_probe_timeout: 2s
  shutdown_grace_period: 30s
  shutdown_hard_deadline: 35s

conversations:
  enabled: true
  inline_content_max_bytes: 8192
  message_page_size_default: 50
  message_page_size_max: 200
  summary_trigger_messages: 30
  summary_trigger_tokens: 24000
  recent_context_messages: 20
  retention_days: 90

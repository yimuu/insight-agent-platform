version: 1

models:
  general_chat:
    type: open_ai_chat
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: OPENAI_API_KEY
    model: qwen3.6-flash
    capabilities: [json_object_output]
    connect_timeout: 5s
    request_timeout: 2m

  vision_chat:
    type: open_ai_chat
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: OPENAI_API_KEY
    model: qwen-vl-plus
    capabilities: [json_object_output, vision]
    connect_timeout: 5s
    request_timeout: 2m

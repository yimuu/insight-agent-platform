api_version: insight.agent/v1
kind: agent

metadata:
  id: tool_assistant
  name: Multi-tool Assistant
  description: Demonstrates one LLM choosing and combining several typed local tools.

types:
  NonEmptyText:
    type: string
    min_length: 1

prompts:
  system:
    file: prompts/system.md
  request:
    file: prompts/request.md

inputs:
  request:
    type: string
    min_length: 1

output: NonEmptyText

workflow:
  steps:
    - id: answer
      type: llm
      model: general_chat
      stream: true
      publish: true
      messages:
        - role: system
          content:
            - text: system
        - role: user
          content:
            - text: request
      parameters:
        temperature: 0.1
        enable_thinking: false
        parallel_tool_calls: true
      tools:
        - current_time
        - text_metrics
        - integer_calculator
        - text_replace
      tool_choice: auto
      tool_limits:
        max_rounds: 8
        max_calls: 16
      response: NonEmptyText

    - return: $answer

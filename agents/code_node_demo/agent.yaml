version: 1
id: code_node_demo
name: Action Node Demo
description: Demonstrates a typed native Rust action whose JSON output feeds later nodes.

input:
  schema:
    type: object
    required: [text]
    additionalProperties: false
    properties:
      text:
        type: string

entry: analyze_text

nodes:
  analyze_text:
    type: core.action
    next: render
    config:
      action: example.text_metrics
      input:
        text: "{{ input.text }}"

  render:
    type: core.template
    next: result
    emit: content
    config:
      value: |
        Text metrics:
        - characters: {{ nodes.analyze_text.output.characters }}
        - words: {{ nodes.analyze_text.output.words }}
        - lines: {{ nodes.analyze_text.output.lines }}

  result:
    type: core.output
    config:
      content:
        template: "{{ nodes.render.output }}"
      format: text

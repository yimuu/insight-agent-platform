api_version: insight.agent/v1
kind: agent

metadata:
  id: conversation_context_probe
  name: Conversation Context Probe
  description: Returns the selected context so Gate D can inspect summary and recent-message bounds.

execution:
  persistence_mode: terminal_only

inputs:
  message: any
  conversation_context: any

output: any

workflow:
  steps:
    - return: $conversation_context

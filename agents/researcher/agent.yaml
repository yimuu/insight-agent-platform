version: 1
id: researcher
name: Research Assistant
description: Research and answer questions with a private plan-first flow.

input:
  schema:
    type: object
    required: [question]
    additionalProperties: false
    properties:
      question:
        type: string
        minLength: 1

prompts:
  system: prompts/system.md
  planner: prompts/planner.md
  final: prompts/final.md

entry: plan

nodes:
  plan:
    type: core.chat
    next: now
    config:
      model: general_chat
      messages:
        - role: system
          content:
            template_ref: system
        - role: user
          content:
            template_ref: planner
      parameters:
        temperature: 0.3

  now:
    type: core.action
    next: answer
    config:
      action: current_time
      input:
        timezone: Asia/Shanghai

  answer:
    type: core.chat
    next: result
    emit: content
    config:
      model: general_chat
      messages:
        - role: system
          content:
            template_ref: system
        - role: user
          content:
            template_ref: final
      parameters:
        temperature: 0.3

  result:
    type: core.output
    config:
      content:
        template: "{{ nodes.answer.output.text }}"
      format: markdown
      data:
        answer: "{{ nodes.answer.output.text }}"

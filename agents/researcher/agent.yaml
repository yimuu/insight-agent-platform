api_version: insight.agent/v2
kind: agent

metadata:
  id: researcher
  name: Research Assistant
  description: Research and answer questions with a private plan-first flow.

types:
  ResearchResult:
    fields:
      answer:
        type: string
        min_length: 1

prompts:
  system:
    file: prompts/system.md
  planner:
    file: prompts/planner.md
  final:
    file: prompts/final.md

inputs:
  question:
    type: string
    min_length: 1

output: ResearchResult

workflow:
  steps:
    - type: llm
      id: plan
      model: general_chat
      messages:
        - role: system
          content:
            - text: system
        - role: user
          content:
            - text: planner
      parameters: {temperature: 0.3}
      response: string

    - type: action
      id: current_time
      call: current_time
      inputs:
        timezone: Asia/Shanghai

    - type: llm
      id: answer
      model: general_chat
      messages:
        - role: system
          content:
            - text: system
        - role: user
          content:
            - text: final
      parameters: {temperature: 0.3}
      response: string

  result:
    return:
      answer: $answer

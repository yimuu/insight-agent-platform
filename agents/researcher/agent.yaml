api_version: insight.agent/v2
kind: agent

metadata:
  id: researcher
  name: Research Assistant
  description: Research and answer questions with a private plan-first flow.

schema_dialect: https://json-schema.org/draft/2020-12/schema

prompts:
  system:
    file: prompts/system.md
  planner:
    file: prompts/planner.md
  final:
    file: prompts/final.md

input:
  schema:
    type: object
    required: [question]
    properties:
      question:
        type: string
        minLength: 1
    additionalProperties: false

output:
  data_schema:
    type: object
    required: [answer]
    properties:
      answer:
        type: string
        minLength: 1
    additionalProperties: false

workflow:
  steps:
    - kind: llm
      id: plan
      model: general_chat
      inputs:
        question: {from: input.question}
      messages:
        - {role: system, content: system}
        - {role: user, content: planner}
      parameters: {temperature: 0.3}
      response: {format: text}

    - kind: action
      id: now
      call: current_time
      inputs:
        timezone: {literal: Asia/Shanghai}

    - kind: llm
      id: answer
      model: general_chat
      inputs:
        question: {from: input.question}
        plan: {from: steps.plan.output.data}
        current_time: {from: steps.now.output}
      messages:
        - {role: system, content: system}
        - {role: user, content: final}
      parameters: {temperature: 0.3}
      response: {format: text}

  result:
    return:
      content: {from: steps.answer.output.data}
      format: markdown
      data:
        object:
          answer: {from: steps.answer.output.data}

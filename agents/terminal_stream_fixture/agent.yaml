api_version: insight.agent/v1
kind: agent

metadata:
  id: terminal_stream_fixture
  name: Terminal Stream Fixture
  description: Deterministic streaming LLM fixture for terminal-only Conversation qualification.

execution:
  persistence_mode: terminal_only

types:
  StreamRequest:
    fields:
      prompt: string
      output_scale: string

inputs:
  message: StreamRequest
  conversation_context: any

output: string

workflow:
  steps:
    - type: llm
      id: streamed_answer
      model:
        provider: fixture
        id: terminal-stream
      stream: true
      publish: true
      messages:
        - role: user
          content:
            - text: "{{ message.prompt }} output_scale={{ message.output_scale }}"
      parameters: {temperature: 0}
      response: string

    - return: $streamed_answer

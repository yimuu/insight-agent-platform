api_version: insight.agent/v1
kind: agent

metadata:
  id: terminal_stream_fixture
  name: Terminal Stream Fixture
  description: Deterministic streaming LLM fixture for terminal-only Conversation qualification.

execution:
  persistence_mode: terminal_only

inputs:
  query: string
  messages:
    type: Message[]
    default: []
  output_scale: string

output: string

workflow:
  steps:
    - type: llm
      id: streamed_answer
      model:
        provider: fixture
        id: terminal-stream
      stream: true
      publish: true
      messages:
        - role: user
          content:
            - text: "{{ query }} output_scale={{ output_scale }}"
      parameters: {temperature: 0}
      response: string

    - return: $streamed_answer

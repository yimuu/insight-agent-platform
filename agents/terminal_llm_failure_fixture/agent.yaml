api_version: insight.agent/v1
kind: agent

metadata:
  id: terminal_llm_failure_fixture
  name: Terminal LLM Failure Fixture
  description: Slow deterministic streaming model call for runtime-kill qualification.

execution:
  persistence_mode: terminal_only

inputs:
  message: any
  conversation_context: any

output: string

workflow:
  steps:
    - type: llm
      id: slow_stream
      model: terminal_stream_fixture_model
      stream: true
      publish: true
      messages:
        - role: user
          content:
            - text: "Gate C slow stream output_scale=10 chunk_delay_ms=500"
      parameters: {temperature: 0}
      response: string

    - return: $slow_stream

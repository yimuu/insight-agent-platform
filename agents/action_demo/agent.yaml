api_version: insight.agent/v2
kind: agent

metadata:
  id: action_demo
  name: Action Demo
  description: Demonstrates a typed native Rust action whose JSON output feeds the public result.

schema_dialect: https://json-schema.org/draft/2020-12/schema

input:
  schema:
    type: object
    required: [text]
    properties:
      text: {type: string}
    additionalProperties: false

output:
  data_schema:
    type: object
    required: [characters, words, lines]
    properties:
      characters: {type: integer, minimum: 0}
      words: {type: integer, minimum: 0}
      lines: {type: integer, minimum: 0}
    additionalProperties: false

workflow:
  steps:
    - kind: operation
      id: analyze_text
      uses: action.call
      with:
        input:
          object:
            text: {from: input.text}
      config:
        action: example.text_metrics

  result:
    return:
      content:
        template:
          text: |-
            Text metrics:
            - characters: {{ characters }}
            - words: {{ words }}
            - lines: {{ lines }}
          bindings:
            characters: {from: steps.analyze_text.output.characters}
            words: {from: steps.analyze_text.output.words}
            lines: {from: steps.analyze_text.output.lines}
      format: text
      data: {from: steps.analyze_text.output}

api_version: insight.agent/v1
kind: agent

metadata:
  id: action_demo
  name: Action Demo
  description: Demonstrates a typed native Rust action whose JSON output feeds the public result.

types:
  TextMetrics:
    fields:
      characters: integer
      words: integer
      lines: integer

inputs:
  text: string

output: TextMetrics

workflow:
  steps:
    - type: action
      id: analyze_text
      call: example.text_metrics
      inputs:
        text: $text
      response: TextMetrics

    - return: $analyze_text

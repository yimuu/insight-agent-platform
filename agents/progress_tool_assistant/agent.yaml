api_version: insight.agent/v1
kind: agent

metadata:
  id: progress_tool_assistant
  name: Progress Tool Assistant
  description: Demonstrates schema-validated best-effort tool progress.

inputs:
  request:
    type: string
    min_length: 1

output:
  type: string
  min_length: 1

execution:
  persistence_mode: terminal_only

workflow:
  steps:
    - id: answer
      type: llm
      model: general_chat
      stream: true
      publish: true
      messages:
        - role: system
          content:
            - text: >
                Call progress_counter exactly once with total 10, then summarize
                its final typed result in one short Chinese sentence.
        - role: user
          content:
            - text: "{{ request }}"
      parameters:
        temperature: 0
        enable_thinking: false
      tools: [progress_counter]
      tool_choice: progress_counter
      tool_limits:
        max_rounds: 2
        max_calls: 1
      response: string

    - return: $answer

api_version: insight.agent/v2
kind: agent

metadata:
  id: medical_report_interpreter
  name: Medical Report Interpreter
  description: A structured multimodal medical-report interpretation workflow with separate first-turn and follow-up paths.

types:
  MedicalResult:
    fields:
      mode:
        type: string
        enum: [initial, follow_up]
      answer:
        type: string
        min_length: 1
      abnormal_indicators:
        type: string
      comprehensive_interpretation:
        type: string
      health_advice:
        type: string

prompts:
  system:
    file: prompts/system.md
  abnormal_indicators:
    file: prompts/abnormal_indicators.md
  comprehensive_interpretation:
    file: prompts/comprehensive_interpretation.md
  health_advice:
    file: prompts/health_advice.md
  follow_up:
    file: prompts/follow_up.md

inputs:
  report_text: string
  image_url:
    type: string
    optional: true
    pattern: "^(http://|https://|data:image/|$)"
  messages:
    type: Message[]
    default: []
  question: string

output: MedicalResult

workflow:
  steps:
    - type: switch
      id: route
      inputs:
        report_text: $report_text
        image_url: $image_url
        messages: $messages
        question: $question
      output: MedicalResult
      cases:
        - id: follow_up
          when:
            cel: size(scope.messages) > 0
          steps:
            - type: llm
              id: answer
              model: vision_chat
              messages:
                - role: system
                  content:
                    - text: system
                - $messages
                - role: user
                  content:
                    - text: follow_up
                    - image_url: $image_url
              parameters: {temperature: 0.2}
              response: string
          result:
            return:
              mode: follow_up
              answer: $answer
              abnormal_indicators: ""
              comprehensive_interpretation: ""
              health_advice: ""

      default:
        id: initial
        steps:
          - type: llm
            id: abnormal_indicators
            model: vision_chat
            messages:
              - role: system
                content:
                  - text: system
              - $messages
              - role: user
                content:
                  - text: abnormal_indicators
                  - image_url: $image_url
            parameters: {temperature: 0.2}
            response: string

          - type: llm
            id: comprehensive_interpretation
            model: vision_chat
            messages:
              - role: system
                content:
                  - text: system
              - $messages
              - role: user
                content:
                  - text: comprehensive_interpretation
                  - image_url: $image_url
            parameters: {temperature: 0.2}
            response: string

          - type: llm
            id: health_advice
            model: vision_chat
            messages:
              - role: system
                content:
                  - text: system
              - $messages
              - role: user
                content:
                  - text: health_advice
                  - image_url: $image_url
            parameters: {temperature: 0.2}
            response: string
        result:
          return:
            mode: initial
            answer: |-
              {{ abnormal_indicators }}

              {{ comprehensive_interpretation }}

              {{ health_advice }}
            abnormal_indicators: $abnormal_indicators
            comprehensive_interpretation: $comprehensive_interpretation
            health_advice: $health_advice

  result:
    return: $route

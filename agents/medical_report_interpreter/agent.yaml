version: 1
id: medical_report_interpreter
name: Medical Report Interpreter
description: One multimodal example built on the general chat-node contract.

input:
  schema:
    type: object
    required: [report_text, image_url, messages, question]
    additionalProperties: false
    properties:
      report_text:
        type: string
      image_url:
        type: string
        pattern: "^(https://|data:image/)"
      messages:
        type: array
        items:
          type: object
          required: [role, content]
          additionalProperties: false
          properties:
            role:
              type: string
              enum: [user, assistant]
            content:
              type: string
      question:
        type: string

prompts:
  system: prompts/system.md
  abnormal_indicators: prompts/abnormal_indicators.md
  comprehensive_interpretation: prompts/comprehensive_interpretation.md
  health_advice: prompts/health_advice.md
  follow_up: prompts/follow_up.md

entry: route

nodes:
  route:
    type: core.condition
    config:
      cases:
        - when: "size(input.messages) > 0"
          next: follow_up
      default: abnormal_indicators

  follow_up:
    type: core.chat
    next: follow_up_result
    emit: content
    config:
      model: vision_chat
      messages:
        - role: system
          content:
            template_ref: system
        - role: user
          content:
            - type: text
              text:
                template_ref: follow_up
            - type: image_url
              image_url:
                url: "{{ input.image_url }}"
      parameters:
        temperature: 0.2

  follow_up_result:
    type: core.output
    config:
      content:
        template: "{{ nodes.follow_up.output.text }}"
      format: markdown

  abnormal_indicators:
    type: core.chat
    next: comprehensive_interpretation
    emit: content
    config:
      model: vision_chat
      messages:
        - role: system
          content:
            template_ref: system
        - role: user
          content:
            - type: text
              text:
                template_ref: abnormal_indicators
            - type: image_url
              image_url:
                url: "{{ input.image_url }}"
      parameters:
        temperature: 0.2

  comprehensive_interpretation:
    type: core.chat
    next: health_advice
    emit: content
    config:
      model: vision_chat
      messages:
        - role: system
          content:
            template_ref: system
        - role: user
          content:
            - type: text
              text:
                template_ref: comprehensive_interpretation
            - type: image_url
              image_url:
                url: "{{ input.image_url }}"
      parameters:
        temperature: 0.2

  health_advice:
    type: core.chat
    next: result
    emit: content
    config:
      model: vision_chat
      messages:
        - role: system
          content:
            template_ref: system
        - role: user
          content:
            - type: text
              text:
                template_ref: health_advice
            - type: image_url
              image_url:
                url: "{{ input.image_url }}"
      parameters:
        temperature: 0.2

  result:
    type: core.output
    config:
      content:
        template: |-
          {{ nodes.abnormal_indicators.output.text }}

          {{ nodes.comprehensive_interpretation.output.text }}

          {{ nodes.health_advice.output.text }}
      format: markdown
      data:
        abnormal_indicators: "{{ nodes.abnormal_indicators.output.text }}"
        comprehensive_interpretation: "{{ nodes.comprehensive_interpretation.output.text }}"
        health_advice: "{{ nodes.health_advice.output.text }}"

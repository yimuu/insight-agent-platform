api_version: insight.agent/v2
kind: agent

metadata:
  id: parallel_researcher
  name: Parallel Researcher
  description: Compare independent technical and risk perspectives, then synthesize the available evidence.

types:
  Perspective:
    type: string
    min_length: 1

  SafeBranchError:
    fields:
      category:
        type: string
        enum: [workflow, operation, timeout]
      code:
        type: string
        min_length: 1
        max_length: 128
        pattern: "^[A-Z][A-Z0-9_]*$"
      retryable: boolean
      origin:
        type: string
        min_length: 1
        max_length: 512

  SynthesisFailure:
    fields:
      branch:
        type: string
        enum: [technical, risk]
      error: SafeBranchError

  SynthesisInput:
    fields:
      perspectives:
        type: Perspective[]
        min_items: 1
      failed_branches: SynthesisFailure[]

  SynthesisResult:
    fields:
      content:
        type: string
        min_length: 1
      degraded: boolean

prompts:
  system:
    file: prompts/system.md
  perspective_a:
    file: prompts/perspective_a.md
  perspective_b:
    file: prompts/perspective_b.md
  synthesize:
    file: prompts/synthesize.md

errors:
  all_failed:
    category: workflow
    code: WORKFLOW_ALL_BRANCHES_FAILED
    public_message: No analysis perspective was available.

inputs:
  question:
    type: string
    min_length: 1

output: SynthesisResult

workflow:
  steps:
    - type: parallel
      id: analyses
      inputs:
        question: $question
      settle: all_settled
      max_concurrency: 2
      branches:
        technical:
          output: Perspective
          steps:
            - type: llm
              id: analyze
              model: general_chat
              messages:
                - role: system
                  content:
                    - text: system
                - role: user
                  content:
                    - text: perspective_a
              parameters: {temperature: 0.2}
              response: Perspective
          result:
            return: $analyze

        risk:
          output: Perspective
          steps:
            - type: llm
              id: analyze
              model: general_chat
              messages:
                - role: system
                  content:
                    - text: system
                - role: user
                  content:
                    - text: perspective_b
              parameters: {temperature: 0.2}
              response: Perspective
          result:
            return: $analyze

    - type: switch
      id: synthesis_input
      inputs:
        results: $analyses
      output: SynthesisInput
      cases:
        - id: complete
          when:
            cel: >-
              scope.results.technical.status == 'ok' &&
              scope.results.risk.status == 'ok'
          result:
            return:
              perspectives:
                - $results.technical.value
                - $results.risk.value
              failed_branches: []

        - id: technical_only
          when:
            cel: >-
              scope.results.technical.status == 'ok' &&
              scope.results.risk.status == 'error'
          result:
            return:
              perspectives:
                - $results.technical.value
              failed_branches:
                - branch: risk
                  error: $results.risk.error

        - id: risk_only
          when:
            cel: >-
              scope.results.technical.status == 'error' &&
              scope.results.risk.status == 'ok'
          result:
            return:
              perspectives:
                - $results.risk.value
              failed_branches:
                - branch: technical
                  error: $results.technical.error

      default:
        id: all_failed
        result:
          raise: all_failed

    - type: llm
      id: synthesize
      model: general_chat
      messages:
        - role: system
          content:
            - text: system
        - role: user
          content:
            - text: synthesize
      parameters: {temperature: 0.2}
      response: SynthesisResult

  result:
    return: $synthesize

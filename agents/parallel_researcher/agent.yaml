api_version: insight.agent/v2
kind: agent

metadata:
  id: parallel_researcher
  name: Parallel Researcher
  description: Compare independent technical and risk perspectives, then synthesize the available evidence.

schema_dialect: https://json-schema.org/draft/2020-12/schema

$defs:
  Perspective:
    type: string
    minLength: 1

  SafeBranchError:
    type: object
    required: [category, code, retryable, origin]
    properties:
      category:
        type: string
        enum: [workflow, operation, timeout]
      code:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Z][A-Z0-9_]*$"
      retryable: {type: boolean}
      origin:
        type: string
        minLength: 1
        maxLength: 512
    additionalProperties: false

  SynthesisFailure:
    type: object
    required: [branch, error]
    properties:
      branch: {type: string, enum: [technical, risk]}
      error: {$ref: "#/$defs/SafeBranchError"}
    additionalProperties: false

  SynthesisInput:
    type: object
    required: [perspectives, failed_branches]
    properties:
      perspectives:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/Perspective"}
      failed_branches:
        type: array
        items: {$ref: "#/$defs/SynthesisFailure"}
    additionalProperties: false

  SynthesisResult:
    type: object
    required: [content, degraded]
    properties:
      content: {type: string, minLength: 1}
      degraded: {type: boolean}
    additionalProperties: false

prompts:
  system:
    file: prompts/system.md
  perspective_a:
    file: prompts/perspective_a.md
  perspective_b:
    file: prompts/perspective_b.md
  synthesize:
    file: prompts/synthesize.md

errors:
  all_failed:
    category: workflow
    code: WORKFLOW_ALL_BRANCHES_FAILED
    public_message: No analysis perspective was available.

input:
  schema:
    type: object
    required: [question]
    properties:
      question: {type: string, minLength: 1}
    additionalProperties: false

output:
  data_schema:
    type: object
    required: [degraded]
    properties:
      degraded: {type: boolean}
    additionalProperties: false

workflow:
  steps:
    - kind: parallel
      id: analyses
      inputs:
        question: {from: input.question}
      settle: all_settled
      max_concurrency: 2
      branches:
        technical:
          output_schema: {$ref: "#/$defs/Perspective"}
          steps:
            - kind: llm
              id: analyze
              model: general_chat
              inputs:
                question: {from: scope.question}
              messages:
                - {role: system, content: system}
                - {role: user, content: perspective_a}
              parameters: {temperature: 0.2}
              response: {format: text}
          result:
            return: {from: steps.analyze.output.data}

        risk:
          output_schema: {$ref: "#/$defs/Perspective"}
          steps:
            - kind: llm
              id: analyze
              model: general_chat
              inputs:
                question: {from: scope.question}
              messages:
                - {role: system, content: system}
                - {role: user, content: perspective_b}
              parameters: {temperature: 0.2}
              response: {format: text}
          result:
            return: {from: steps.analyze.output.data}

    - kind: switch
      id: synthesis_input
      inputs:
        results: {from: steps.analyses.output}
      output_schema: {$ref: "#/$defs/SynthesisInput"}
      cases:
        - id: complete
          when:
            cel: >-
              scope.results.technical.status == 'ok' &&
              scope.results.risk.status == 'ok'
          result:
            return:
              object:
                perspectives:
                  array:
                    - {from: scope.results.technical.value}
                    - {from: scope.results.risk.value}
                failed_branches: {array: []}

        - id: technical_only
          when:
            cel: >-
              scope.results.technical.status == 'ok' &&
              scope.results.risk.status == 'error'
          result:
            return:
              object:
                perspectives:
                  array:
                    - {from: scope.results.technical.value}
                failed_branches:
                  array:
                    - object:
                        branch: {literal: risk}
                        error: {from: scope.results.risk.error}

        - id: risk_only
          when:
            cel: >-
              scope.results.technical.status == 'error' &&
              scope.results.risk.status == 'ok'
          result:
            return:
              object:
                perspectives:
                  array:
                    - {from: scope.results.risk.value}
                failed_branches:
                  array:
                    - object:
                        branch: {literal: technical}
                        error: {from: scope.results.technical.error}

      default:
        id: all_failed
        result:
          raise: all_failed

    - kind: llm
      id: synthesize
      model: general_chat
      inputs:
        question: {from: input.question}
        perspectives: {from: steps.synthesis_input.output.perspectives}
        failed_branches: {from: steps.synthesis_input.output.failed_branches}
      messages:
        - {role: system, content: system}
        - {role: user, content: synthesize}
      parameters: {temperature: 0.2}
      response:
        format: json
        schema: {$ref: "#/$defs/SynthesisResult"}

  result:
    return:
      content: {from: steps.synthesize.output.data.content}
      format: markdown
      data:
        object:
          degraded: {from: steps.synthesize.output.data.degraded}

api_version: insight.agent/v3
kind: agent

metadata:
  id: parallel_researcher
  name: Parallel Researcher
  description: Compare independent technical and risk perspectives, then synthesize the available evidence.

types:
  Perspective:
    type: string
    min_length: 1

  SafeBranchError:
    fields:
      kind:
        type: string
        enum: [safe_error]
      code:
        type: string
        min_length: 1
        max_length: 128
        pattern: "^[A-Z][A-Z0-9_]*$"
      message:
        type: string
        min_length: 1
        max_length: 512

  SynthesisFailure:
    fields:
      branch:
        type: string
        enum: [technical, risk]
      error: SafeBranchError

  SynthesisInput:
    fields:
      perspectives:
        type: Perspective[]
        min_items: 1
      failed_branches: SynthesisFailure[]

  SynthesisResult:
    fields:
      content:
        type: string
        min_length: 1
      degraded: boolean

prompts:
  system:
    file: prompts/system.md
  perspective_a:
    file: prompts/perspective_a.md
  perspective_b:
    file: prompts/perspective_b.md
  synthesize:
    file: prompts/synthesize.md

errors:
  all_failed:
    category: workflow
    code: WORKFLOW_ALL_BRANCHES_FAILED
    public_message: No analysis perspective was available.

inputs:
  question:
    type: string
    min_length: 1

output: SynthesisResult

workflow:
  steps:
    - id: analyses
      settle: all_settled
      parallel:
        technical:
          - type: llm
            id: analyze_technical
            model: general_chat
            messages:
              - role: system
                content:
                  - text: system
              - role: user
                content:
                  - text: perspective_a
            parameters: {temperature: 0.2}
            response: Perspective
          - yield: $analyze_technical

        risk:
          - type: llm
            id: analyze_risk
            model: general_chat
            messages:
              - role: system
                content:
                  - text: system
              - role: user
                content:
                  - text: perspective_b
            parameters: {temperature: 0.2}
            response: Perspective
          - yield: $analyze_risk

    - id: synthesis_input
      if: >-
        analyses.technical.kind == 'ok' &&
        analyses.risk.kind == 'ok'
      then:
        - yield:
            perspectives:
              - $analyses.technical.value
              - $analyses.risk.value
            failed_branches: []

      elif:
        - id: technical_only
          when: >-
            analyses.technical.kind == 'ok' &&
            analyses.risk.kind == 'error'
          then:
            - yield:
                perspectives:
                  - $analyses.technical.value
                failed_branches:
                  - branch: risk
                    error: $analyses.risk.error

        - id: risk_only
          when: >-
            analyses.technical.kind == 'error' &&
            analyses.risk.kind == 'ok'
          then:
            - yield:
                perspectives:
                  - $analyses.risk.value
                failed_branches:
                  - branch: technical
                    error: $analyses.technical.error

      else:
        - raise: all_failed

    - type: llm
      id: synthesize
      model: general_chat
      messages:
        - role: system
          content:
            - text: system
        - role: user
          content:
            - text: synthesize
      parameters: {temperature: 0.2}
      response: SynthesisResult

    - return: $synthesize

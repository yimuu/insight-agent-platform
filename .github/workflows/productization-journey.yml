name: Productization starter and feature journey

on:
  workflow_dispatch:
    inputs:
      features:
        description: Closed starter feature set to qualify
        required: true
        default: starter
        type: choice
        options:
          - starter
          - model
          - remote-capability
          - context
          - mcp
          - sandbox
          - all

permissions:
  contents: read

concurrency:
  group: productization-journey-${{ github.ref }}-${{ inputs.features }}
  cancel-in-progress: true

env:
  CI: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  fresh-starter-console:
    name: Fresh starter + ${{ inputs.features }} CLI and real Console journey
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Record fresh-checkout journey start
        run: echo "PLATFORM_PRODUCTIZATION_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v1-productization-starter"
          shared-key: "productization-starter"
          cache-on-failure: "false"
      - name: Enable exact Console package manager
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0
      - name: Run fresh public CLI and real Gateway Console journey
        run: |
          arguments=(
            --project "$RUNNER_TEMP/insight-productization-${{ inputs.features }}"
            --console-browser
            --node-bin "$(command -v node)"
            --browser-bin "$(command -v google-chrome)"
            --report-directory "$RUNNER_TEMP/productization-reports"
          )
          if [[ "${{ inputs.features }}" != "starter" ]]; then
            arguments+=(--features "${{ inputs.features }}")
          fi
          if [[ "${{ inputs.features }}" == "starter" ]]; then
            arguments+=(
              --north-star-report "$RUNNER_TEMP/productization-north-star.json"
              --journey-started-epoch "$PLATFORM_PRODUCTIZATION_STARTED_EPOCH"
              --fresh-checkout
            )
          fi
          scripts/run-productization-journey.sh "${arguments[@]}"
      - name: Preserve bounded runtime diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: productization-${{ inputs.features }}-failure-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/insight-productization-${{ inputs.features }}/.insight/runtime/logs/*.log
            ${{ runner.temp }}/insight-productization-${{ inputs.features }}/.insight/runtime/profile.json
            ${{ runner.temp }}/insight-productization-${{ inputs.features }}/.insight/runtime/processes.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve exact-revision scenario reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: productization-${{ inputs.features }}-scenario-reports-${{ github.sha }}
          path: ${{ runner.temp }}/productization-reports/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve fresh-checkout north-star report
        if: ${{ always() && inputs.features == 'starter' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: productization-starter-north-star-${{ github.sha }}
          path: ${{ runner.temp }}/productization-north-star.json
          if-no-files-found: error
          retention-days: 14

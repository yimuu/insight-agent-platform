name: product-release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: read

concurrency:
  group: product-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RUNTIME_IMAGE: ghcr.io/${{ github.repository }}/platform-runtime
  SANDBOX_RUNNER_IMAGE: ghcr.io/${{ github.repository }}/platform-sandbox-runner
  CONSOLE_IMAGE: ghcr.io/${{ github.repository }}/platform-console

jobs:
  cli:
    name: CLI ${{ matrix.target }}
    environment: product-release
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: Validate exact release version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" "$version" <<'PY'
          import json, pathlib, sys
          metadata = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          package = next(item for item in metadata["packages"] if item["name"] == "insight-cli")
          if package["version"] != sys.argv[2]:
              raise SystemExit("tag and insight-cli package version differ")
          PY
      - name: Build locked release CLI once
        shell: bash
        env:
          INSIGHT_RELEASE_PUBLIC_KEY_BASE64: ${{ secrets.INSIGHT_RELEASE_PUBLIC_KEY_BASE64 }}
          INSIGHT_RELEASE_GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          cargo build --locked --release -p insight-cli --bin insight
          finished=$(date +%s)
          mkdir -p "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/archive"
          cp target/release/insight "$RUNNER_TEMP/release-assets/insight-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          cp target/release/insight "$RUNNER_TEMP/archive/insight"
          cp LICENSE "$RUNNER_TEMP/archive/LICENSE"
          printf '%s\n' "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/archive/VERSION"
          tar -czf "$RUNNER_TEMP/release-assets/insight-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz" \
            -C "$RUNNER_TEMP/archive" insight LICENSE VERSION
          target/release/insight version --json > "$RUNNER_TEMP/release-assets/version-${{ matrix.target }}.json"
          target/release/insight doctor --json > "$RUNNER_TEMP/release-assets/doctor-${{ matrix.target }}.json" || test "$?" -eq 1
          python3 - "$RUNNER_TEMP/release-assets/cli-${{ matrix.target }}.performance.json" "$started" "$finished" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps([{
              "name": "cli_build:${{ matrix.target }}",
              "duration_seconds": int(sys.argv[3]) - int(sys.argv[2]),
              "bytes": pathlib.Path("target/release/insight").stat().st_size,
              "cache_hit": False,
          }], sort_keys=True, separators=(",", ":")))
          PY
      - name: Preserve exact CLI target
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 30

  images:
    name: Immutable multi-architecture images
    runs-on: ubuntu-24.04
    environment: product-release
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.1"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Build immutable Console assets
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          corepack enable
          corepack install --global pnpm@11.19.0
          pnpm --dir web/console install --frozen-lockfile
          pnpm --dir web/console test
          pnpm --dir web/console build
          finished=$(date +%s)
          mkdir -p "$RUNNER_TEMP/release-assets"
          tar -czf "$RUNNER_TEMP/release-assets/console-${GITHUB_REF_NAME#v}.tar.gz" -C web/console/dist .
          printf '%s %s\n' "$started" "$finished" > "$RUNNER_TEMP/console-build.time"
      - name: Mark runtime build start
        run: date +%s > "$RUNNER_TEMP/runtime-start"
      - name: Build and push exact runtime manifest list
        id: runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.RUNTIME_IMAGE }}:build-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=product-release-runtime
          cache-to: type=gha,mode=max,scope=product-release-runtime
      - name: Mark runtime build finish
        run: date +%s > "$RUNNER_TEMP/runtime-finish"
      - name: Mark sandbox runner build start
        run: date +%s > "$RUNNER_TEMP/runner-start"
      - name: Build and push exact sandbox runner manifest list
        id: sandbox_runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: sandbox-runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.SANDBOX_RUNNER_IMAGE }}:build-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=product-release-runtime
      - name: Mark sandbox runner build finish
        run: date +%s > "$RUNNER_TEMP/runner-finish"
      - name: Mark Console image build start
        run: date +%s > "$RUNNER_TEMP/console-image-start"
      - name: Build and push exact Console manifest list
        id: console
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: web/console
          file: web/console/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.CONSOLE_IMAGE }}:build-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=product-release-console
          cache-to: type=gha,mode=max,scope=product-release-console
      - name: Mark Console image build finish
        run: date +%s > "$RUNNER_TEMP/console-image-finish"
      - name: Sign and verify exact image subjects
        timeout-minutes: 10
        shell: bash
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          SANDBOX_RUNNER_DIGEST: ${{ steps.sandbox_runner.outputs.digest }}
          CONSOLE_DIGEST: ${{ steps.console.outputs.digest }}
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/cosign-start"
          for subject in \
            "${RUNTIME_IMAGE}@${RUNTIME_DIGEST}" \
            "${SANDBOX_RUNNER_IMAGE}@${SANDBOX_RUNNER_DIGEST}" \
            "${CONSOLE_IMAGE}@${CONSOLE_DIGEST}"; do
            cosign sign --yes "$subject"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/product-release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$subject"
          done
          date +%s > "$RUNNER_TEMP/cosign-finish"
      - name: Generate exact SPDX SBOM files
        timeout-minutes: 20
        shell: bash
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          SANDBOX_RUNNER_DIGEST: ${{ steps.sandbox_runner.outputs.digest }}
          CONSOLE_DIGEST: ${{ steps.console.outputs.digest }}
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/sbom-start"
          syft "${RUNTIME_IMAGE}@${RUNTIME_DIGEST}" -o spdx-json="$RUNNER_TEMP/release-assets/runtime.spdx.json"
          syft "${SANDBOX_RUNNER_IMAGE}@${SANDBOX_RUNNER_DIGEST}" -o spdx-json="$RUNNER_TEMP/release-assets/sandbox-runner.spdx.json"
          syft "${CONSOLE_IMAGE}@${CONSOLE_DIGEST}" -o spdx-json="$RUNNER_TEMP/release-assets/console.spdx.json"
          date +%s > "$RUNNER_TEMP/sbom-finish"
      - name: Mark provenance start
        run: date +%s > "$RUNNER_TEMP/provenance-start"
      - name: Attest runtime provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.RUNTIME_IMAGE }}
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true
      - name: Attest sandbox runner provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.SANDBOX_RUNNER_IMAGE }}
          subject-digest: ${{ steps.sandbox_runner.outputs.digest }}
          push-to-registry: true
      - name: Attest Console provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.CONSOLE_IMAGE }}
          subject-digest: ${{ steps.console.outputs.digest }}
          push-to-registry: true
      - name: Close image indexes and provenance
        shell: bash
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          SANDBOX_RUNNER_DIGEST: ${{ steps.sandbox_runner.outputs.digest }}
          CONSOLE_DIGEST: ${{ steps.console.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "${RUNTIME_IMAGE}@${RUNTIME_DIGEST}" > "$RUNNER_TEMP/runtime-index.json"
          docker buildx imagetools inspect --raw "${SANDBOX_RUNNER_IMAGE}@${SANDBOX_RUNNER_DIGEST}" > "$RUNNER_TEMP/sandbox-runner-index.json"
          docker buildx imagetools inspect --raw "${CONSOLE_IMAGE}@${CONSOLE_DIGEST}" > "$RUNNER_TEMP/console-index.json"
          python3 scripts/build-release-image-metadata.py \
            --runtime-subject "${RUNTIME_IMAGE}" --runtime-digest "$RUNTIME_DIGEST" --runtime-index "$RUNNER_TEMP/runtime-index.json" \
            --sandbox-runner-subject "${SANDBOX_RUNNER_IMAGE}" --sandbox-runner-digest "$SANDBOX_RUNNER_DIGEST" --sandbox-runner-index "$RUNNER_TEMP/sandbox-runner-index.json" \
            --console-subject "${CONSOLE_IMAGE}" --console-digest "$CONSOLE_DIGEST" --console-index "$RUNNER_TEMP/console-index.json" \
            --output "$RUNNER_TEMP/release-assets/images.json"
          python3 - "$RUNNER_TEMP/release-assets/images.json" "$RUNNER_TEMP/release-assets/build-provenance.intoto.jsonl" <<'PY'
          import json, os, pathlib, sys
          images = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          statement = {"_type": "https://in-toto.io/Statement/v1", "subject": [
              {"name": value["subject"], "digest": {"sha256": value["index_digest"].split(":", 1)[1]}}
              for value in images.values()
          ], "predicateType": "https://slsa.dev/provenance/v1", "predicate": {
              "buildDefinition": {"buildType": "https://insight.platform/build/product-release/v1",
                                  "externalParameters": {"git_commit": os.environ["GITHUB_SHA"], "git_ref": os.environ["GITHUB_REF"]}},
              "runDetails": {"builder": {"id": "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/.github/workflows/product-release.yml"}}
          }}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(statement, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          date +%s > "$RUNNER_TEMP/provenance-finish"
      - name: Measure cold pull and warm reuse
        timeout-minutes: 10
        shell: bash
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          set -euo pipefail
          docker image rm "${RUNTIME_IMAGE}@${RUNTIME_DIGEST}" >/dev/null 2>&1 || true
          date +%s > "$RUNNER_TEMP/cold-start"
          docker pull "${RUNTIME_IMAGE}@${RUNTIME_DIGEST}"
          date +%s > "$RUNNER_TEMP/cold-finish"
          date +%s > "$RUNNER_TEMP/warm-start"
          docker pull "${RUNTIME_IMAGE}@${RUNTIME_DIGEST}"
          date +%s > "$RUNNER_TEMP/warm-finish"
      - name: Record image performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" "$RUNNER_TEMP/release-assets/image.performance.json" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          def elapsed(prefix):
              return int((root / f"{prefix}-finish").read_text()) - int((root / f"{prefix}-start").read_text())
          console_start, console_finish = (int(value) for value in (root / "console-build.time").read_text().split())
          values = [
              {"name": "console_build", "duration_seconds": console_finish - console_start},
              {"name": "runtime_build_push", "duration_seconds": elapsed("runtime")},
              {"name": "sandbox_runner_build_push", "duration_seconds": elapsed("runner")},
              {"name": "console_image_build_push", "duration_seconds": elapsed("console-image")},
              {"name": "sbom", "duration_seconds": elapsed("sbom")},
              {"name": "provenance", "duration_seconds": elapsed("provenance")},
              {"name": "cosign", "duration_seconds": elapsed("cosign")},
              {"name": "cold_pull", "duration_seconds": elapsed("cold")},
              {"name": "warm_reuse", "duration_seconds": elapsed("warm")},
          ]
          pathlib.Path(sys.argv[2]).write_text(json.dumps(values, sort_keys=True, separators=(",", ":")))
          PY
      - name: Preserve exact image release subjects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-release-subjects
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 30

  assemble-release:
    name: Assemble and sign exact release candidate
    needs: [cli, images]
    runs-on: ubuntu-24.04
    environment: product-release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cli-release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-release-subjects
          path: ${{ runner.temp }}/release-assets
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Build canonical release evidence
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          syft "dir:$assets" -o spdx-json="$assets/cli.spdx.json"
          python3 - <<'PY' > "$assets/development-profile-v1.json"
          import json
          print(json.dumps(json.load(open("release/development-profile-v1.json")), sort_keys=True, separators=(",", ":")), end="")
          PY
          python3 scripts/build-release-performance.py \
            --version "${GITHUB_REF_NAME#v}" --git-commit "$GITHUB_SHA" \
            --evidence-directory "$assets" --output "$assets/release-performance.json"
          python3 scripts/build-product-release.py \
            --version "${GITHUB_REF_NAME#v}" --git-commit "$GITHUB_SHA" \
            --created-at "$(git show -s --format=%cI "$GITHUB_SHA" | python3 -c 'import datetime,sys; print(datetime.datetime.fromisoformat(sys.stdin.read().strip()).astimezone(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ"))')" \
            --artifacts "$assets" --images "$assets/images.json" --output "$assets/release-bundle.json"
      - name: Sign and verify canonical ReleaseBundle
        timeout-minutes: 10
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.INSIGHT_RELEASE_PRIVATE_KEY_PEM }}
          RELEASE_PUBLIC_KEY: ${{ secrets.INSIGHT_RELEASE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release-private-key.pem"
          printf '%s' "$RELEASE_PRIVATE_KEY" > "$key"
          python3 scripts/sign-product-release.py \
            --bundle "$RUNNER_TEMP/release-assets/release-bundle.json" --private-key "$key" \
            --public-key-base64="$RELEASE_PUBLIC_KEY" \
            --output "$RUNNER_TEMP/release-assets/release-bundle.signature.json"
          rm -f "$key"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/release-assets/release-bundle.sigstore.json" \
            "$RUNNER_TEMP/release-assets/release-bundle.json"
          cosign verify-blob --bundle "$RUNNER_TEMP/release-assets/release-bundle.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/product-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RUNNER_TEMP/release-assets/release-bundle.json"
      - name: Attest canonical ReleaseBundle
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/release-assets/release-bundle.json
      - name: Preserve signed candidate before qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 30

  development-profile-qualification:
    name: Prebuilt starter cold, warm and idle qualification
    needs: assemble-release
    runs-on: ubuntu-24.04
    environment: product-release
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Measure the official prebuilt starter closure
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/release-assets/insight-${GITHUB_REF_NAME#v}-x86_64-unknown-linux-gnu"
          chmod 0755 "$binary"
          scripts/qualify-development-profile.sh \
            --insight-bin "$binary" \
            --release-assets "$RUNNER_TEMP/release-assets" \
            --network-mbps 100 \
            --stabilization-seconds 300 \
            --output "$RUNNER_TEMP/development-profile-performance.json"
      - name: Preserve machine-readable development evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-profile-performance-${{ github.sha }}
          path: ${{ runner.temp }}/development-profile-performance.json
          if-no-files-found: error
          retention-days: 30

  productization-10-of-10:
    name: Signed-candidate productization 10/10
    needs: assemble-release
    uses: ./.github/workflows/productization-journey.yml
    permissions:
      contents: read
      packages: read
    with:
      features: all
      artifact_mode: signed-release-candidate
      release_candidate_artifact: signed-release-candidate-${{ github.sha }}
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Publish qualified immutable release
    needs: [assemble-release, development-profile-qualification, productization-10-of-10]
    runs-on: ubuntu-24.04
    environment: product-release
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: development-profile-performance-${{ github.sha }}
          path: ${{ runner.temp }}/qualification
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: productization-all-scenario-reports-${{ github.sha }}
          path: ${{ runner.temp }}/qualification/productization-reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: productization-10-of-10-${{ github.sha }}
          path: ${{ runner.temp }}/qualification/productization-aggregate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: productization-all-sandbox-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/qualification/productization-sandbox
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify candidate and reserve immutable release identities
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          test -s "$RUNNER_TEMP/qualification/development-profile-performance.json"
          python3 scripts/check-productization-scenario-reports.py \
            "$RUNNER_TEMP/qualification/productization-reports" \
            --source-revision "$GITHUB_SHA" \
            --sandbox-evidence "$RUNNER_TEMP/qualification/productization-sandbox/productization-opensandbox-evidence.json" \
            --sandbox-environment "$RUNNER_TEMP/qualification/productization-sandbox/productization-sandbox-environment.json" \
            --aggregate-output "$RUNNER_TEMP/qualification/recomputed-productization-10-of-10.json"
          cmp \
            "$RUNNER_TEMP/qualification/recomputed-productization-10-of-10.json" \
            "$RUNNER_TEMP/qualification/productization-aggregate/productization-10-of-10.json"
          cosign verify-blob --bundle "$assets/release-bundle.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/product-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$assets/release-bundle.json"
          cp "$assets/release-bundle.json" \
            "$RUNNER_TEMP/qualification/preliminary-release-bundle.json"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists and cannot be overwritten" >&2
            exit 1
          fi
          for image in "$RUNTIME_IMAGE" "$SANDBOX_RUNNER_IMAGE" "$CONSOLE_IMAGE"; do
            inspect_error="$RUNNER_TEMP/image-tag-inspect-error"
            if docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}" >/dev/null 2>"$inspect_error"; then
              echo "release image tag ${image}:${GITHUB_REF_NAME} already exists and cannot be overwritten" >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|not found' "$inspect_error"; then
              echo "cannot prove release image tag ${image}:${GITHUB_REF_NAME} is unassigned" >&2
              cat "$inspect_error" >&2
              exit 1
            fi
          done
      - name: Finalize and sign qualified ReleaseBundle
        timeout-minutes: 10
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.INSIGHT_RELEASE_PRIVATE_KEY_PEM }}
          RELEASE_PUBLIC_KEY: ${{ secrets.INSIGHT_RELEASE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          assets="$RUNNER_TEMP/release-assets"
          cp "$RUNNER_TEMP/qualification/development-profile-performance.json" \
            "$assets/development-profile-performance.json"
          rm -f "$assets/release-bundle.json" "$assets/release-bundle.signature.json" \
            "$assets/release-bundle.sigstore.json" "$assets/checksums.txt"
          python3 scripts/build-product-release.py \
            --version "${GITHUB_REF_NAME#v}" --git-commit "$GITHUB_SHA" \
            --created-at "$(git show -s --format=%cI "$GITHUB_SHA" | python3 -c 'import datetime,sys; print(datetime.datetime.fromisoformat(sys.stdin.read().strip()).astimezone(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ"))')" \
            --artifacts "$assets" --images "$assets/images.json" \
            --include-development-qualification \
            --include-productization-qualification \
            --productization-aggregate "$RUNNER_TEMP/qualification/productization-aggregate/productization-10-of-10.json" \
            --productization-report-directory "$RUNNER_TEMP/qualification/productization-reports" \
            --productization-sandbox-evidence "$RUNNER_TEMP/qualification/productization-sandbox/productization-opensandbox-evidence.json" \
            --productization-sandbox-environment "$RUNNER_TEMP/qualification/productization-sandbox/productization-sandbox-environment.json" \
            --productization-release-candidate-bundle "$RUNNER_TEMP/qualification/preliminary-release-bundle.json" \
            --output "$assets/release-bundle.json"
          key="$RUNNER_TEMP/release-private-key.pem"
          printf '%s' "$RELEASE_PRIVATE_KEY" > "$key"
          python3 scripts/sign-product-release.py \
            --bundle "$assets/release-bundle.json" --private-key "$key" \
            --public-key-base64="$RELEASE_PUBLIC_KEY" \
            --output "$assets/release-bundle.signature.json"
          rm -f "$key"
          cosign sign-blob --yes --bundle "$assets/release-bundle.sigstore.json" \
            "$assets/release-bundle.json"
          cosign verify-blob --bundle "$assets/release-bundle.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/product-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$assets/release-bundle.json"
      - name: Attest qualified ReleaseBundle
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/release-assets/release-bundle.json
      - name: Publish exact qualified image tags
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          runtime_digest="$(jq -r '.runtime.index_digest' "$assets/images.json")"
          sandbox_digest="$(jq -r '.sandbox_runner.index_digest' "$assets/images.json")"
          console_digest="$(jq -r '.console.index_digest' "$assets/images.json")"
          docker buildx imagetools create --tag "${RUNTIME_IMAGE}:${GITHUB_REF_NAME}" "${RUNTIME_IMAGE}@${runtime_digest}"
          docker buildx imagetools create --tag "${SANDBOX_RUNNER_IMAGE}:${GITHUB_REF_NAME}" "${SANDBOX_RUNNER_IMAGE}@${sandbox_digest}"
          docker buildx imagetools create --tag "${CONSOLE_IMAGE}:${GITHUB_REF_NAME}" "${CONSOLE_IMAGE}@${console_digest}"
      - name: Publish immutable GitHub Release assets
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets"/* \
            --verify-tag --title "Insight Agent Platform $GITHUB_REF_NAME" \
            --notes "Signed product release for exact commit $GITHUB_SHA."

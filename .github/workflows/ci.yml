name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CI: "1"
  CARGO_TERM_COLOR: always
  # CI runners are disposable. Incremental state and full debug information
  # consume substantial disk without improving reuse across jobs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      quick: ${{ steps.classify.outputs.quick }}
      cli: ${{ steps.classify.outputs.cli }}
      console: ${{ steps.classify.outputs.console }}
      runtime: ${{ steps.classify.outputs.runtime }}
      mcp_interop: ${{ steps.classify.outputs.mcp_interop }}
      policy: ${{ steps.classify.outputs.policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve closed CI lane set
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            python3 scripts/classify-ci-paths.py --all --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA" > changed-paths.txt
          else
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > changed-paths.txt
          fi
          python3 scripts/classify-ci-paths.py changed-paths.txt --github-output "$GITHUB_OUTPUT"

  quick:
    name: Quick contracts
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cutover and Productization contracts
        run: |
          bash scripts/check-cutover-residuals.sh
          python3 scripts/check-productization-m0.py
          python3 scripts/check-productization-ci.py
          python3 scripts/check-productization-scenario-reports.py \
            tests/fixtures/productization-reports/incomplete \
            --allow-incomplete \
            --source-revision 0000000000000000000000000000000000000000
          python3 -m unittest \
            scripts/tests/test_classify_ci_paths.py \
            scripts/tests/test_productization_base_journey_runner.py \
            scripts/tests/test_productization_scenario_reports.py

  lint:
    name: Workspace lint and checks
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Check Platform v1 machine contracts and fixtures
        run: |
          python3 scripts/check-platform-v1-contracts.py
          cargo run --locked -p insight-platform-contracts --bin check-platform-contracts
          cargo run --locked -p insight-platform-contracts --bin platform-qualification -- \
            validate-production-profile \
            contracts/platform-v1/qualification/production-release-profile.json
      - name: Check production qualification topology preflight
        run: |
          python3 -m unittest \
            scripts/tests/test_platform_production_topology.py \
            scripts/tests/test_platform_gvisor_rbac.py \
            scripts/tests/test_platform_gvisor_admission.py \
            scripts/tests/test_platform_candidate_pipeline.py
          bash -n scripts/preflight-platform-production-qualification.sh
      - name: Check signed candidate pipeline contract
        run: python3 scripts/check-platform-candidate-pipeline.py
      - name: Check Platform v1 PostgreSQL schema contract
        run: python3 scripts/check-platform-postgres-schema.py && cargo run --locked -p insight-platform-postgres --bin check-platform-schema-contract
      - name: Check crate boundaries and dependency feature baseline
        run: bash scripts/check-crate-boundaries.sh
      - name: Install Helm for Sandbox deployment contract
        uses: azure/setup-helm@v4
      - name: Check closed ComponentRole workload closure
        run: ruby scripts/check-platform-component-workload-closure.rb
      - name: Check Sandbox deployment contract
        run: bash scripts/check-platform-sandbox-deployment.sh
      - name: Check Security Authority and Egress deployment boundary
        run: bash scripts/check-platform-security-deployment.sh
      - name: Check Model Worker deployment boundary
        run: bash scripts/check-platform-model-worker-deployment.sh
      - name: Check Context Worker deployment boundary
        run: bash scripts/check-platform-context-worker-deployment.sh
      - name: Check Remote Context Worker deployment boundary
        run: bash scripts/check-platform-remote-context-worker-deployment.sh
      - name: Check Orchestration Worker deployment boundary
        run: bash scripts/check-platform-orchestration-worker-deployment.sh
      - name: Check Artifact Broker deployment boundary
        run: bash scripts/check-platform-artifact-deployment.sh
      - name: Check observability dashboards and alerts
        run: bash scripts/check-platform-observability-deployment.sh
      - name: Check production telemetry redaction
        run: python3 scripts/check-platform-observability-redaction.py
      - name: Check callback API deployment boundary
        run: bash scripts/check-platform-callback-deployment.sh
      - name: Check MCP cleanup worker deployment boundary
        run: bash scripts/check-platform-mcp-cleanup-deployment.sh
      - name: Check root public API baseline
        run: CARGO_TARGET_DIR=target bash scripts/check-public-api-baseline.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Workspace full tests
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    env:
      # Durable fixtures share one freshly provisioned PostgreSQL authority and use fixed nominal
      # identities; each fixture exercises its own internal concurrency, but fixture processes
      # must not race one another for the same authority rows or tracing dispatcher.
      RUST_TEST_THREADS: "1"
      RUN_HISTORY_POSTGRES_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
      # All durable PostgreSQL gates exercise the same real PG16 service in CI.
      TEST_POSTGRES_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
      PLATFORM_TEST_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
      # Model conformance performs consecutive global WDRR claims and therefore needs an
      # independent durable authority rather than competing with earlier fixture tenants.
      PLATFORM_MODEL_TEST_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_model
      TEST_NATS_URL: nats://localhost:4222
      PLATFORM_TEST_NATS_URL: nats://localhost:4222
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: insight_agent_platform
          POSTGRES_USER: insight
          POSTGRES_PASSWORD: insight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insight -d insight_agent_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Provision clean-cut Platform PostgreSQL baseline
        env:
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
        run: bash scripts/provision-platform-postgres.sh
      - name: Provision isolated Model conformance baseline
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_model
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_model
          bash scripts/provision-platform-postgres.sh
      - name: Create fresh schema-provisioning fixture
        env:
          PGPASSWORD: insight
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_provision
      - name: Provision Security Authority least-privilege role
        env:
          PLATFORM_DATABASE_ADMIN_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
          PLATFORM_SECURITY_AUTHORITY_ROLE: platform_security_authority_qualification
        run: |
          psql "$PLATFORM_DATABASE_ADMIN_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command 'CREATE ROLE platform_security_authority_qualification NOLOGIN'
          bash scripts/provision-platform-security-authority-role.sh
      - name: Provision Artifact role permission matrix
        env:
          PLATFORM_DATABASE_ADMIN_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
          PLATFORM_ARTIFACT_GATEWAY_ROLE: platform_artifact_gateway_qualification
          PLATFORM_ARTIFACT_DATA_READER_ROLE: platform_artifact_data_reader_qualification
          PLATFORM_ARTIFACT_DATA_WORKER_ROLE: platform_artifact_data_worker_qualification
          PLATFORM_ARTIFACT_MAINTENANCE_ROLE: platform_artifact_maintenance_qualification
        run: |
          psql "$PLATFORM_DATABASE_ADMIN_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command 'CREATE ROLE platform_artifact_gateway_qualification NOLOGIN; CREATE ROLE platform_artifact_data_reader_qualification NOLOGIN; CREATE ROLE platform_artifact_data_worker_qualification NOLOGIN; CREATE ROLE platform_artifact_maintenance_qualification NOLOGIN'
          bash scripts/provision-platform-artifact-roles.sh
      - name: Test
        env:
          PLATFORM_TEST_PROVISION_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_provision
          PLATFORM_SECURITY_AUTHORITY_TEST_ROLE: platform_security_authority_qualification
          PLATFORM_ARTIFACT_DATA_READER_TEST_ROLE: platform_artifact_data_reader_qualification
          PLATFORM_ARTIFACT_GATEWAY_TEST_ROLE: platform_artifact_gateway_qualification
          PLATFORM_ARTIFACT_DATA_WORKER_TEST_ROLE: platform_artifact_data_worker_qualification
          PLATFORM_ARTIFACT_MAINTENANCE_TEST_ROLE: platform_artifact_maintenance_qualification
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Documentation tests
        run: cargo test --locked --workspace --doc --all-features

  cli:
    name: Affected CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true' && needs.changes.outputs.runtime != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-cli"
          shared-key: "cli"
          cache-on-failure: "false"
      - name: Check CLI formatting and component
        run: |
          cargo fmt --all -- --check
          cargo check --locked -p insight-cli --all-targets
          cargo clippy --locked -p insight-cli --all-targets -- -D warnings
      - name: Test CLI and compile Productization journeys
        run: |
          cargo test --locked -p insight-cli
          cargo test --locked --test productization --no-run

  console:
    name: Affected Console
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install exact Console dependencies
        run: corepack pnpm --dir web/console install --frozen-lockfile
      - name: Test, build and lint Console
        run: |
          corepack pnpm --dir web/console test
          corepack pnpm --dir web/console build
          corepack pnpm --dir web/console lint

  mcp-interop:
    name: MCP external SDK interoperability
    needs: changes
    if: needs.changes.outputs.mcp_interop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tests/interop/go/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Qualify modern MCP and Tasks against two pinned SDKs
        run: bash scripts/qualify-mcp-external-sdk.sh
      - name: Preserve qualification report
        uses: actions/upload-artifact@v4
        with:
          name: mcp-external-sdk-qualification
          path: target/mcp-qualification/report.json
          if-no-files-found: error

  policy:
    name: Dependency policy
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Install dependency policy tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
      - name: Audit advisories
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check

  required:
    name: Required CI summary
    if: always()
    needs: [changes, quick, lint, test, cli, console, mcp-interop, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Reject any selected lane failure
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUICK_RESULT: ${{ needs.quick.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          CONSOLE_RESULT: ${{ needs.console.result }}
          MCP_RESULT: ${{ needs.mcp-interop.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" "$QUICK_RESULT" "$LINT_RESULT" "$TEST_RESULT" \
            "$CLI_RESULT" "$CONSOLE_RESULT" "$MCP_RESULT" "$POLICY_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CI: "1"
  CARGO_TERM_COLOR: always
  # CI runners are disposable. Incremental state and full debug information
  # consume substantial disk without improving reuse across jobs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Check DSL cutover residuals
        run: bash scripts/check-cutover-residuals.sh
      - name: Check crate boundaries and dependency feature baseline
        run: bash scripts/check-crate-boundaries.sh
      - name: Check root public API baseline
        run: CARGO_TARGET_DIR=target bash scripts/check-public-api-baseline.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      RUN_HISTORY_POSTGRES_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
      # All durable PostgreSQL gates exercise the same real PG16 service in CI.
      TEST_POSTGRES_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: insight_agent_platform
          POSTGRES_USER: insight
          POSTGRES_PASSWORD: insight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insight -d insight_agent_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Documentation tests
        run: cargo test --locked --workspace --doc --all-features

  policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Install dependency policy tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
      - name: Audit advisories
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check

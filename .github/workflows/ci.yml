name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CI: "1"
  CARGO_TERM_COLOR: always
  # CI runners are disposable. Incremental state and full debug information
  # consume substantial disk without improving reuse across jobs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      quick: ${{ steps.classify.outputs.quick }}
      cli: ${{ steps.classify.outputs.cli }}
      console: ${{ steps.classify.outputs.console }}
      runtime: ${{ steps.classify.outputs.runtime }}
      policy: ${{ steps.classify.outputs.policy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve closed CI lane set
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            python3 tools/checks/classify-ci-paths.py --all --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA" > changed-paths.txt
          else
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > changed-paths.txt
          fi
          python3 tools/checks/classify-ci-paths.py changed-paths.txt --github-output "$GITHUB_OUTPUT"

  quick:
    name: Quick contracts
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check cutover and Productization contracts
        run: |
          bash tools/checks/check-cutover-residuals.sh
          python3 tools/checks/check-productization-m0.py
          python3 tools/checks/check-productization-ci.py
          python3 tools/checks/check-product-release.py
          python3 tools/checks/check-productization-scenario-reports.py \
            tests/fixtures/productization-reports/incomplete \
            --allow-incomplete \
            --source-revision 0000000000000000000000000000000000000000
          python3 -m unittest \
            tools/tests/test_classify_ci_paths.py \
            tools/tests/test_platform_observability_redaction.py \
            tools/tests/test_required_ci_results.py \
            tools/tests/test_rust_integration_lanes.py \
            tools/tests/test_productization_journey_runner.py \
            tools/tests/test_fixture_project.py \
            tools/tests/test_document_review.py \
            tools/tests/test_public_release_images.py \
            tools/tests/test_native_release_images.py \
            tools/tests/test_kind_diagnostics.py \
            tools/tests/test_prepare_productization_release_candidate.py \
            tools/tests/test_productization_http_lifecycle.py \
            tools/tests/test_productization_north_star_report.py \
            tools/tests/test_productization_scenario_reports.py \
            tools/tests/test_productization_sandbox_qualification.py \
            tools/tests/test_inspect_platform_oci_image.py \
            tools/tests/test_verify_platform_sandbox_package_image.py \
            tools/tests/test_platform_kind_l4_opensandbox_probe.py \
            tools/tests/test_development_profile_performance.py \
            tools/tests/test_product_release.py

  lint:
    name: Static contracts and formatting
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Check Platform v1 machine contracts and fixtures
        run: python3 tools/checks/check-platform-v1-contracts.py
      - name: Check production qualification topology preflight
        run: |
          python3 -m unittest \
            tools/tests/test_platform_production_topology.py \
            tools/tests/test_platform_production_workloads.py \
            tools/tests/test_platform_candidate_pipeline.py
          bash -n tools/qualification/preflight-platform-production-qualification.sh
      - name: Check signed candidate pipeline contract
        run: python3 tools/checks/check-platform-candidate-pipeline.py
      - name: Check Platform v1 PostgreSQL schema contract
        run: python3 tools/checks/check-platform-postgres-schema.py
      - name: Check crate boundaries and dependency feature baseline
        run: bash tools/checks/check-crate-boundaries.sh
      - name: Install Helm for Sandbox deployment contract
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - name: Verify generated Kind configs, executable identities, TLS names and chart closure
        run: python3 -m unittest discover -s tools/tests -p test_platform_kind_configuration.py
      - name: Check closed ComponentRole workload closure
        run: ruby tools/checks/check-platform-component-workload-closure.rb
      - name: Check Sandbox deployment contract
        run: bash tools/checks/check-platform-sandbox-deployment.sh
      - name: Check Security Authority and Egress deployment boundary
        run: bash tools/checks/check-platform-security-deployment.sh
      - name: Check Model Worker deployment boundary
        run: bash tools/checks/check-platform-model-worker-deployment.sh
      - name: Check Context Worker deployment boundary
        run: bash tools/checks/check-platform-context-worker-deployment.sh
      - name: Check Remote Context Worker deployment boundary
        run: bash tools/checks/check-platform-remote-context-worker-deployment.sh
      - name: Check Orchestration Worker deployment boundary
        run: bash tools/checks/check-platform-orchestration-worker-deployment.sh
      - name: Check Artifact Broker deployment boundary
        run: bash tools/checks/check-platform-artifact-deployment.sh
      - name: Check observability dashboards and alerts
        run: bash tools/checks/check-platform-observability-deployment.sh
      - name: Check production telemetry redaction
        run: python3 tools/checks/check-platform-observability-redaction.py
      - name: Check callback API deployment boundary
        run: bash tools/checks/check-platform-callback-deployment.sh
      - name: Check Outbox worker deployment boundary
        run: bash tools/checks/check-platform-outbox-deployment.sh
      - name: Check History maintenance deployment boundary
        run: bash tools/checks/check-platform-history-maintenance-deployment.sh
      - name: Check MCP cleanup worker deployment boundary
        run: bash tools/checks/check-platform-mcp-cleanup-deployment.sh
      - name: Format
        run: cargo fmt --all -- --check

  test:
    name: Workspace Rust verification
    needs: [changes, quick, lint]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    env:
      # Durable fixtures share one freshly provisioned PostgreSQL authority and use fixed nominal
      # identities; each fixture exercises its own internal concurrency, but fixture processes
      # must not race one another for the same authority rows or tracing dispatcher.
      RUST_TEST_THREADS: "1"
    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: insight_agent_platform
          POSTGRES_USER: insight
          POSTGRES_PASSWORD: insight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insight -d insight_agent_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      nats:
        image: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Run authoritative Rust contract validators
        run: |
          cargo run --locked -p insight-platform-contract-tooling --bin check-platform-contracts
          cargo run --locked -p insight-platform-contract-tooling --bin platform-qualification -- \
            validate-production-profile \
            contracts/platform-v1/qualification/production-release-profile.json
          cargo run --locked -p insight-platform-storage-tooling --bin check-platform-schema-contract
      - name: Provision current Platform PostgreSQL snapshot
        env:
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
        run: bash tools/development/provision-platform-postgres.sh
      - name: Verify Kind database roles against isolated PostgreSQL
        run: |
          cargo build --locked -p insight-platform-storage-tooling --bin platform-database-role
          python3 tools/qualification/qualify-platform-kind-database-roles.py --schema-bin target/debug/platform-schema --role-bin target/debug/platform-database-role
      - name: Provision isolated Model conformance authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_model
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_model
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated Run kernel transaction authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_run_kernel
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_run_kernel
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated History retention authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_history
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_history
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated Evaluation execution authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_evaluation
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_evaluation
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated Installation bootstrap authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_installation
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_installation
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated Development bootstrap authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_dev_bootstrap
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_dev_bootstrap
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated Orchestration coordinator authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_orchestration
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_orchestration
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated Orchestration Q1 authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_orchestration_q1
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_orchestration_q1
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated Orchestration claim isolation authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_orchestration_isolation
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_orchestration_isolation
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated Controller transaction authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_controller_transaction
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_controller_transaction
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated History process authority
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_history_process
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_history_process
          bash tools/development/provision-platform-postgres.sh
      - name: Provision isolated Outbox authority and JetStream fixture
        env:
          PGPASSWORD: insight
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_outbox
          PLATFORM_DATABASE_ADMIN_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_outbox
          PLATFORM_OUTBOX_WORKER_ROLE: platform_outbox_qualification
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_outbox
          bash tools/development/provision-platform-postgres.sh
          psql "$PLATFORM_DATABASE_ADMIN_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command 'CREATE ROLE platform_outbox_qualification NOLOGIN'
          bash tools/development/provision-platform-outbox-role.sh
          docker run --detach --name insight-outbox-qualification --publish 127.0.0.1:4223:4222 nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927 --jetstream --store_dir /data/jetstream
      - name: Provision isolated mTLS publication permission fixture
        run: |
          python3 tools/qualification/prepare-outbox-tls-fixture.py "$RUNNER_TEMP/outbox-tls"
          docker run --detach --name insight-outbox-tls-qualification --publish 127.0.0.1:4224:4222 --mount type=bind,source="$RUNNER_TEMP/outbox-tls",target=/etc/nats/tls,readonly --mount type=bind,source="$RUNNER_TEMP/outbox-tls/nats.conf",target=/etc/nats/nats.conf,readonly nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927 --config=/etc/nats/nats.conf
      - name: Create fresh schema-provisioning fixture
        env:
          PGPASSWORD: insight
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_provision
      - name: Create isolated transactional schema unit fixtures
        env:
          PGPASSWORD: insight
        run: |
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_partition_unit
          createdb --host localhost --username insight --no-password --maintenance-db postgres insight_agent_platform_inventory_unit
      - name: Provision Security Authority least-privilege role
        env:
          PLATFORM_DATABASE_ADMIN_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
          PLATFORM_SECURITY_AUTHORITY_ROLE: platform_security_authority_qualification
        run: |
          psql "$PLATFORM_DATABASE_ADMIN_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command 'CREATE ROLE platform_security_authority_qualification NOLOGIN'
          bash tools/development/provision-platform-security-authority-role.sh
      - name: Provision Artifact role permission matrix
        env:
          PLATFORM_DATABASE_ADMIN_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
          PLATFORM_ARTIFACT_GATEWAY_ROLE: platform_artifact_gateway_qualification
          PLATFORM_ARTIFACT_DATA_READER_ROLE: platform_artifact_data_reader_qualification
          PLATFORM_ARTIFACT_DATA_WORKER_ROLE: platform_artifact_data_worker_qualification
          PLATFORM_ARTIFACT_MAINTENANCE_ROLE: platform_artifact_maintenance_qualification
        run: |
          psql "$PLATFORM_DATABASE_ADMIN_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command 'CREATE ROLE platform_artifact_gateway_qualification NOLOGIN; CREATE ROLE platform_artifact_data_reader_qualification NOLOGIN; CREATE ROLE platform_artifact_data_worker_qualification NOLOGIN; CREATE ROLE platform_artifact_maintenance_qualification NOLOGIN'
          bash tools/development/provision-platform-artifact-roles.sh
      - name: Test
        env:
          PLATFORM_TEST_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
          # Model conformance performs consecutive global WDRR claims and therefore needs an
          # independent durable authority rather than competing with earlier fixture tenants.
          PLATFORM_MODEL_TEST_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_model
          PLATFORM_TEST_RUN_KERNEL_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_run_kernel
          PLATFORM_TEST_EVALUATION_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_evaluation
          PLATFORM_TEST_INSTALLATION_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_installation
          PLATFORM_TEST_DEV_BOOTSTRAP_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_dev_bootstrap
          PLATFORM_TEST_PARTITION_SCHEDULER_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_partition_unit
          PLATFORM_TEST_SCHEMA_INVENTORY_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_inventory_unit
          PLATFORM_TEST_ORCHESTRATION_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_orchestration
          PLATFORM_TEST_ORCHESTRATION_Q1_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_orchestration_q1
          PLATFORM_TEST_ORCHESTRATION_ISOLATION_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_orchestration_isolation
          PLATFORM_TEST_CONTROLLER_TRANSACTION_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_controller_transaction
          PLATFORM_TEST_NATS_URL: nats://localhost:4222
          PLATFORM_TEST_HISTORY_PROCESS_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_history_process
          PLATFORM_TEST_HISTORY_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_history
          PLATFORM_OUTBOX_TEST_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_outbox
          PLATFORM_OUTBOX_TEST_NATS_URL: nats://localhost:4223
          PLATFORM_OUTBOX_TEST_ROLE: platform_outbox_qualification
          PLATFORM_OUTBOX_TLS_TEST_NATS_URL: tls://localhost:4224
          PLATFORM_OUTBOX_TLS_TEST_DIRECTORY: ${{ runner.temp }}/outbox-tls
          PLATFORM_TEST_PROVISION_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform_provision
          PLATFORM_SECURITY_AUTHORITY_TEST_ROLE: platform_security_authority_qualification
          PLATFORM_ARTIFACT_DATA_READER_TEST_ROLE: platform_artifact_data_reader_qualification
          PLATFORM_ARTIFACT_GATEWAY_TEST_ROLE: platform_artifact_gateway_qualification
          PLATFORM_ARTIFACT_DATA_WORKER_TEST_ROLE: platform_artifact_data_worker_qualification
          PLATFORM_ARTIFACT_MAINTENANCE_TEST_ROLE: platform_artifact_maintenance_qualification
        run: |
          cargo test --locked --workspace --all-targets --all-features --no-run
          cargo test --locked --workspace --lib --bins --all-features
          python3 tools/ci/run-rust-integration-tests.py
      - name: Verify independent disposable project cleanup
        run: |
          cargo build --locked --all-features -p insight-cli --bin insight
          python3 tools/qualification/qualify-fixture-cleanup.py --insight-bin target/debug/insight \
            | tee "$RUNNER_TEMP/fixture-cleanup.log"
      - name: Preserve fixture cleanup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-cleanup-${{ github.job }}-${{ github.sha }}
          path: ${{ runner.temp }}/fixture-cleanup.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify durable publication after JetStream restart
        env:
          PLATFORM_OUTBOX_TEST_NATS_URL: nats://localhost:4223
        run: |
          docker restart insight-outbox-qualification
          python3 - <<'PY'
          import os, socket, time
          from urllib.parse import urlsplit
          endpoint = urlsplit(os.environ["PLATFORM_OUTBOX_TEST_NATS_URL"])
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection((endpoint.hostname, endpoint.port), timeout=1) as connection:
                      greeting = connection.makefile("rb").readline(65536)
                      if greeting.startswith(b"INFO ") and greeting.endswith(b"\r\n"):
                          break
              except OSError:
                  pass
              time.sleep(0.1)
          else:
              raise SystemExit("restarted NATS fixture did not become ready")
          PY
          cargo test --locked -p insight-platform-outbox-worker --test durable_delivery accepted_notice_survives_jetstream_process_restart -- --ignored --exact
      - name: Verify Model live publication with actual mTLS NATS
        env:
          PLATFORM_TEST_NATS_URL: tls://localhost:4224
          PLATFORM_TEST_NATS_CA_PATH: ${{ runner.temp }}/outbox-tls/ca.pem
          PLATFORM_TEST_NATS_CERT_PATH: ${{ runner.temp }}/outbox-tls/live.pem
          PLATFORM_TEST_NATS_KEY_PATH: ${{ runner.temp }}/outbox-tls/live-key.pem
        run: bash tools/qualification/qualify-platform-model-live-nats.sh
      - name: Documentation tests
        run: cargo test --locked --workspace --doc --all-features
      - name: Clippy workspace crates without dependency relint
        run: cargo clippy --locked --workspace --all-targets --all-features --no-deps -- -D warnings

  cli:
    name: Affected CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true' && needs.changes.outputs.runtime != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v1-cli"
          shared-key: "cli"
          cache-on-failure: "false"
      - name: Check CLI formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p insight-cli --all-targets --no-deps -- -D warnings
      - name: Test CLI and compile Productization journeys
        run: |
          cargo test --locked -p insight-cli
          cargo test --locked -p insight-platform-qualification-tests --test productization --no-run
      - name: Verify independent disposable project cleanup
        run: |
          cargo build --locked -p insight-cli --bin insight
          python3 tools/qualification/qualify-fixture-cleanup.py --insight-bin target/debug/insight \
            | tee "$RUNNER_TEMP/fixture-cleanup.log"
      - name: Preserve fixture cleanup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-cleanup-${{ github.job }}-${{ github.sha }}
          path: ${{ runner.temp }}/fixture-cleanup.log
          if-no-files-found: warn
          retention-days: 14

  console:
    name: Affected Console
    needs: changes
    if: needs.changes.outputs.console == 'true'
    # The Console qualification executes the checked-in bundle in the Chrome
    # supplied by this documented GitHub runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - name: Install exact shared compiler WASM binding tool
        run: cargo install --locked wasm-bindgen-cli --version 0.2.126
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.1"
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0
      - name: Install exact Console dependencies
        run: corepack pnpm --dir apps/console install --frozen-lockfile
      - name: Test, build and lint Console
        run: |
          corepack pnpm --dir apps/console test
          corepack pnpm --dir apps/console build
          corepack pnpm --dir apps/console lint
          corepack pnpm --dir apps/console browser:fixture:qualify
      - name: Measure actual native and WASM compiler resource use
        run: |
          cargo build --locked -p insight-platform-contract-tooling --bin agent_compiler_resources
          node apps/console/tests/compiler-resources.mjs target/debug/agent_compiler_resources "$RUNNER_TEMP/compiler-resources.json"
      - name: Retain compiler resource observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-resource-observations
          path: ${{ runner.temp }}/compiler-resources.json
          if-no-files-found: error
          retention-days: 14

  policy:
    name: Dependency policy
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Install dependency policy tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
      - name: Audit advisories
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check

  required:
    name: Required CI summary
    if: always()
    needs: [changes, quick, lint, test, cli, console, policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject any selected lane failure
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUICK_RESULT: ${{ needs.quick.result }}
          RUNTIME_SELECTED: ${{ needs.changes.outputs.runtime }}
          CLI_SELECTED: ${{ needs.changes.outputs.cli }}
          CONSOLE_SELECTED: ${{ needs.changes.outputs.console }}
          POLICY_SELECTED: ${{ needs.changes.outputs.policy }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          CONSOLE_RESULT: ${{ needs.console.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          python3 tools/checks/check-required-ci-results.py \
            --runtime-selected "$RUNTIME_SELECTED" \
            --cli-selected "$CLI_SELECTED" \
            --console-selected "$CONSOLE_SELECTED" \
            --policy-selected "$POLICY_SELECTED" \
            --changes-result "$CHANGES_RESULT" \
            --quick-result "$QUICK_RESULT" \
            --lint-result "$LINT_RESULT" \
            --test-result "$TEST_RESULT" \
            --cli-result "$CLI_RESULT" \
            --console-result "$CONSOLE_RESULT" \
            --policy-result "$POLICY_RESULT"

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CI: "1"
  CARGO_TERM_COLOR: always
  # CI runners are disposable. Incremental state and full debug information
  # consume substantial disk without improving reuse across jobs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Check DSL cutover residuals
        run: bash scripts/check-cutover-residuals.sh
      - name: Check Platform v1 machine contracts and fixtures
        run: python3 scripts/check-platform-v1-contracts.py && cargo run --locked -p insight-platform-contracts --bin check-platform-contracts
      - name: Check Platform v1 PostgreSQL schema contract
        run: python3 scripts/check-platform-postgres-schema.py && cargo run --locked -p insight-platform-postgres --bin check-platform-schema-contract
      - name: Check crate boundaries and dependency feature baseline
        run: bash scripts/check-crate-boundaries.sh
      - name: Install Helm for Sandbox deployment contract
        uses: azure/setup-helm@v4
      - name: Check Sandbox deployment contract
        run: bash scripts/check-platform-sandbox-deployment.sh
      - name: Check Security Authority and Egress deployment boundary
        run: bash scripts/check-platform-security-deployment.sh
      - name: Check MCP OAuth cleanup deployment boundary
        run: bash scripts/check-platform-mcp-cleanup-deployment.sh
      - name: Check Model Worker deployment boundary
        run: bash scripts/check-platform-model-worker-deployment.sh
      - name: Check callback API deployment boundary
        run: bash scripts/check-platform-callback-deployment.sh
      - name: Check root public API baseline
        run: CARGO_TARGET_DIR=target bash scripts/check-public-api-baseline.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      RUN_HISTORY_POSTGRES_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
      # All durable PostgreSQL gates exercise the same real PG16 service in CI.
      TEST_POSTGRES_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
      PLATFORM_TEST_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
      TEST_NATS_URL: nats://localhost:4222
      PLATFORM_TEST_NATS_URL: nats://localhost:4222
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: insight_agent_platform
          POSTGRES_USER: insight
          POSTGRES_PASSWORD: insight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insight -d insight_agent_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Provision clean-cut Platform PostgreSQL baseline
        env:
          PLATFORM_DATABASE_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
        run: bash scripts/provision-platform-postgres.sh
      - name: Provision Security Authority least-privilege role
        env:
          PLATFORM_DATABASE_ADMIN_URL: postgres://insight:insight@localhost:5432/insight_agent_platform
          PLATFORM_SECURITY_AUTHORITY_ROLE: platform_security_authority_qualification
        run: |
          psql "$PLATFORM_DATABASE_ADMIN_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command 'CREATE ROLE platform_security_authority_qualification NOLOGIN'
          bash scripts/provision-platform-security-authority-role.sh
      - name: Test
        env:
          PLATFORM_SECURITY_AUTHORITY_TEST_ROLE: platform_security_authority_qualification
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Documentation tests
        run: cargo test --locked --workspace --doc --all-features

  mcp-interop:
    name: MCP external SDK interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tests/interop/go/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Qualify modern MCP and Tasks against two pinned SDKs
        run: bash scripts/qualify-mcp-external-sdk.sh
      - name: Preserve qualification report
        uses: actions/upload-artifact@v4
        with:
          name: mcp-external-sdk-qualification
          path: target/mcp-qualification/report.json
          if-no-files-found: error

  policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-registry-only"
          shared-key: "registry-only"
          cache-targets: "false"
          cache-on-failure: "false"
      - name: Install dependency policy tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
      - name: Audit advisories
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check

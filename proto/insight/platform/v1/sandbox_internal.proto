syntax = "proto3";

package insight.platform.v1;

// Internal-only Sandbox authority service. Every payload is strict canonical JSON for a closed
// Rust domain type; protobuf owns transport versioning and never provides an extension bag.
service SandboxExecutorAuthorityService {
  rpc ClaimSandboxJobs(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
  rpc CommitSandboxPhase(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
  rpc CommitSandboxOutcome(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
  rpc HeartbeatSandboxExecution(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
}

service SandboxExecutorBrokerService {
  rpc ReadExactArtifact(ClosedSandboxEnvelope) returns (stream SandboxArtifactChunkEnvelope);
  rpc ValidateWasiValue(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
  rpc RevokeWasiGrants(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
  rpc ProveSandboxProcessGenerationAbsent(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
}

// Executor-only registration endpoint. The attestor observes node/runtime identity on behalf of
// the Executor; the Executor never talks to Kubernetes or the container runtime directly.
service SandboxExecutorProcessRegistrationService {
  rpc RegisterWasiExecutorProcessGeneration(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
}

// Controller-only verification/recovery endpoint on the independently deployed attestor.
service SandboxProcessIsolationAttestorService {
  rpc VerifyWasiExecutorProcessGeneration(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
  rpc ProveSandboxProcessGenerationAbsent(ClosedSandboxEnvelope) returns (ClosedSandboxEnvelope);
}

message ClosedSandboxEnvelope {
  uint32 schema_version = 1;
  bytes canonical_json = 2;
  string payload_digest = 3;
}

message SandboxArtifactChunkEnvelope {
  uint32 schema_version = 1;
  uint64 sequence = 2;
  bytes value = 3;
  string chunk_digest = 4;
  uint64 total_bytes = 5;
  string content_digest = 6;
}

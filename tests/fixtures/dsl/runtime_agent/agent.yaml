api_version: insight.agent/v1
kind: agent

metadata:
  id: runtime_fixture
  name: Runtime fixture
  description: Durable production Run service fixture

inputs:
  question: string

output: string

workflow:
  steps:
    - id: answer
      type: action
      call: fixture.answer
      inputs:
        question: $question
      response: string

    - return: $answer

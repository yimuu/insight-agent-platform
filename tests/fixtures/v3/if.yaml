api_version: insight.agent/v3
kind: agent

inputs:
  primary: boolean
  secondary: boolean
  question: string

output: string

workflow:
  steps:
    - id: route
      if: primary
      then:
        - id: primary_answer
          type: action
          call: fixture.primary
          inputs: {question: $question}
          response: string
        - yield: $primary_answer
      elif:
        - id: secondary
          when: secondary
          then:
            - id: secondary_answer
              type: action
              call: fixture.secondary
              inputs: {question: $question}
              response: string
            - yield: $secondary_answer
      else:
        - id: fallback_answer
          type: action
          call: fixture.fallback
          inputs: {question: $question}
          response: string
        - yield: $fallback_answer

    - return: $route

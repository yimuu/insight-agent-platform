api_version: insight.agent/v2
kind: agent
metadata: {id: legacy_prompt_value, name: Legacy Prompt Value, description: Negative fixture.}
inputs: {}
output: string
workflow:
  steps:
    - type: llm
      id: answer
      model: general_chat
      messages:
        - role: user
          content:
            - prompt: timezone_prompt
      response: string
  result:
    return: $answer

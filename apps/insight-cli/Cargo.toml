[package]
name = "insight-cli"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "insight"
path = "src/main.rs"

[dependencies]
insight-platform-api.workspace = true
insight-platform-tasks.workspace = true
insight-platform-deployment-contracts.workspace = true
insight-platform-registry.workspace = true
insight-platform-agent-compiler.workspace = true
insight-platform-plan.workspace = true
insight-platform-context.workspace = true
insight-platform-artifacts.workspace = true
insight-platform-mcp-host.workspace = true
base64.workspace = true
chrono.workspace = true
insight-platform-contracts.workspace = true
jsonwebtoken.workspace = true
libc.workspace = true
rcgen = { version = "0.14.9", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { workspace = true, features = ["query"] }
ring.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
x509-parser = { workspace = true, features = ["verify-aws"] }
yaml_serde.workspace = true

[dev-dependencies]
rustls.workspace = true
tempfile.workspace = true

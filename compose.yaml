# Generated by platform-installation compose-template. Configure public options in .env.
name: ${INSIGHT_NAME:-my-platform}
networks:
  default: {}
services:
  artifact-data:
    cap_drop:
    - ALL
    command:
    - set -a; . /run/insight/role/environment; set +a; exec /usr/local/bin/platform-artifact-data-worker
    depends_on:
      installation-provision:
        condition: service_completed_successfully
    entrypoint:
    - /bin/sh
    - -ec
    image: ${INSIGHT_RUNTIME_IMAGE:-insight-runtime:local}
    labels:
      insight.installation.managed: 'true'
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 35s
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /var/lib/insight:uid=10001,gid=10001,mode=0700
    user: 10001:10001
    volumes:
    - read_only: true
      source: role-artifact-data
      target: /run/insight/role
      type: volume
      volume:
        nocopy: true
  artifact-gateway:

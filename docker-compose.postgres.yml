services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insight_agent_platform
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight_agent_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - insight-agent-platform-postgres:/var/lib/postgresql/data

volumes:
  insight-agent-platform-postgres:

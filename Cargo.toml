[workspace]
members = [
    "crates/adapters/platform-openbao",
    "tools/rust/platform-deployment-tooling",
    "tools/rust/platform-installation-tooling",
    "apps/services/platform-maintenance-worker",
    "crates/adapters/platform-mcp-transport",
    "crates/application/platform-mcp-runtime",
    "crates/protocols/platform-observability-http",
    "crates/execution/platform-execution-context",
    "apps/services/platform-outbox-worker",
    "crates/adapters/platform-opensandbox-executor",
    "crates/authoring/platform-agent-compiler",
    "crates/authoring/platform-agent-compiler-wasm",
    "tools/rust/platform-storage-tooling",
    "tools/rust/platform-contract-tooling",
    "crates/deployment/platform-deployment-contracts",
    "crates/definitions/platform-plan",
    "crates/adapters/platform-artifact-broker",
    "crates/protocols/platform-artifact-rpc",
    "apps/services/platform-artifact-service",
    "crates/domains/platform-artifacts",
    "crates/protocols/platform-api",
    "crates/adapters/platform-capability-adapters",
    "apps/services/platform-capability-worker",
    "apps/services/platform-callback-api",
    "crates/foundation/platform-contracts",
    "crates/domains/platform-context",
    "apps/services/platform-context-worker",
    "apps/services/platform-gateway",
    "crates/adapters/platform-egress",
    "apps/services/platform-egress-broker",
    "crates/protocols/platform-egress-rpc",
    "crates/domains/platform-invocations",
    "crates/execution/platform-jobs",
    "crates/adapters/platform-model-adapters",
    "apps/services/platform-model-worker",
    "crates/domains/platform-models",
    "crates/domains/platform-mcp-host",
    "crates/protocols/platform-mcp-rpc",
    "apps/services/platform-mcp-service",
    "apps/services/platform-mcp-cleanup-worker",
    "crates/foundation/platform-observability",
    "apps/services/platform-orchestration-worker",
    "crates/adapters/platform-postgres",
    "tests/qualification",
    "crates/execution/platform-orchestrator",
    "crates/definitions/platform-registry",
    "apps/services/platform-registry-validation-worker",
    "crates/application/platform-runtime",
    "crates/protocols/platform-rpc-trace",
    "crates/domains/platform-sandbox",
    "apps/services/platform-sandbox-dispatcher",
    "apps/sandbox/platform-sandbox-runner",
    "crates/adapters/platform-opensandbox-client",
    "crates/execution/platform-scheduler",
    "crates/adapters/platform-secret-broker",
    "crates/domains/platform-security",
    "apps/services/platform-security-authority",
    "crates/protocols/platform-security-rpc",
    "crates/domains/platform-tasks",
    "crates/application/platform-worker",
    "apps/insight-cli",
]
default-members = ["apps/insight-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"

[workspace.dependencies]
insight-platform-mcp-transport = { path = "crates/adapters/platform-mcp-transport" }
insight-platform-mcp-runtime = { path = "crates/application/platform-mcp-runtime" }
insight-platform-observability-http = { path = "crates/protocols/platform-observability-http" }
insight-platform-execution-context = { path = "crates/execution/platform-execution-context" }
insight-platform-agent-compiler = { path = "crates/authoring/platform-agent-compiler" }
insight-platform-agent-compiler-wasm = { path = "crates/authoring/platform-agent-compiler-wasm" }
async-trait = "0.1"
async-nats = { version = "0.50.0", default-features = false, features = ["aws-lc-rs", "nkeys", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
aws-config = { version = "=1.10.1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "=1.114.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.144.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "=1.111.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http2", "native-tokio", "tls12"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http2", "tokio"] }
jsonschema = { version = "0.47", default-features = false }
libc = "0.2"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
prost = "0.14.4"
protoc-bin-vendored = "3.2.0"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "stream", "rustls"], default-features = false }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "json", "macros", "tls-rustls-aws-lc-rs"], default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "router", "server", "tls-aws-lc"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
x509-parser = { version = "0.18.1", default-features = false }
url = "2"
yaml-rust2 = { version = "0.11", default-features = false }
yaml_serde = "0.10.4"
zeroize = "1"
getrandom = "0.4"

insight-platform-openbao = { path = "crates/adapters/platform-openbao" }
insight-platform-artifact-broker = { path = "crates/adapters/platform-artifact-broker" }
insight-platform-artifact-rpc = { path = "crates/protocols/platform-artifact-rpc" }
insight-platform-artifact-service = { path = "apps/services/platform-artifact-service" }

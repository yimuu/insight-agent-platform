insight-platform-model-worker = { path = "apps/services/platform-model-worker" }
insight-platform-models = { path = "crates/domains/platform-models" }
insight-platform-mcp-host = { path = "crates/domains/platform-mcp-host" }
insight-platform-mcp-rpc = { path = "crates/protocols/platform-mcp-rpc" }
insight-platform-mcp-service = { path = "apps/services/platform-mcp-service" }
insight-platform-mcp-cleanup-worker = { path = "apps/services/platform-mcp-cleanup-worker" }
insight-platform-observability = { path = "crates/foundation/platform-observability" }
insight-platform-orchestration-worker = { path = "apps/services/platform-orchestration-worker" }
insight-platform-postgres = { path = "crates/adapters/platform-postgres" }
insight-platform-orchestrator = { path = "crates/execution/platform-orchestrator" }
insight-platform-registry = { path = "crates/definitions/platform-registry" }

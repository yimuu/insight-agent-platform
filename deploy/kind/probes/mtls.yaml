apiVersion: v1
kind: Pod
metadata:
  name: kind-local-mtls-probe
  namespace: platform-model-worker
  labels:
    app.kubernetes.io/name: insight-platform-model-worker
    app.kubernetes.io/component: model-worker
    app.kubernetes.io/part-of: insight-platform
    insight.platform/workload-role: model-worker
spec:
  nodeSelector: {topology.kubernetes.io/zone: local-a}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 100
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: curl
      image: docker.io/curlimages/curl@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      volumeMounts:
        - {name: client-tls, mountPath: /etc/insight/client-tls, readOnly: true}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: client-tls
      secret: {secretName: insight-platform-model-worker-egress-client-tls}
    - name: tmp
      emptyDir: {sizeLimit: 16Mi}

# Development only. The production installation supplies its own reviewed server/cluster closure.
port: 4222
max_payload: 1048576
jetstream { store_dir: "/data/jetstream"; max_file_store: 1073741824; max_memory_store: 67108864 }
tls {
  cert_file: "/etc/nats/tls/server.pem"
  key_file: "/etc/nats/tls/server-key.pem"
  ca_file: "/etc/nats/tls/ca.pem"
  verify_and_map: true
}
authorization {
  users: [
    {user: "spiffe://insight.platform/workload/public-gateway", permissions: {
      publish: []
      subscribe: ["insight.platform.v1.run.live.local.*"]
    }},
    {user: "spiffe://insight.platform/workload/local-nats-client", permissions: {
      publish: ["insight.platform.v1.run.live.>"]
      subscribe: ["insight.platform.v1.run.live.>", "_INBOX.>"]
    }},
    {user: "spiffe://insight.platform/workload/outbox-worker", permissions: {
      publish: ["insight.platform.v1.committed", "$JS.API.STREAM.INFO.INSIGHT_COMMITTED_V1"]
      subscribe: ["_INBOX.insight.outbox.>"]
    }},
    {user: "spiffe://insight.platform/workload/local-outbox-provisioner", permissions: {
      publish: ["$JS.API.STREAM.CREATE.INSIGHT_COMMITTED_V1", "$JS.API.STREAM.INFO.INSIGHT_COMMITTED_V1"]
      subscribe: ["_INBOX.>"]
    }}
  ]
}

# Gate B/C/D qualification ceiling C2. Apply after values-benchmark.yaml.
resources:
  requests:
    cpu: "2"
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 2Gi

runtime:
  databasePoolMaxConnections: 32
  maxConcurrentRuns: 50
  maxConcurrentOperations: 16
  maxConcurrentOperationsPerRun: 2
  scheduler:
    claimBatchSize: 16

postgresql:
  sharedBuffers: 4GB
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 16Gi
  persistence:
    enabled: true

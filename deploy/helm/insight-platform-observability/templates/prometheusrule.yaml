{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: insight-platform-symptoms
  namespace: {{ .Values.namespace }}
  labels: {{ toYaml .Values.alerts.labels | nindent 4 }}
spec:
  groups:
    - name: insight-platform.process
      rules:
        - alert: InsightPlatformTelemetryMissing
          expr: absent(insight_platform_process_build_info) == 1
          for: {{ .Values.alerts.scrapeMissingFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Platform telemetry is absent
            description: No Platform v2 process build series is visible to Prometheus.
            runbook_url: {{ printf "%s#insightplatformtelemetrymissing" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformWorkloadNotReady
          expr: max by (component_role) (max_over_time(insight_platform_process_ready[{{ .Values.alerts.evaluationWindow }}])) < 1
          for: {{ .Values.alerts.notReadyFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: A Platform workload role remains not ready
            description: A bounded component role has not reported Ready during the evaluation window.
            runbook_url: {{ printf "%s#insightplatformworkloadnotready" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformOperationalCapacityExhausted
          expr: min by (component_role, resource) (insight_platform_capacity_units{state="available"}) == 0
          for: {{ .Values.alerts.operationalCapacityExhaustedFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: A Platform runtime capacity is exhausted
            description: A fixed process-local capacity authority has no unit available for the sustained alert window.
            runbook_url: {{ printf "%s#insightplatformoperationalcapacityexhausted" .Values.alerts.runbookBaseUrl | quote }}
    - name: insight-platform.http
      rules:
        - alert: InsightPlatformHttpFailureRatioHigh
          expr: (sum by (component_role) (rate(insight_platform_http_requests_total{outcome="failure",operation!~"live|ready|metrics"}[{{ .Values.alerts.evaluationWindow }}])) / clamp_min(sum by (component_role) (rate(insight_platform_http_requests_total{operation!~"live|ready|metrics"}[{{ .Values.alerts.evaluationWindow }}])), 0.000001)) > {{ .Values.alerts.maximumFailureRatio }} and sum by (component_role) (rate(insight_platform_http_requests_total{operation!~"live|ready|metrics"}[{{ .Values.alerts.evaluationWindow }}])) > {{ .Values.alerts.minimumRequestRate }}
          for: {{ .Values.alerts.errorRatioFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Platform HTTP failure ratio is elevated
            description: A component role has sustained server-side failures at meaningful traffic volume.
            runbook_url: {{ printf "%s#insightplatformhttpfailureratiohigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformHttpLatencyHigh
          expr: histogram_quantile(0.95, sum by (component_role, le) (rate(insight_platform_http_request_duration_seconds_bucket{operation!~"live|ready|metrics"}[{{ .Values.alerts.evaluationWindow }}]))) > {{ .Values.alerts.maximumP95Seconds }} and sum by (component_role) (rate(insight_platform_http_requests_total{operation!~"live|ready|metrics"}[{{ .Values.alerts.evaluationWindow }}])) > {{ .Values.alerts.minimumRequestRate }}
          for: {{ .Values.alerts.latencyFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Platform HTTP p95 latency is elevated
            description: A component role has sustained high request latency at meaningful traffic volume.
            runbook_url: {{ printf "%s#insightplatformhttplatencyhigh" .Values.alerts.runbookBaseUrl | quote }}
    - name: insight-platform.orchestration
      rules:
        - alert: InsightPlatformCriticalControlPermitsExhausted
          expr: min by (component_role) (insight_platform_worker_permits{component_role="scheduler-recovery",lane="critical_control",state="available"}) == 0
          for: {{ .Values.alerts.permitExhaustedFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Scheduler critical-control permits are exhausted
            description: Recovery and reconciliation have no reserved process-local permit available.
            runbook_url: {{ printf "%s#insightplatformcriticalcontrolpermitsexhausted" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformRecoveryFailureRatioHigh
          expr: (sum by (component_role) (rate(insight_platform_recovery_operations_total{outcome="scan_failed"}[{{ .Values.alerts.evaluationWindow }}])) / clamp_min(sum by (component_role) (rate(insight_platform_recovery_operations_total{outcome="scan_attempted"}[{{ .Values.alerts.evaluationWindow }}])), 0.000001)) > {{ .Values.alerts.maximumRecoveryFailureRatio }} and sum by (component_role) (rate(insight_platform_recovery_operations_total{outcome="scan_attempted"}[{{ .Values.alerts.evaluationWindow }}])) > {{ .Values.alerts.minimumRecoveryRate }}
          for: {{ .Values.alerts.recoveryFailureFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Scheduler recovery scan failure ratio is elevated
            description: Critical-control recovery scans are failing persistently at meaningful scan volume.
            runbook_url: {{ printf "%s#insightplatformrecoveryfailureratiohigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformDurableJobLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="scheduler-recovery",queue="due"}) > {{ .Values.alerts.maximumDueJobLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="scheduler-recovery",queue="due"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable orchestration work remains due
            description: Due orchestration Jobs have exceeded the bounded scheduling-lag threshold.
            runbook_url: {{ printf "%s#insightplatformdurablejoblaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformExpiredLeaseRecoveryLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="scheduler-recovery",queue="expired_lease"}) > {{ .Values.alerts.maximumExpiredLeaseLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="scheduler-recovery",queue="expired_lease"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Expired orchestration leases remain unrecovered
            description: Expired orchestration Job leases have exceeded the bounded recovery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformexpiredleaserecoverylaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformModelDurableJobLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="model-worker",queue="due"}) > {{ .Values.alerts.maximumDueJobLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="model-worker",queue="due"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable Model work remains due
            description: Due Model Jobs have exceeded the bounded scheduling-lag threshold.
            runbook_url: {{ printf "%s#insightplatformmodeldurablejoblaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformModelExpiredLeaseRecoveryLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="model-worker",queue="expired_lease"}) > {{ .Values.alerts.maximumExpiredLeaseLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="model-worker",queue="expired_lease"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Expired Model leases remain unrecovered
            description: Expired Model Job leases have exceeded the bounded recovery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformmodelexpiredleaserecoverylaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformCapabilityDurableJobLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role=~"capability-(native|remote)-worker",queue="due"}) > {{ .Values.alerts.maximumDueJobLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role=~"capability-(native|remote)-worker",queue="due"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable Capability work remains due
            description: Due Capability Jobs have exceeded the bounded scheduling-lag threshold.
            runbook_url: {{ printf "%s#insightplatformcapabilitydurablejoblaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformCapabilityExpiredLeaseRecoveryLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role=~"capability-(native|remote)-worker",queue="expired_lease"}) > {{ .Values.alerts.maximumExpiredLeaseLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role=~"capability-(native|remote)-worker",queue="expired_lease"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Expired Capability leases remain unrecovered
            description: Expired Capability Job leases have exceeded the bounded recovery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformcapabilityexpiredleaserecoverylaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformSandboxDurableJobLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="sandbox-controller",queue="due"}) > {{ .Values.alerts.maximumDueJobLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="sandbox-controller",queue="due"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable Sandbox execution work remains due
            description: Due Sandbox execution Jobs have exceeded the bounded scheduling-lag threshold.
            runbook_url: {{ printf "%s#insightplatformsandboxdurablejoblaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformSandboxExpiredLeaseRecoveryLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="sandbox-controller",queue="expired_lease"}) > {{ .Values.alerts.maximumExpiredLeaseLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="sandbox-controller",queue="expired_lease"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Expired Sandbox execution leases remain unrecovered
            description: Expired Sandbox execution Job leases have exceeded the bounded recovery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformsandboxexpiredleaserecoverylaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformArtifactDurableJobLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role=~"artifact-(data-worker|maintenance)",queue="due"}) > {{ .Values.alerts.maximumDueJobLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role=~"artifact-(data-worker|maintenance)",queue="due"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable Artifact work remains due
            description: Due Artifact Jobs have exceeded the bounded scheduling-lag threshold.
            runbook_url: {{ printf "%s#insightplatformartifactdurablejoblaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformArtifactExpiredLeaseRecoveryLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role=~"artifact-(data-worker|maintenance)",queue="expired_lease"}) > {{ .Values.alerts.maximumExpiredLeaseLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role=~"artifact-(data-worker|maintenance)",queue="expired_lease"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Expired Artifact leases remain unrecovered
            description: Expired Artifact Job leases have exceeded the bounded recovery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformartifactexpiredleaserecoverylaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformContextDurableJobLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role=~"context-(native|remote|subscription)-worker",queue="due"}) > {{ .Values.alerts.maximumDueJobLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role=~"context-(native|remote|subscription)-worker",queue="due"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable Context work remains due
            description: Due Context Jobs have exceeded the bounded scheduling-lag threshold.
            runbook_url: {{ printf "%s#insightplatformcontextdurablejoblaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformContextExpiredLeaseRecoveryLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role=~"context-(native|remote|subscription)-worker",queue="expired_lease"}) > {{ .Values.alerts.maximumExpiredLeaseLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role=~"context-(native|remote|subscription)-worker",queue="expired_lease"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Expired Context leases remain unrecovered
            description: Expired Context Job leases have exceeded the bounded recovery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformcontextexpiredleaserecoverylaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformMcpDiscoveryDurableJobLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="mcp-discovery-worker",queue="due"}) > {{ .Values.alerts.maximumDueJobLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="mcp-discovery-worker",queue="due"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable MCP discovery work remains due
            description: Due MCP discovery Jobs have exceeded the bounded scheduling-lag threshold.
            runbook_url: {{ printf "%s#insightplatformmcpdiscoverydurablejoblaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformMcpDiscoveryExpiredLeaseRecoveryLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="mcp-discovery-worker",queue="expired_lease"}) > {{ .Values.alerts.maximumExpiredLeaseLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="mcp-discovery-worker",queue="expired_lease"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Expired MCP discovery leases remain unrecovered
            description: Expired MCP discovery Job leases have exceeded the bounded recovery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformmcpdiscoveryexpiredleaserecoverylaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformMcpSubscriptionDurableJobLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="mcp-subscription-worker",queue="due"}) > {{ .Values.alerts.maximumDueJobLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="mcp-subscription-worker",queue="due"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable MCP subscription work remains due
            description: Due logical MCP subscription Jobs have exceeded the bounded scheduling-lag threshold.
            runbook_url: {{ printf "%s#insightplatformmcpsubscriptiondurablejoblaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformMcpSubscriptionExpiredLeaseRecoveryLagHigh
          expr: max by (component_role) (insight_platform_durable_job_lag_seconds{component_role="mcp-subscription-worker",queue="expired_lease"}) > {{ .Values.alerts.maximumExpiredLeaseLagSeconds }} and max by (component_role) (insight_platform_durable_jobs{component_role="mcp-subscription-worker",queue="expired_lease"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Expired MCP subscription leases remain unrecovered
            description: Expired logical MCP subscription Job leases have exceeded the bounded recovery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformmcpsubscriptionexpiredleaserecoverylaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformDurableObservationFailureRatioHigh
          expr: (sum by (component_role) (increase(insight_platform_durable_observations_total{outcome="failure"}[{{ .Values.alerts.evaluationWindow }}])) / clamp_min(sum by (component_role) (increase(insight_platform_durable_observations_total[{{ .Values.alerts.evaluationWindow }}])), 1)) > {{ .Values.alerts.maximumDurableObservationFailureRatio }} and sum by (component_role) (increase(insight_platform_durable_observations_total[{{ .Values.alerts.evaluationWindow }}])) >= {{ .Values.alerts.minimumDurableObservations }}
          for: {{ .Values.alerts.dependencyFailureFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable queue observations are failing
            description: PostgreSQL-backed durable queue observations are failing persistently at a meaningful volume.
            runbook_url: {{ printf "%s#insightplatformdurableobservationfailureratiohigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformDependencyFailureRatioHigh
          expr: (sum by (component_role, dependency) (increase(insight_platform_dependency_observations_total{outcome="failure"}[{{ .Values.alerts.evaluationWindow }}])) / clamp_min(sum by (component_role, dependency) (increase(insight_platform_dependency_observations_total[{{ .Values.alerts.evaluationWindow }}])), 1)) > {{ .Values.alerts.maximumDependencyFailureRatio }} and sum by (component_role, dependency) (increase(insight_platform_dependency_observations_total[{{ .Values.alerts.evaluationWindow }}])) >= {{ .Values.alerts.minimumDependencyObservations }}
          for: {{ .Values.alerts.dependencyFailureFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: A Platform dependency failure ratio is elevated
            description: A fixed component role and dependency kind have sustained failures at a meaningful observation volume.
            runbook_url: {{ printf "%s#insightplatformdependencyfailureratiohigh" .Values.alerts.runbookBaseUrl | quote }}
    - name: insight-platform.outbox
      rules:
        - alert: InsightPlatformDueOutboxLagHigh
          expr: max by (component_role) (insight_platform_outbox_lag_seconds{component_role="scheduler-recovery",queue="due"}) > {{ .Values.alerts.maximumDueOutboxLagSeconds }} and max by (component_role) (insight_platform_outbox_events{component_role="scheduler-recovery",queue="due"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: warning, owner: platform-runtime}
          annotations:
            summary: Durable Outbox delivery remains due
            description: Publishable Outbox events have exceeded the bounded delivery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformdueoutboxlaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformExpiredOutboxClaimLagHigh
          expr: max by (component_role) (insight_platform_outbox_lag_seconds{component_role="scheduler-recovery",queue="expired_claim"}) > {{ .Values.alerts.maximumExpiredOutboxClaimLagSeconds }} and max by (component_role) (insight_platform_outbox_events{component_role="scheduler-recovery",queue="expired_claim"}) > 0
          for: {{ .Values.alerts.durableLagFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Expired Outbox claims remain unrecovered
            description: Expired Outbox claim leases have exceeded the bounded recovery-lag threshold.
            runbook_url: {{ printf "%s#insightplatformexpiredoutboxclaimlaghigh" .Values.alerts.runbookBaseUrl | quote }}
        - alert: InsightPlatformOutboxDeadEventsPresent
          expr: max by (component_role) (insight_platform_outbox_events{component_role="scheduler-recovery",queue="dead"}) > 0
          for: {{ .Values.alerts.outboxDeadFor }}
          labels: {severity: critical, owner: platform-runtime}
          annotations:
            summary: Durable Outbox contains dead events
            description: At least one Outbox event reached a closed dead state and requires operator reconciliation.
            runbook_url: {{ printf "%s#insightplatformoutboxdeadeventspresent" .Values.alerts.runbookBaseUrl | quote }}
{{- end }}

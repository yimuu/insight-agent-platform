{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: insight-platform-runtime-dashboard
  namespace: {{ .Values.namespace }}
  labels: {{ toYaml .Values.dashboard.labels | nindent 4 }}
data:
  insight-platform-runtime.json: |-
    {
      "schemaVersion": 39,
      "title": "Insight Platform Runtime Symptoms",
      "uid": "insight-platform-runtime",
      "tags": ["insight-platform", "runtime"],
      "templating": {"list": [{"name": "component_role", "type": "query", "query": "label_values(insight_platform_process_build_info, component_role)", "includeAll": true, "multi": true}]},
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "Ready", "targets": [{"expr": "max by (component_role) (insight_platform_process_ready{component_role=~\"$component_role\"})"}], "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0}},
        {"id": 2, "type": "timeseries", "title": "Business request rate", "targets": [{"expr": "sum by (component_role) (rate(insight_platform_http_requests_total{component_role=~\"$component_role\",operation!~\"live|ready|metrics\"}[5m]))"}], "gridPos": {"h": 8, "w": 9, "x": 6, "y": 0}},
        {"id": 3, "type": "timeseries", "title": "Failure ratio", "targets": [{"expr": "sum by (component_role) (rate(insight_platform_http_requests_total{component_role=~\"$component_role\",outcome=\"failure\",operation!~\"live|ready|metrics\"}[5m])) / clamp_min(sum by (component_role) (rate(insight_platform_http_requests_total{component_role=~\"$component_role\",operation!~\"live|ready|metrics\"}[5m])), 0.000001)"}], "gridPos": {"h": 8, "w": 9, "x": 15, "y": 0}},
        {"id": 4, "type": "timeseries", "title": "HTTP p95 seconds", "targets": [{"expr": "histogram_quantile(0.95, sum by (component_role, le) (rate(insight_platform_http_request_duration_seconds_bucket{component_role=~\"$component_role\",operation!~\"live|ready|metrics\"}[5m])))"}], "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}},
        {"id": 5, "type": "timeseries", "title": "Worker permits available", "targets": [{"expr": "min by (component_role, lane) (insight_platform_worker_permits{component_role=~\"$component_role\",state=\"available\"})"}], "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}},
        {"id": 6, "type": "timeseries", "title": "Orchestration active jobs", "targets": [{"expr": "max by (component_role) (insight_platform_orchestration_active_jobs{component_role=~\"$component_role\"})"}], "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16}},
        {"id": 7, "type": "timeseries", "title": "Orchestration claim outcomes", "targets": [{"expr": "sum by (component_role, outcome) (rate(insight_platform_orchestration_claims_total{component_role=~\"$component_role\"}[5m]))"}], "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16}},
        {"id": 8, "type": "timeseries", "title": "Recovery operation outcomes", "targets": [{"expr": "sum by (component_role, outcome) (rate(insight_platform_recovery_operations_total{component_role=~\"$component_role\"}[5m]))"}], "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16}},
        {"id": 9, "type": "timeseries", "title": "Durable Job backlog", "targets": [{"expr": "max by (component_role, queue) (insight_platform_durable_jobs{component_role=~\"$component_role\"})"}], "gridPos": {"h": 8, "w": 8, "x": 0, "y": 24}},
        {"id": 10, "type": "timeseries", "title": "Durable Job lag seconds", "targets": [{"expr": "max by (component_role, queue) (insight_platform_durable_job_lag_seconds{component_role=~\"$component_role\"})"}], "gridPos": {"h": 8, "w": 8, "x": 8, "y": 24}},
        {"id": 11, "type": "timeseries", "title": "Dependency operation outcomes", "targets": [{"expr": "sum by (component_role, dependency, outcome) (rate(insight_platform_dependency_observations_total{component_role=~\"$component_role\"}[5m]))"}], "gridPos": {"h": 8, "w": 8, "x": 16, "y": 24}},
        {"id": 12, "type": "timeseries", "title": "Durable Outbox backlog", "targets": [{"expr": "max by (component_role, queue) (insight_platform_outbox_events{component_role=~\"$component_role\"})"}], "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32}},
        {"id": 13, "type": "timeseries", "title": "Durable Outbox lag seconds", "targets": [{"expr": "max by (component_role, queue) (insight_platform_outbox_lag_seconds{component_role=~\"$component_role\"})"}], "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32}},
        {"id": 14, "type": "timeseries", "title": "Operational capacity available", "targets": [{"expr": "min by (component_role, resource) (insight_platform_capacity_units{component_role=~\"$component_role\",state=\"available\"})"}], "gridPos": {"h": 8, "w": 24, "x": 0, "y": 40}}
      ]
    }
{{- end }}

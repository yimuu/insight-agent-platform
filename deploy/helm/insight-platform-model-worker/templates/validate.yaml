{{- if lt (int .Values.replicas) 2 -}}
{{- fail "Model Worker requires at least two replicas" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) -}}
{{- fail "image.digest must be an exact sha256 digest" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.config.digest) -}}
{{- fail "config.digest must be an exact sha256 digest" -}}
{{- end -}}
{{- if or (empty .Values.config.existingConfigMap) (empty .Values.database.existingSecret) (empty .Values.egressTls.existingSecret) (empty .Values.artifactTls.existingSecret) (empty .Values.natsTls.existingSecret) -}}
{{- fail "config, database, Egress/Artifact mTLS and NATS mTLS inputs must be existing projected objects" -}}
{{- end -}}
{{- if or (empty .Values.artifactTls.keys.ca) (empty .Values.artifactTls.keys.certificate) (empty .Values.artifactTls.keys.privateKey) -}}
{{- fail "Artifact mTLS projected keys are required" -}}
{{- end -}}
{{- if or (empty .Values.natsTls.keys.ca) (empty .Values.natsTls.keys.certificate) (empty .Values.natsTls.keys.privateKey) -}}
{{- fail "NATS mTLS projected keys are required" -}}
{{- end -}}
{{- if or (empty .Values.networkPolicy.postgresCidrs) (empty .Values.networkPolicy.natsCidrs) (empty .Values.networkPolicy.egressNamespace) (empty .Values.networkPolicy.artifactNamespace) (empty .Values.networkPolicy.artifactPodSelector) -}}
{{- fail "PostgreSQL/NATS CIDRs and exact Egress/Artifact destinations are required" -}}
{{- end -}}
{{- if not (deepEqual .Values.networkPolicy.artifactPodSelector (dict "insight.platform/workload-role" "artifact-broker-model")) -}}
{{- fail "Model Worker must target only the Model Artifact Broker workload role" -}}
{{- end -}}
{{- if or (lt (int .Values.networkPolicy.artifactPort) 1) (gt (int .Values.networkPolicy.artifactPort) 65535) -}}
{{- fail "Artifact Broker port must be in 1..65535" -}}
{{- end -}}
{{- if or (lt (int .Values.networkPolicy.natsPort) 1) (gt (int .Values.networkPolicy.natsPort) 65535) -}}
{{- fail "NATS port must be in 1..65535" -}}
{{- end -}}
{{- if .Values.autoscaling.enabled -}}
{{- if lt (int .Values.autoscaling.minReplicas) 2 -}}
{{- fail "Model Worker HPA requires at least two replicas" -}}
{{- end -}}
{{- if lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas) -}}
{{- fail "Model Worker HPA maximum must be at least its minimum" -}}
{{- end -}}
{{- if or (lt (int .Values.autoscaling.targetCPUUtilizationPercentage) 1) (gt (int .Values.autoscaling.targetCPUUtilizationPercentage) 100) -}}
{{- fail "Model Worker HPA CPU target must be in 1..100" -}}
{{- end -}}
{{- end -}}

image:
  repository: insight-agent-platform
  digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  pullPolicy: IfNotPresent
imagePullSecrets: []
candidate:
  deploymentConfigDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

namespace: platform-model-worker
replicas: 2

config:
  existingConfigMap: insight-platform-model-worker-candidate
  fileKey: model-worker.json
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
database:
  existingSecret: insight-platform-model-worker-database
  urlKey: database-url
egressTls:
  existingSecret: insight-platform-model-worker-egress-client-tls
  keys:
    ca: ca.pem
    certificate: client.pem
    privateKey: client-key.pem
natsTls:
  existingSecret: insight-platform-model-worker-nats-client-tls
  keys:
    ca: ca.pem
    certificate: client.pem
    privateKey: client-key.pem

networkPolicy:
  enabled: true
  egressNamespace: platform-egress
  egressPodSelector: {app.kubernetes.io/component: egress-broker}
  egressPort: 8443
  dnsNamespaceSelector: {kubernetes.io/metadata.name: kube-system}
  dnsPodSelector: {k8s-app: kube-dns}
  postgresCidrs: [10.10.0.0/24]
  natsCidrs: [10.20.0.0/24]
  natsPort: 4222

resources:
  requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 64Mi}
  limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 1Gi}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 16
  targetCPUUtilizationPercentage: 70

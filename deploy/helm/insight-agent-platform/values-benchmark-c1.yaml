# Gate B/C/D capacity profile C1. Apply after values-benchmark.yaml.
resources:
  requests:
    cpu: "1"
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

runtime:
  databasePoolMaxConnections: 24
  maxConcurrentRuns: 50
  maxConcurrentOperations: 12
  maxConcurrentOperationsPerRun: 2
  scheduler:
    claimBatchSize: 12

postgresql:
  sharedBuffers: 2GB
  # Terminal-only removes the hot-path event/checkpoint WAL. This headroom
  # prevents the remaining <=2.2 GiB qualification budget from itself
  # requesting a size-driven checkpoint; it is not a substitute for the write
  # path reduction and all durability settings remain enabled.
  maxWalSize: 4GB
  # pg_walinspect reads the exact two-hour Gate B LSN interval after the
  # workload. Keep more than the 2.2GiB qualification ceiling on the 8Gi PVC.
  walKeepSize: 3GB
  checkpointTimeout: 30min
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    enabled: true

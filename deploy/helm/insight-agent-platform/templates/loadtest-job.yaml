{{- if .Values.loadTest.enabled }}
{{- $runId := .Values.loadTest.runId | lower | replace "_" "-" | trunc 24 | trimSuffix "-" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-k6-%s" (include "insight-agent-platform.fullname" .) $runId | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "insight-agent-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: load-test
    benchmark.insight/run-id: {{ $runId | quote }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "insight-agent-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: load-test
        benchmark.insight/run-id: {{ $runId | quote }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        fsGroup: 12345
      containers:
        - name: k6
          image: "{{ .Values.loadTest.image.repository }}:{{ .Values.loadTest.image.tag }}"
          imagePullPolicy: {{ .Values.loadTest.image.pullPolicy }}
          args:
            - run
            - --summary-export=/results/summary.json
            - {{ printf "/scripts/%s" .Values.loadTest.script | quote }}
          env:
            - name: BASE_URL
              value: {{ printf "http://%s:%v" (include "insight-agent-platform.fullname" .) .Values.service.port | quote }}
            - name: PROFILE
              value: {{ $runId | quote }}
            - name: VUS
              value: {{ .Values.loadTest.virtualUsers | quote }}
            - name: DURATION
              value: {{ .Values.loadTest.duration | quote }}
            - name: EXECUTOR
              value: {{ .Values.loadTest.executor | quote }}
            - name: ITERATIONS
              value: {{ .Values.loadTest.iterations | quote }}
            - name: ARRIVAL_RATE
              value: {{ .Values.loadTest.arrivalRate | quote }}
            - name: MAX_VUS
              value: {{ .Values.loadTest.maxVirtualUsers | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.loadTest.pollIntervalSeconds | quote }}
            - name: RUN_TIMEOUT_SECONDS
              value: {{ .Values.loadTest.runTimeoutSeconds | quote }}
            - name: START_DELAY_SECONDS
              value: {{ .Values.loadTest.startDelaySeconds | quote }}
            - name: HOLD_DURATION_SECONDS
              value: {{ .Values.loadTest.holdDurationSeconds | quote }}
            - name: ROUND_INTERVAL_SECONDS
              value: {{ .Values.loadTest.roundIntervalSeconds | quote }}
          resources:
            {{- toYaml .Values.loadTest.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: {{ include "insight-agent-platform.fullname" . }}-k6
        - name: results
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}

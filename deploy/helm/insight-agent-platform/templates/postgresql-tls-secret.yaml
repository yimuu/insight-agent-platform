{{- if and .Values.postgresql.enabled .Values.postgresql.tls.enabled }}
{{- $secretName := printf "%s-tls" (include "insight-agent-platform.postgresqlName" .) | trunc 63 | trimSuffix "-" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "insight-agent-platform.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $serviceName := include "insight-agent-platform.postgresqlName" . }}
  {{- $ca := genCA (printf "%s-ca" $serviceName) 3650 }}
  {{- $dnsNames := list $serviceName (printf "%s.%s" $serviceName .Release.Namespace) (printf "%s.%s.svc" $serviceName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $serviceName .Release.Namespace) }}
  {{- $certificate := genSignedCert $serviceName nil $dnsNames 825 $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $certificate.Cert | b64enc }}
  tls.key: {{ $certificate.Key | b64enc }}
  {{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-agent-platform.fullname" . }}
  labels:
    {{- include "insight-agent-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # The durable PostgreSQL contract permits one active runtime authority.
    # Recreate prevents an upgrade from briefly starting two writers.
    type: Recreate
  selector:
    matchLabels:
      {{- include "insight-agent-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/database-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if and .Values.postgresql.enabled .Values.postgresql.tls.enabled }}
        checksum/postgresql-tls: {{ include (print $.Template.BasePath "/postgresql-tls-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "insight-agent-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.runtime.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - until pg_isready -h {{ include "insight-agent-platform.postgresqlName" . }} -U {{ .Values.postgresql.auth.username }} -d {{ .Values.postgresql.auth.database }}; do sleep 1; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: PLATFORM_CONFIG
              value: /app/config-runtime/platform.yaml
            - name: RUN_HISTORY_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "insight-agent-platform.databaseSecretName" . }}
                  key: {{ .Values.externalDatabase.databaseUrlKey }}
            - name: RUST_LOG
              value: {{ .Values.runtime.rustLog | quote }}
            {{- if .Values.artifacts.tenantEncryption.enabled }}
            - name: INSIGHT_ARTIFACT_TENANT_KEYRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.artifacts.tenantEncryption.existingSecret | quote }}
                  key: {{ .Values.artifacts.tenantEncryption.keyringKey | quote }}
            {{- end }}
            {{- if .Values.qualification.enabled }}
            - name: INSIGHT_QUALIFICATION_ENABLED
              value: "true"
            - name: TERMINAL_QUALIFICATION_EFFECT_LEDGER
              value: {{ printf "%s/qualification-effects" .Values.artifacts.mountPath | quote }}
            - name: INSIGHT_TERMINAL_QUALIFICATION_ADMISSION_DELAY_MS
              value: {{ .Values.runtime.qualificationFaults.admissionDelayMs | quote }}
            - name: INSIGHT_TERMINAL_QUALIFICATION_POST_COMMIT_DELAY_MS
              value: {{ .Values.runtime.qualificationFaults.postCommitDelayMs | quote }}
            - name: INSIGHT_TERMINAL_QUALIFICATION_SUMMARY_DELAY_MS
              value: {{ .Values.runtime.qualificationFaults.summaryDelayMs | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: runtime-config
              mountPath: /app/config-runtime
              readOnly: true
            - name: artifacts
              mountPath: {{ .Values.artifacts.mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.postgresql.enabled .Values.postgresql.tls.enabled }}
            - name: database-tls
              mountPath: /etc/insight/database-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: runtime-config
          configMap:
            name: {{ include "insight-agent-platform.fullname" . }}-config
        - name: artifacts
          {{- if .Values.artifacts.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "insight-agent-platform.artifactClaimName" . }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.artifacts.persistence.size }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if and .Values.postgresql.enabled .Values.postgresql.tls.enabled }}
        - name: database-tls
          secret:
            secretName: {{ include "insight-agent-platform.postgresqlName" . }}-tls
            defaultMode: 0444
        {{- end }}

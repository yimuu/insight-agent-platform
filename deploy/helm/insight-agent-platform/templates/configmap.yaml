{{- if not (has .Values.runtime.defaultPersistenceMode (list "full" "terminal_only")) }}
{{- fail "runtime.defaultPersistenceMode must be full or terminal_only" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.ownerLeaseSeconds) 3) (gt (int .Values.runtime.terminalOnly.ownerLeaseSeconds) 300) }}
{{- fail "runtime.terminalOnly.ownerLeaseSeconds must be between 3 and 300" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.ownerHeartbeatSeconds) 1) (gt (int .Values.runtime.terminalOnly.ownerHeartbeatSeconds) 100) }}
{{- fail "runtime.terminalOnly.ownerHeartbeatSeconds must be between 1 and 100" }}
{{- end }}
{{- if gt (mul (int .Values.runtime.terminalOnly.ownerHeartbeatSeconds) 3) (int .Values.runtime.terminalOnly.ownerLeaseSeconds) }}
{{- fail "runtime.terminalOnly.ownerHeartbeatSeconds must not exceed one third of ownerLeaseSeconds" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.terminalCommitRetrySeconds) 1) (gt (int .Values.runtime.terminalOnly.terminalCommitRetrySeconds) 300) }}
{{- fail "runtime.terminalOnly.terminalCommitRetrySeconds must be between 1 and 300" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.runRetentionDays) 1) (gt (int .Values.runtime.terminalOnly.runRetentionDays) 3650) }}
{{- fail "runtime.terminalOnly.runRetentionDays must be between 1 and 3650" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.maxConcurrentRuns) 1) (gt (int .Values.runtime.terminalOnly.maxConcurrentRuns) 10000) }}
{{- fail "runtime.terminalOnly.maxConcurrentRuns must be between 1 and 10000" }}
{{- end }}
{{- if and .Values.runtime.terminalOnly.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "terminal_only v1 requires replicaCount=1 while runtime.terminalOnly.enabled is true" }}
{{- end }}
{{- if not (regexMatch "^[1-9][0-9]*s$" .Values.runtime.shutdownHardDeadline) }}
{{- fail "runtime.shutdownHardDeadline must be a positive integer number of seconds" }}
{{- end }}
{{- $shutdownHardSeconds := int (trimSuffix "s" .Values.runtime.shutdownHardDeadline) }}
{{- if le (int .Values.runtime.terminationGracePeriodSeconds) $shutdownHardSeconds }}
{{- fail "runtime.terminationGracePeriodSeconds must exceed runtime.shutdownHardDeadline" }}
{{- end }}
{{- if and .Values.artifacts.tenantEncryption.enabled (empty .Values.artifacts.tenantEncryption.existingSecret) }}
{{- fail "artifacts.tenantEncryption.existingSecret is required when tenant encryption is enabled" }}
{{- end }}
{{- if and .Values.mcp.secretEncryption.enabled (empty .Values.mcp.secretEncryption.existingSecret) }}
{{- fail "mcp.secretEncryption.existingSecret is required when MCP secret encryption is enabled" }}
{{- end }}
{{- if and .Values.mcp.client.managementApi.enabled (not .Values.mcp.client.enabled) }}
{{- fail "mcp.client.enabled is required when managementApi is enabled" }}
{{- end }}
{{- if and .Values.mcp.client.managementApi.enabled (not .Values.mcp.secretEncryption.enabled) }}
{{- fail "mcp.secretEncryption must be enabled when managementApi is enabled" }}
{{- end }}
{{- if and .Values.mcp.client.managementApi.enabled (not .Values.management.enabled) }}
{{- fail "management.enabled is required when MCP managementApi is enabled" }}
{{- end }}
{{- if and .Values.management.enabled (empty .Values.management.operatorCredentials) }}
{{- fail "management.operatorCredentials is required when management is enabled" }}
{{- end }}
{{- if and .Values.mcp.client.managementApi.enabled (empty .Values.mcp.client.secretResolverAllowedNames) }}
{{- fail "mcp.client.secretResolverAllowedNames is required when managementApi is enabled" }}
{{- end }}
{{- $mcpSecretEnvNames := dict }}
{{- range $entry := .Values.mcp.secretEnv }}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" (default "" $entry.name)) }}
{{- fail "mcp.secretEnv[].name must be a valid environment variable name" }}
{{- end }}
{{- if or (empty $entry.secretName) (empty $entry.secretKey) }}
{{- fail "mcp.secretEnv[].secretName and secretKey are required" }}
{{- end }}
{{- if hasKey $mcpSecretEnvNames $entry.name }}
{{- fail "mcp.secretEnv[].name must be unique" }}
{{- end }}
{{- if and $.Values.mcp.secretEncryption.enabled (eq $entry.name "INSIGHT_MCP_SECRET_KEYRING") }}
{{- fail "mcp.secretEnv must not override INSIGHT_MCP_SECRET_KEYRING" }}
{{- end }}
{{- $_ := set $mcpSecretEnvNames $entry.name true }}
{{- end }}
{{- if .Values.management.enabled }}
{{- range $credential := .Values.management.operatorCredentials }}
{{- if not (hasKey $mcpSecretEnvNames (default "" $credential.tokenEnv)) }}
{{- fail "each management operator credential tokenEnv must be provided by mcp.secretEnv" }}
{{- end }}
{{- end }}
{{- range $name := .Values.management.providerSecretResolverAllowedNames }}
{{- if not (hasKey $mcpSecretEnvNames $name) }}
{{- fail "each management.providerSecretResolverAllowedNames entry must be provided by mcp.secretEnv" }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.mcp.client.managementApi.enabled }}
{{- range $name := .Values.mcp.client.secretResolverAllowedNames }}
{{- if not (hasKey $mcpSecretEnvNames $name) }}
{{- fail "each MCP secretResolverAllowedNames entry must be provided by mcp.secretEnv" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.mcp.enabled (not (has .Values.mcp.authorization.type (list "bearer_compatible" "oauth_resource_server"))) }}
{{- fail "mcp.authorization.type must be bearer_compatible or oauth_resource_server when MCP Server is enabled" }}
{{- end }}
{{- if and .Values.mcp.enabled (eq .Values.mcp.authorization.type "oauth_resource_server") (or (empty .Values.mcp.authorization.resource) (empty .Values.mcp.authorization.authorizationServers) (empty .Values.mcp.authorization.requiredScopes)) }}
{{- fail "MCP OAuth resource, authorizationServers, and requiredScopes are required" }}
{{- end }}
{{- if or (lt (int .Values.runtime.qualificationFaults.admissionDelayMs) 0) (gt (int .Values.runtime.qualificationFaults.admissionDelayMs) 30000) }}
{{- fail "runtime.qualificationFaults.admissionDelayMs must be between 0 and 30000" }}
{{- end }}
{{- if or (lt (int .Values.runtime.qualificationFaults.postCommitDelayMs) 0) (gt (int .Values.runtime.qualificationFaults.postCommitDelayMs) 30000) }}
{{- fail "runtime.qualificationFaults.postCommitDelayMs must be between 0 and 30000" }}
{{- end }}
{{- if or (lt (int .Values.runtime.qualificationFaults.summaryDelayMs) 0) (gt (int .Values.runtime.qualificationFaults.summaryDelayMs) 30000) }}
{{- fail "runtime.qualificationFaults.summaryDelayMs must be between 0 and 30000" }}
{{- end }}
{{- if and (not .Values.qualification.enabled) (or (ne (int .Values.runtime.qualificationFaults.admissionDelayMs) 0) (ne (int .Values.runtime.qualificationFaults.postCommitDelayMs) 0) (ne (int .Values.runtime.qualificationFaults.summaryDelayMs) 0)) }}
{{- fail "runtime.qualificationFaults require qualification.enabled=true" }}
{{- end }}
{{- if or (lt (int .Values.conversations.inlineContentMaxBytes) 256) (gt (int .Values.conversations.inlineContentMaxBytes) 1048576) }}
{{- fail "conversations.inlineContentMaxBytes must be between 256 and 1048576" }}
{{- end }}
{{- if or (lt (int .Values.conversations.messagePageSizeMax) 1) (gt (int .Values.conversations.messagePageSizeMax) 200) }}
{{- fail "conversations.messagePageSizeMax must be between 1 and 200" }}
{{- end }}
{{- if or (lt (int .Values.conversations.messagePageSizeDefault) 1) (gt (int .Values.conversations.messagePageSizeDefault) (int .Values.conversations.messagePageSizeMax)) }}
{{- fail "conversations.messagePageSizeDefault must be positive and no greater than messagePageSizeMax" }}
{{- end }}
{{- if or (lt (int .Values.conversations.summaryTriggerMessages) 2) (gt (int .Values.conversations.summaryTriggerMessages) 10000) }}
{{- fail "conversations.summaryTriggerMessages must be between 2 and 10000" }}
{{- end }}
{{- if or (lt (int .Values.conversations.summaryTriggerTokens) 256) (gt (int .Values.conversations.summaryTriggerTokens) 1000000) }}
{{- fail "conversations.summaryTriggerTokens must be between 256 and 1000000" }}
{{- end }}
{{- if or (lt (int .Values.conversations.recentContextMessages) 1) (gt (int .Values.conversations.recentContextMessages) 200) (gt (int .Values.conversations.recentContextMessages) (int .Values.conversations.summaryTriggerMessages)) }}
{{- fail "conversations.recentContextMessages must be between 1 and 200 and no greater than summaryTriggerMessages" }}
{{- end }}
{{- if or (lt (int .Values.conversations.retentionDays) 1) (gt (int .Values.conversations.retentionDays) 3650) }}
{{- fail "conversations.retentionDays must be between 1 and 3650" }}
{{- end }}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "current Run Stream Helm qualification requires replicaCount=1" }}
{{- end }}
{{- if not (has .Values.runtime.runStream.topology (list "single_runtime" "distributed")) }}
{{- fail "runtime.runStream.topology must be single_runtime or distributed" }}
{{- end }}
{{- if not (has .Values.runtime.runStream.broker (list "in_memory" "nats_core")) }}
{{- fail "runtime.runStream.broker must be in_memory or nats_core" }}
{{- end }}
{{- if and (eq .Values.runtime.runStream.topology "distributed") (ne .Values.runtime.runStream.broker "nats_core") }}
{{- fail "runtime.runStream.topology=distributed requires broker=nats_core" }}
{{- end }}
{{- if eq .Values.runtime.runStream.broker "nats_core" }}
{{- if or (empty .Values.runtime.runStream.natsCore.servers) (gt (len .Values.runtime.runStream.natsCore.servers) 16) }}
{{- fail "runtime.runStream.natsCore.servers must contain between 1 and 16 endpoints" }}
{{- end }}
{{- if ne (len .Values.runtime.runStream.natsCore.servers) (len (uniq .Values.runtime.runStream.natsCore.servers)) }}
{{- fail "runtime.runStream.natsCore.servers must be unique" }}
{{- end }}
{{- range $server := .Values.runtime.runStream.natsCore.servers }}
{{- if not (regexMatch "^(nats|tls)://(\\[[0-9A-Fa-f:]+\\]|[A-Za-z0-9.-]+):[0-9]+/?$" $server) }}
{{- fail "runtime.runStream.natsCore.servers entries must be explicit nats:// or tls:// host:port URLs" }}
{{- end }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9_-]{0,62}[a-z0-9])?$" .Values.runtime.runStream.natsCore.namespace) }}
{{- fail "runtime.runStream.natsCore.namespace must be a lowercase 1-64 character NATS token" }}
{{- end }}
{{- if or (empty .Values.runtime.runStream.natsCore.credentials.existingSecret) (empty .Values.runtime.runStream.natsCore.credentials.secretKey) }}
{{- fail "runtime.runStream.natsCore.credentials existingSecret and secretKey are required" }}
{{- end }}
{{- if not .Values.runtime.runStream.natsCore.tls.required }}
{{- fail "runtime.runStream.natsCore.tls.required must be true for the production Helm deployment" }}
{{- end }}
{{- if or (empty .Values.runtime.runStream.natsCore.tls.existingSecret) (empty .Values.runtime.runStream.natsCore.tls.rootCertificateKey) }}
{{- fail "runtime.runStream.natsCore.tls existingSecret and rootCertificateKey are required" }}
{{- end }}
{{- if ne (empty .Values.runtime.runStream.natsCore.tls.clientCertificateKey) (empty .Values.runtime.runStream.natsCore.tls.clientPrivateKeyKey) }}
{{- fail "runtime.runStream.natsCore.tls clientCertificateKey and clientPrivateKeyKey must be configured together" }}
{{- end }}
{{- range $key := list .Values.runtime.runStream.natsCore.credentials.secretKey .Values.runtime.runStream.natsCore.tls.rootCertificateKey .Values.runtime.runStream.natsCore.tls.clientCertificateKey .Values.runtime.runStream.natsCore.tls.clientPrivateKeyKey }}
{{- if and $key (not (regexMatch "^[A-Za-z0-9._-]+$" $key)) }}
{{- fail "runtime.runStream NATS Secret keys must be safe single path components" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insight-agent-platform.fullname" . }}-config
  labels:
    {{- include "insight-agent-platform.labels" . | nindent 4 }}
data:
  platform.yaml: |
    version: 1
    deployment_mode: production
    bind_addr: 0.0.0.0:3000

    auth:
      mode: disabled

    management:
      version: 1
      enabled: {{ .Values.management.enabled }}
      {{- if .Values.management.operatorCredentials }}
      operator_credentials:
        {{- range .Values.management.operatorCredentials }}
        - identity: {{ .identity | quote }}
          token_env: {{ .tokenEnv | quote }}
          capabilities:
            {{- toYaml .capabilities | nindent 12 }}
        {{- end }}
      {{- else }}
      operator_credentials: []
      {{- end }}
      provider_secret_resolver:
        {{- if .Values.management.providerSecretResolverAllowedNames }}
        type: environment_reference
        allowed_names:
          {{- toYaml .Values.management.providerSecretResolverAllowedNames | nindent 10 }}
        {{- else }}
        type: disabled
        {{- end }}
      limits:
        max_agent_draft_bytes: {{ int .Values.management.limits.maxAgentDraftBytes }}
        max_agent_prompt_files: {{ int .Values.management.limits.maxAgentPromptFiles }}
        max_provider_models: {{ int .Values.management.limits.maxProviderModels }}
        max_pending_operations: {{ int .Values.management.limits.maxPendingOperations }}
        operation_retention_days: {{ int .Values.management.limits.operationRetentionDays }}
      {{- if .Values.management.debugExecutionProfiles }}
      debug_execution_profiles:
        {{- range $profileId, $profile := .Values.management.debugExecutionProfiles }}
        {{ $profileId }}:
          mode: {{ $profile.mode }}
          max_concurrent_sessions: {{ int $profile.maxConcurrentSessions }}
          session_timeout: {{ $profile.sessionTimeout | quote }}
          retention: {{ $profile.retention | quote }}
          allow_external_actions: {{ $profile.allowExternalActions }}
          allow_live_provider_credentials: {{ $profile.allowLiveProviderCredentials }}
        {{- end }}
      {{- else }}
      debug_execution_profiles: {}
      {{- end }}

    agents:
      directory: /app/agents
      enabled:
        {{- toYaml .Values.agents.enabled | nindent 8 }}

    {{- if .Values.qualification.enabled }}
    providers:
      fixture:
        type: open_ai_compatible
        endpoint: {{ .Values.qualification.terminalStreamBaseUrl | quote }}
        credential:
          type: bearer
          env: TERMINAL_STREAM_FIXTURE_API_KEY
        models:
          terminal-stream:
            input: [text]
        connect_timeout: 1s
        request_timeout: 60s
        transport:
          plaintext_http: trusted_private
    {{- end }}

    actions:
      enabled:
        - example.text_metrics
        {{- if .Values.qualification.enabled }}
        - qualification.effect_marker
        {{- end }}

    mcp:
      version: 2
      protocol:
        preferred: "2026-07-28"
        legacy_fallback: []
      client:
        enabled: {{ .Values.mcp.client.enabled }}
        management_api:
          enabled: {{ .Values.mcp.client.managementApi.enabled }}
          discovery_workers: {{ .Values.mcp.client.managementApi.discoveryWorkers }}
          max_pending_discoveries: {{ .Values.mcp.client.managementApi.maxPendingDiscoveries }}
        {{- if .Values.mcp.secretEncryption.enabled }}
        secret_encryption:
          active_key_version: {{ .Values.mcp.secretEncryption.activeKeyVersion | quote }}
          keyring_env: INSIGHT_MCP_SECRET_KEYRING
        {{- end }}
        secret_resolver:
          {{- if .Values.mcp.client.secretResolverAllowedNames }}
          type: environment_reference
          allowed_names:
            {{- toYaml .Values.mcp.client.secretResolverAllowedNames | nindent 12 }}
          {{- else }}
          type: disabled
          {{- end }}
        signed_manifest_trust:
          max_validity: {{ .Values.mcp.client.signedManifestTrust.maxValidity | quote }}
          {{- if .Values.mcp.client.signedManifestTrust.trustedSigners }}
          trusted_signers:
            {{- range .Values.mcp.client.signedManifestTrust.trustedSigners }}
            - key_id: {{ .keyId | quote }}
              algorithm: ed25519
              public_key_file: {{ .publicKeyFile | quote }}
            {{- end }}
          {{- else }}
          trusted_signers: []
          {{- end }}
        network_policy:
          allow_loopback_development: {{ .Values.mcp.client.networkPolicy.allowLoopbackDevelopment }}
          allow_private_networks: {{ .Values.mcp.client.networkPolicy.allowPrivateNetworks }}
          allow_redirects: {{ .Values.mcp.client.networkPolicy.allowRedirects }}
        stdio_launch_profiles: {{ toJson .Values.mcp.client.stdioLaunchProfiles }}
        default_limits:
          connect_timeout: {{ .Values.mcp.client.defaultLimits.connectTimeout | quote }}
          request_timeout: {{ .Values.mcp.client.defaultLimits.requestTimeout | quote }}
          max_request_bytes: {{ int .Values.mcp.client.defaultLimits.maxRequestBytes }}
          max_response_bytes: {{ int .Values.mcp.client.defaultLimits.maxResponseBytes }}
          max_sse_line_bytes: {{ int .Values.mcp.client.defaultLimits.maxSseLineBytes }}
          max_sse_event_bytes: {{ int .Values.mcp.client.defaultLimits.maxSseEventBytes }}
          max_content_items: {{ int .Values.mcp.client.defaultLimits.maxContentItems }}
          max_catalog_items: {{ int .Values.mcp.client.defaultLimits.maxCatalogItems }}
      server:
        enabled: {{ .Values.mcp.enabled }}
        endpoint: {{ .Values.mcp.endpoint | quote }}
        authorization:
          {{- if .Values.mcp.enabled }}
          type: {{ .Values.mcp.authorization.type }}
          {{- if eq .Values.mcp.authorization.type "oauth_resource_server" }}
          resource: {{ .Values.mcp.authorization.resource | quote }}
          authorization_servers:
            {{- toYaml .Values.mcp.authorization.authorizationServers | nindent 12 }}
          required_scopes:
            {{- toYaml .Values.mcp.authorization.requiredScopes | nindent 12 }}
          {{- end }}
          {{- else }}
          type: disabled
          {{- end }}
        exports:
          agents: {{ toJson .Values.mcp.exports.agents }}
          actions: {{ toJson .Values.mcp.exports.actions }}
          resources: {{ toJson .Values.mcp.exports.resources }}
          prompts: {{ toJson .Values.mcp.exports.prompts }}

    history:
      provider: postgres
      database_url_env: RUN_HISTORY_POSTGRES_URL
      max_connections: {{ .Values.runtime.databasePoolMaxConnections }}

    artifacts:
      provider: shared_filesystem
      namespace: {{ .Values.artifacts.namespace | quote }}
      directory: {{ .Values.artifacts.mountPath | quote }}
      inline_threshold_bytes: 65536
      {{- if .Values.artifacts.tenantEncryption.enabled }}
      tenant_encryption:
        active_key_version: {{ .Values.artifacts.tenantEncryption.activeKeyVersion | quote }}
        keyring_env: INSIGHT_ARTIFACT_TENANT_KEYRING
      {{- end }}
      max_read_bytes: 67108864
      orphan_retention: 1h
      reference_retention: 1d
      gc_interval: 1m
      deletion_claim_seconds: 60

    runtime:
      default_persistence_mode: {{ .Values.runtime.defaultPersistenceMode | quote }}
      terminal_only:
        enabled: {{ .Values.runtime.terminalOnly.enabled }}
        owner_lease_seconds: {{ .Values.runtime.terminalOnly.ownerLeaseSeconds }}
        owner_heartbeat_seconds: {{ .Values.runtime.terminalOnly.ownerHeartbeatSeconds }}
        terminal_commit_retry_seconds: {{ .Values.runtime.terminalOnly.terminalCommitRetrySeconds }}
        run_retention_days: {{ .Values.runtime.terminalOnly.runRetentionDays }}
        allow_volatile_waits: {{ .Values.runtime.terminalOnly.allowVolatileWaits }}
        max_concurrent_runs: {{ .Values.runtime.terminalOnly.maxConcurrentRuns }}
      max_concurrent_runs: {{ .Values.runtime.maxConcurrentRuns }}
      max_concurrent_operations: {{ .Values.runtime.maxConcurrentOperations }}
      max_concurrent_operations_per_run: {{ .Values.runtime.maxConcurrentOperationsPerRun }}
      operation_timeout: {{ .Values.runtime.operationTimeout }}
      run_timeout: {{ .Values.runtime.runTimeout }}
      sse_keep_alive_interval: 5s
      subscriber_capacity: {{ .Values.runtime.subscriberCapacity }}
      scheduler:
        active_poll_interval: {{ .Values.runtime.scheduler.activePollInterval }}
        idle_poll_min_interval: {{ .Values.runtime.scheduler.idlePollMinInterval }}
        idle_poll_max_interval: {{ .Values.runtime.scheduler.idlePollMaxInterval }}
        safety_poll_interval: {{ .Values.runtime.scheduler.safetyPollInterval }}
        claim_batch_size: {{ .Values.runtime.scheduler.claimBatchSize }}
        notification_reconnect_interval: {{ .Values.runtime.scheduler.notificationReconnectInterval }}
      max_llm_tool_rounds: 16
      max_llm_tool_calls: 64
      run_stream:
        topology: {{ .Values.runtime.runStream.topology }}
        broker:
          type: {{ .Values.runtime.runStream.broker }}
          {{- if eq .Values.runtime.runStream.broker "nats_core" }}
          servers:
            {{- toYaml .Values.runtime.runStream.natsCore.servers | nindent 12 }}
          namespace: {{ .Values.runtime.runStream.natsCore.namespace | quote }}
          credentials_env: INSIGHT_RUN_STREAM_NATS_CREDENTIALS
          tls:
            required: {{ .Values.runtime.runStream.natsCore.tls.required }}
            root_certificates:
              - {{ printf "/var/run/secrets/insight-nats/%s" .Values.runtime.runStream.natsCore.tls.rootCertificateKey | quote }}
            {{- if .Values.runtime.runStream.natsCore.tls.clientCertificateKey }}
            client_certificate: {{ printf "/var/run/secrets/insight-nats/%s" .Values.runtime.runStream.natsCore.tls.clientCertificateKey | quote }}
            client_private_key: {{ printf "/var/run/secrets/insight-nats/%s" .Values.runtime.runStream.natsCore.tls.clientPrivateKeyKey | quote }}
            {{- else }}
            client_certificate: null
            client_private_key: null
            {{- end }}
          connect_timeout: {{ .Values.runtime.runStream.natsCore.connectTimeout }}
          subscription_ready_timeout: {{ .Values.runtime.runStream.natsCore.subscriptionReadyTimeout }}
          reconnect_min_delay: {{ .Values.runtime.runStream.natsCore.reconnectMinDelay }}
          reconnect_max_delay: {{ .Values.runtime.runStream.natsCore.reconnectMaxDelay }}
          max_pending_messages: {{ int .Values.runtime.runStream.natsCore.maxPendingMessages }}
          max_pending_bytes: {{ int .Values.runtime.runStream.natsCore.maxPendingBytes }}
          drain_timeout: {{ .Values.runtime.runStream.natsCore.drainTimeout }}
          {{- end }}
        body_queue_capacity: {{ int .Values.runtime.runStream.bodyQueueCapacity }}
        control_queue_capacity: {{ int .Values.runtime.runStream.controlQueueCapacity }}
        max_frame_bytes: {{ int .Values.runtime.runStream.maxFrameBytes }}
        max_item_bytes: {{ int .Values.runtime.runStream.maxItemBytes }}
        max_run_bytes: {{ int .Values.runtime.runStream.maxRunBytes }}
        terminal_barrier_timeout: {{ .Values.runtime.runStream.terminalBarrierTimeout }}
        outbound_write_timeout: {{ .Values.runtime.runStream.outboundWriteTimeout }}
      public_event_retention: {{ .Values.runtime.publicEventRetention }}
      public_event_prune_interval: {{ .Values.runtime.publicEventPruneInterval }}
      readiness_probe_timeout: {{ .Values.runtime.readinessProbeTimeout }}
      shutdown_grace_period: {{ .Values.runtime.shutdownGracePeriod }}
      shutdown_hard_deadline: {{ .Values.runtime.shutdownHardDeadline }}

    conversations:
      enabled: {{ .Values.conversations.enabled }}
      inline_content_max_bytes: {{ .Values.conversations.inlineContentMaxBytes }}
      message_page_size_default: {{ .Values.conversations.messagePageSizeDefault }}
      message_page_size_max: {{ .Values.conversations.messagePageSizeMax }}
      summary_trigger_messages: {{ .Values.conversations.summaryTriggerMessages }}
      summary_trigger_tokens: {{ .Values.conversations.summaryTriggerTokens }}
      recent_context_messages: {{ .Values.conversations.recentContextMessages }}
      retention_days: {{ .Values.conversations.retentionDays }}

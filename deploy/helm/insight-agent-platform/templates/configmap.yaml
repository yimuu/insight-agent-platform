{{- if not (has .Values.runtime.defaultPersistenceMode (list "full" "terminal_only")) }}
{{- fail "runtime.defaultPersistenceMode must be full or terminal_only" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.ownerLeaseSeconds) 3) (gt (int .Values.runtime.terminalOnly.ownerLeaseSeconds) 300) }}
{{- fail "runtime.terminalOnly.ownerLeaseSeconds must be between 3 and 300" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.ownerHeartbeatSeconds) 1) (gt (int .Values.runtime.terminalOnly.ownerHeartbeatSeconds) 100) }}
{{- fail "runtime.terminalOnly.ownerHeartbeatSeconds must be between 1 and 100" }}
{{- end }}
{{- if gt (mul (int .Values.runtime.terminalOnly.ownerHeartbeatSeconds) 3) (int .Values.runtime.terminalOnly.ownerLeaseSeconds) }}
{{- fail "runtime.terminalOnly.ownerHeartbeatSeconds must not exceed one third of ownerLeaseSeconds" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.terminalCommitRetrySeconds) 1) (gt (int .Values.runtime.terminalOnly.terminalCommitRetrySeconds) 300) }}
{{- fail "runtime.terminalOnly.terminalCommitRetrySeconds must be between 1 and 300" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.runRetentionDays) 1) (gt (int .Values.runtime.terminalOnly.runRetentionDays) 3650) }}
{{- fail "runtime.terminalOnly.runRetentionDays must be between 1 and 3650" }}
{{- end }}
{{- if or (lt (int .Values.runtime.terminalOnly.maxConcurrentRuns) 1) (gt (int .Values.runtime.terminalOnly.maxConcurrentRuns) 10000) }}
{{- fail "runtime.terminalOnly.maxConcurrentRuns must be between 1 and 10000" }}
{{- end }}
{{- if and .Values.runtime.terminalOnly.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "terminal_only v1 requires replicaCount=1 while runtime.terminalOnly.enabled is true" }}
{{- end }}
{{- if not (regexMatch "^[1-9][0-9]*s$" .Values.runtime.shutdownHardDeadline) }}
{{- fail "runtime.shutdownHardDeadline must be a positive integer number of seconds" }}
{{- end }}
{{- $shutdownHardSeconds := int (trimSuffix "s" .Values.runtime.shutdownHardDeadline) }}
{{- if le (int .Values.runtime.terminationGracePeriodSeconds) $shutdownHardSeconds }}
{{- fail "runtime.terminationGracePeriodSeconds must exceed runtime.shutdownHardDeadline" }}
{{- end }}
{{- if and .Values.artifacts.tenantEncryption.enabled (empty .Values.artifacts.tenantEncryption.existingSecret) }}
{{- fail "artifacts.tenantEncryption.existingSecret is required when tenant encryption is enabled" }}
{{- end }}
{{- if and .Values.mcp.secretEncryption.enabled (empty .Values.mcp.secretEncryption.existingSecret) }}
{{- fail "mcp.secretEncryption.existingSecret is required when MCP secret encryption is enabled" }}
{{- end }}
{{- $mcpSecretEnvNames := dict }}
{{- range $entry := .Values.mcp.secretEnv }}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" (default "" $entry.name)) }}
{{- fail "mcp.secretEnv[].name must be a valid environment variable name" }}
{{- end }}
{{- if or (empty $entry.secretName) (empty $entry.secretKey) }}
{{- fail "mcp.secretEnv[].secretName and secretKey are required" }}
{{- end }}
{{- if hasKey $mcpSecretEnvNames $entry.name }}
{{- fail "mcp.secretEnv[].name must be unique" }}
{{- end }}
{{- if and $.Values.mcp.secretEncryption.enabled (eq $entry.name "INSIGHT_MCP_SECRET_KEYRING") }}
{{- fail "mcp.secretEnv must not override INSIGHT_MCP_SECRET_KEYRING" }}
{{- end }}
{{- $_ := set $mcpSecretEnvNames $entry.name true }}
{{- end }}
{{- if and .Values.mcp.enabled (not (has .Values.mcp.authorization.type (list "bearer_compatible" "oauth_resource_server"))) }}
{{- fail "mcp.authorization.type must be bearer_compatible or oauth_resource_server when MCP Server is enabled" }}
{{- end }}
{{- if and .Values.mcp.enabled (eq .Values.mcp.authorization.type "oauth_resource_server") (or (empty .Values.mcp.authorization.resource) (empty .Values.mcp.authorization.authorizationServers) (empty .Values.mcp.authorization.requiredScopes)) }}
{{- fail "MCP OAuth resource, authorizationServers, and requiredScopes are required" }}
{{- end }}
{{- if or (lt (int .Values.runtime.qualificationFaults.admissionDelayMs) 0) (gt (int .Values.runtime.qualificationFaults.admissionDelayMs) 30000) }}
{{- fail "runtime.qualificationFaults.admissionDelayMs must be between 0 and 30000" }}
{{- end }}
{{- if or (lt (int .Values.runtime.qualificationFaults.postCommitDelayMs) 0) (gt (int .Values.runtime.qualificationFaults.postCommitDelayMs) 30000) }}
{{- fail "runtime.qualificationFaults.postCommitDelayMs must be between 0 and 30000" }}
{{- end }}
{{- if or (lt (int .Values.runtime.qualificationFaults.summaryDelayMs) 0) (gt (int .Values.runtime.qualificationFaults.summaryDelayMs) 30000) }}
{{- fail "runtime.qualificationFaults.summaryDelayMs must be between 0 and 30000" }}
{{- end }}
{{- if and (not .Values.qualification.enabled) (or (ne (int .Values.runtime.qualificationFaults.admissionDelayMs) 0) (ne (int .Values.runtime.qualificationFaults.postCommitDelayMs) 0) (ne (int .Values.runtime.qualificationFaults.summaryDelayMs) 0)) }}
{{- fail "runtime.qualificationFaults require qualification.enabled=true" }}
{{- end }}
{{- if or (lt (int .Values.conversations.inlineContentMaxBytes) 256) (gt (int .Values.conversations.inlineContentMaxBytes) 1048576) }}
{{- fail "conversations.inlineContentMaxBytes must be between 256 and 1048576" }}
{{- end }}
{{- if or (lt (int .Values.conversations.messagePageSizeMax) 1) (gt (int .Values.conversations.messagePageSizeMax) 200) }}
{{- fail "conversations.messagePageSizeMax must be between 1 and 200" }}
{{- end }}
{{- if or (lt (int .Values.conversations.messagePageSizeDefault) 1) (gt (int .Values.conversations.messagePageSizeDefault) (int .Values.conversations.messagePageSizeMax)) }}
{{- fail "conversations.messagePageSizeDefault must be positive and no greater than messagePageSizeMax" }}
{{- end }}
{{- if or (lt (int .Values.conversations.summaryTriggerMessages) 2) (gt (int .Values.conversations.summaryTriggerMessages) 10000) }}
{{- fail "conversations.summaryTriggerMessages must be between 2 and 10000" }}
{{- end }}
{{- if or (lt (int .Values.conversations.summaryTriggerTokens) 256) (gt (int .Values.conversations.summaryTriggerTokens) 1000000) }}
{{- fail "conversations.summaryTriggerTokens must be between 256 and 1000000" }}
{{- end }}
{{- if or (lt (int .Values.conversations.recentContextMessages) 1) (gt (int .Values.conversations.recentContextMessages) 200) (gt (int .Values.conversations.recentContextMessages) (int .Values.conversations.summaryTriggerMessages)) }}
{{- fail "conversations.recentContextMessages must be between 1 and 200 and no greater than summaryTriggerMessages" }}
{{- end }}
{{- if or (lt (int .Values.conversations.retentionDays) 1) (gt (int .Values.conversations.retentionDays) 3650) }}
{{- fail "conversations.retentionDays must be between 1 and 3650" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insight-agent-platform.fullname" . }}-config
  labels:
    {{- include "insight-agent-platform.labels" . | nindent 4 }}
data:
  platform.yaml: |
    version: 1
    deployment_mode: production
    bind_addr: 0.0.0.0:3000

    auth:
      mode: disabled

    agents:
      directory: /app/agents
      enabled:
        {{- toYaml .Values.agents.enabled | nindent 8 }}

    {{- if .Values.qualification.enabled }}
    providers:
      fixture:
        type: open_ai_compatible
        endpoint: {{ .Values.qualification.terminalStreamBaseUrl | quote }}
        credential:
          type: bearer
          env: TERMINAL_STREAM_FIXTURE_API_KEY
        models:
          terminal-stream:
            input: [text]
        connect_timeout: 1s
        request_timeout: 60s
        transport:
          plaintext_http: trusted_private
    {{- end }}

    actions:
      enabled:
        - example.text_metrics
        {{- if .Values.qualification.enabled }}
        - qualification.effect_marker
        {{- end }}

    mcp:
      version: 1
      protocol:
        preferred: "2026-07-28"
        legacy_fallback: []
      client:
        enabled: {{ .Values.mcp.client.enabled }}
        servers:
          {{- toYaml .Values.mcp.client.servers | nindent 10 }}
        {{- if .Values.mcp.secretEncryption.enabled }}
        secret_encryption:
          active_key_version: {{ .Values.mcp.secretEncryption.activeKeyVersion | quote }}
          keyring_env: INSIGHT_MCP_SECRET_KEYRING
        {{- end }}
      server:
        enabled: {{ .Values.mcp.enabled }}
        endpoint: {{ .Values.mcp.endpoint | quote }}
        authorization:
          {{- if .Values.mcp.enabled }}
          type: {{ .Values.mcp.authorization.type }}
          {{- if eq .Values.mcp.authorization.type "oauth_resource_server" }}
          resource: {{ .Values.mcp.authorization.resource | quote }}
          authorization_servers:
            {{- toYaml .Values.mcp.authorization.authorizationServers | nindent 12 }}
          required_scopes:
            {{- toYaml .Values.mcp.authorization.requiredScopes | nindent 12 }}
          {{- end }}
          {{- else }}
          type: disabled
          {{- end }}
        exports:
          agents:
            {{- toYaml .Values.mcp.exports.agents | nindent 10 }}
          actions:
            {{- toYaml .Values.mcp.exports.actions | nindent 10 }}
          resources:
            {{- toYaml .Values.mcp.exports.resources | nindent 10 }}
          prompts:
            {{- toYaml .Values.mcp.exports.prompts | nindent 10 }}

    history:
      provider: postgres
      database_url_env: RUN_HISTORY_POSTGRES_URL
      max_connections: {{ .Values.runtime.databasePoolMaxConnections }}

    artifacts:
      provider: shared_filesystem
      namespace: {{ .Values.artifacts.namespace | quote }}
      directory: {{ .Values.artifacts.mountPath | quote }}
      inline_threshold_bytes: 65536
      {{- if .Values.artifacts.tenantEncryption.enabled }}
      tenant_encryption:
        active_key_version: {{ .Values.artifacts.tenantEncryption.activeKeyVersion | quote }}
        keyring_env: INSIGHT_ARTIFACT_TENANT_KEYRING
      {{- end }}
      max_read_bytes: 67108864
      orphan_retention: 1h
      reference_retention: 1d
      gc_interval: 1m
      deletion_claim_seconds: 60

    runtime:
      default_persistence_mode: {{ .Values.runtime.defaultPersistenceMode | quote }}
      terminal_only:
        enabled: {{ .Values.runtime.terminalOnly.enabled }}
        owner_lease_seconds: {{ .Values.runtime.terminalOnly.ownerLeaseSeconds }}
        owner_heartbeat_seconds: {{ .Values.runtime.terminalOnly.ownerHeartbeatSeconds }}
        terminal_commit_retry_seconds: {{ .Values.runtime.terminalOnly.terminalCommitRetrySeconds }}
        run_retention_days: {{ .Values.runtime.terminalOnly.runRetentionDays }}
        allow_volatile_waits: {{ .Values.runtime.terminalOnly.allowVolatileWaits }}
        max_concurrent_runs: {{ .Values.runtime.terminalOnly.maxConcurrentRuns }}
      max_concurrent_runs: {{ .Values.runtime.maxConcurrentRuns }}
      max_concurrent_operations: {{ .Values.runtime.maxConcurrentOperations }}
      max_concurrent_operations_per_run: {{ .Values.runtime.maxConcurrentOperationsPerRun }}
      operation_timeout: {{ .Values.runtime.operationTimeout }}
      run_timeout: {{ .Values.runtime.runTimeout }}
      sse_keep_alive_interval: 5s
      subscriber_capacity: {{ .Values.runtime.subscriberCapacity }}
      scheduler:
        active_poll_interval: {{ .Values.runtime.scheduler.activePollInterval }}
        idle_poll_min_interval: {{ .Values.runtime.scheduler.idlePollMinInterval }}
        idle_poll_max_interval: {{ .Values.runtime.scheduler.idlePollMaxInterval }}
        safety_poll_interval: {{ .Values.runtime.scheduler.safetyPollInterval }}
        claim_batch_size: {{ .Values.runtime.scheduler.claimBatchSize }}
        notification_reconnect_interval: {{ .Values.runtime.scheduler.notificationReconnectInterval }}
      max_llm_tool_rounds: 16
      max_llm_tool_calls: 64
      run_stream:
        broker: postgres_notify
        body_queue_capacity: 128
        control_queue_capacity: 32
        max_frame_bytes: 4096
        max_item_bytes: 4194304
        max_run_bytes: 16777216
        terminal_barrier_timeout: 2s
        outbound_write_timeout: 10s
      public_event_retention: {{ .Values.runtime.publicEventRetention }}
      public_event_prune_interval: {{ .Values.runtime.publicEventPruneInterval }}
      readiness_probe_timeout: {{ .Values.runtime.readinessProbeTimeout }}
      shutdown_grace_period: {{ .Values.runtime.shutdownGracePeriod }}
      shutdown_hard_deadline: {{ .Values.runtime.shutdownHardDeadline }}

    conversations:
      enabled: {{ .Values.conversations.enabled }}
      inline_content_max_bytes: {{ .Values.conversations.inlineContentMaxBytes }}
      message_page_size_default: {{ .Values.conversations.messagePageSizeDefault }}
      message_page_size_max: {{ .Values.conversations.messagePageSizeMax }}
      summary_trigger_messages: {{ .Values.conversations.summaryTriggerMessages }}
      summary_trigger_tokens: {{ .Values.conversations.summaryTriggerTokens }}
      recent_context_messages: {{ .Values.conversations.recentContextMessages }}
      retention_days: {{ .Values.conversations.retentionDays }}

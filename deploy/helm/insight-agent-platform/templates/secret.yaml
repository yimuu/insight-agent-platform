{{- if not .Values.externalDatabase.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insight-agent-platform.databaseSecretName" . }}
  labels:
    {{- include "insight-agent-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  {{- if .Values.postgresql.tls.enabled }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=verify-full&sslrootcert=/etc/insight/database-tls/ca.crt&application_name=insight-agent-platform-runtime" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "insight-agent-platform.postgresqlName" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s?application_name=insight-agent-platform-runtime" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "insight-agent-platform.postgresqlName" .) .Values.postgresql.auth.database | quote }}
  {{- end }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  {{- else }}
  database-url: {{ required "externalDatabase.databaseUrl is required when postgresql.enabled=false and no existingSecret is set" .Values.externalDatabase.databaseUrl | quote }}
  {{- end }}
{{- end }}

replicaCount: 1

image:
  repository: insight-agent-platform
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

agents:
  enabled:
    - action_demo
    - benchmark_wait
    - conversation_demo

# Enables only deterministic qualification fixtures and private fault
# injection. Keep false for ordinary installations.
qualification:
  enabled: false
  terminalStreamBaseUrl: http://terminal-stream-mock:8080/v1

mcp:
  enabled: false
  endpoint: /mcp
  # Environment-backed MCP credentials and stdio secret inputs. Values are
  # always read from existing Kubernetes Secrets and never rendered into the
  # platform ConfigMap.
  secretEnv: []
  # - name: ENGINEERING_MCP_TOKEN
  #   secretName: engineering-mcp
  #   secretKey: token
  client:
    enabled: false
    # Strict platform MCP server entries. Secret values must remain
    # environment references supplied through separately managed Secrets.
    servers: {}
  authorization:
    type: bearer_compatible
    resource: ""
    authorizationServers: []
    requiredScopes: []
  secretEncryption:
    enabled: false
    activeKeyVersion: v1
    existingSecret: ""
    keyringKey: keyring.json
  exports:
    agents: []
    actions: []
    resources: []
    prompts: []

service:
  type: ClusterIP
  port: 3000

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

runtime:
  rustLog: warn
  databasePoolMaxConnections: 10
  # The first rollout remains full; terminal_only is an explicit opt-in.
  defaultPersistenceMode: full
  terminalOnly:
    enabled: true
    ownerLeaseSeconds: 30
    ownerHeartbeatSeconds: 10
    terminalCommitRetrySeconds: 10
    runRetentionDays: 30
    allowVolatileWaits: false
    maxConcurrentRuns: 50
  qualificationFaults:
    admissionDelayMs: 0
    postCommitDelayMs: 0
    summaryDelayMs: 0
  maxConcurrentRuns: 16
  maxConcurrentOperations: 16
  maxConcurrentOperationsPerRun: 4
  operationTimeout: 30s
  runTimeout: 2m
  subscriberCapacity: 64
  scheduler:
    activePollInterval: 25ms
    idlePollMinInterval: 100ms
    idlePollMaxInterval: 2s
    safetyPollInterval: 5s
    claimBatchSize: 8
    notificationReconnectInterval: 250ms
  publicEventRetention: 1h
  publicEventPruneInterval: 1m
  readinessProbeTimeout: 2s
  shutdownGracePeriod: 30s
  shutdownHardDeadline: 35s
  # Kubernetes must not SIGKILL the Pod before the application hard deadline.
  terminationGracePeriodSeconds: 40

conversations:
  enabled: true
  inlineContentMaxBytes: 8192
  messagePageSizeDefault: 50
  messagePageSizeMax: 200
  summaryTriggerMessages: 30
  summaryTriggerTokens: 24000
  recentContextMessages: 20
  retentionDays: 90

artifacts:
  namespace: benchmark
  mountPath: /data/artifacts
  tenantEncryption:
    enabled: false
    activeKeyVersion: v1
    existingSecret: ""
    keyringKey: keyring.json
  persistence:
    # Shared artifact authority must survive runtime Pod replacement.
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]

externalDatabase:
  existingSecret: ""
  databaseUrlKey: database-url
  databaseUrl: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  auth:
    username: insight
    password: insight-benchmark
    database: insight_agent_platform
  maxConnections: 100
  sharedBuffers: 64MB
  maxWalSize: 1GB
  # Ordinary deployments do not retain extra WAL for qualification inspection.
  walKeepSize: 0
  checkpointTimeout: 5min
  checkpointCompletionTarget: 0.9
  logLockWaits: false
  deadlockTimeout: 1s
  tls:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    enabled: false
    size: 2Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2

loadTest:
  enabled: false
  runId: manual
  script: run-lifecycle.js
  image:
    repository: grafana/k6
    tag: 1.7.1
    pullPolicy: IfNotPresent
  virtualUsers: 8
  duration: 30s
  executor: constant-vus
  iterations: "50"
  arrivalRate: "10"
  maxVirtualUsers: "50"
  pollIntervalSeconds: "0.02"
  runTimeoutSeconds: "15"
  startDelaySeconds: "8"
  holdDurationSeconds: "1800"
  roundIntervalSeconds: "0"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi

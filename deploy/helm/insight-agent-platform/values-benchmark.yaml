image:
  repository: insight-agent-platform
  tag: benchmark
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

runtime:
  rustLog: warn
  # Match execution fan-out to the deliberately small 500m PostgreSQL limit.
  # Discovery is process-coordinated, but the database write budget still
  # benefits from only two simultaneous operations in this constrained profile.
  maxConcurrentRuns: 8
  maxConcurrentOperations: 2
  maxConcurrentOperationsPerRun: 2
  scheduler:
    claimBatchSize: 2

artifacts:
  namespace: limited-resource-benchmark
  persistence:
    enabled: true

postgresql:
  enabled: true
  logLockWaits: true
  deadlockTimeout: 100ms
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    enabled: false

loadTest:
  resources:
    requests:
      # The load generator is measurement infrastructure, not part of the
      # runtime/PostgreSQL qualification budget. Long soak profiles retain
      # response JSON long enough for lifecycle checks and need enough heap
      # headroom to avoid memory-reclaim distortion.
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

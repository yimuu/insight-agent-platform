agents:
  # Every qualification Agent must resolve to terminal_only under the
  # process-wide default below. In particular, do not add benchmark_wait:
  # that Agent is explicitly full and would start the durable coordinator.
  enabled:
    - action_demo
    - conversation_demo
    - conversation_context_probe
    - terminal_commit_fixture
    - terminal_failure_fixture
    - terminal_llm_failure_fixture
    - terminal_stream_fixture

models:
  terminalStreamBaseUrl: http://terminal-stream-mock:8080/v1

qualification:
  enabled: true

runtime:
  defaultPersistenceMode: terminal_only
  operationTimeout: 10s
  terminationGracePeriodSeconds: 40
  terminalOnly:
    enabled: true
    allowVolatileWaits: true
    maxConcurrentRuns: 50

artifacts:
  tenantEncryption:
    enabled: true
    activeKeyVersion: qualification-v1
    existingSecret: terminal-tenant-keyring
    keyringKey: keyring.json
  persistence:
    enabled: true
    size: 2Gi

postgresql:
  persistence:
    enabled: true
    size: 8Gi

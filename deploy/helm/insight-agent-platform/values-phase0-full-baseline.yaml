# Phase 0 full-runtime WAL baseline. Apply after values-benchmark.yaml and
# values-benchmark-c1.yaml in a namespace proven fresh by the qualification
# preflight. This profile is intentionally full, not terminal-only.
agents:
  enabled:
    - action_demo

qualification:
  enabled: false

runtime:
  defaultPersistenceMode: full
  terminalOnly:
    enabled: false

artifacts:
  persistence:
    enabled: true
    size: 2Gi

postgresql:
  # The historical full-runtime result produced about 5.5GiB WAL per ten
  # minutes at 10 arrivals/s. Retain the whole exact-LSN inspection interval.
  maxWalSize: 4GB
  walKeepSize: 8GB
  checkpointTimeout: 30min
  persistence:
    enabled: true
    size: 24Gi

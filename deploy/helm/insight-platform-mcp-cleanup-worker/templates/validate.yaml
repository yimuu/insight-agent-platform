{{- if lt (int .Values.replicas) 2 -}}
{{- fail "MCP cleanup worker requires at least two replicas" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) -}}
{{- fail "image.digest must be an exact sha256 digest" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.config.digest) -}}
{{- fail "config.digest must be an exact sha256 digest" -}}
{{- end -}}
{{- if or (empty .Values.config.existingConfigMap) (empty .Values.database.existingSecret) (empty .Values.egressTls.existingSecret) -}}
{{- fail "config, database and Egress mTLS inputs must be existing projected objects" -}}
{{- end -}}
{{- if or (empty .Values.networkPolicy.postgresCidrs) (empty .Values.networkPolicy.egressNamespace) -}}
{{- fail "PostgreSQL CIDRs and exact Egress namespace are required" -}}
{{- end -}}

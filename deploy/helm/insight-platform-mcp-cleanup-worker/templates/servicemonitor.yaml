{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "insight-platform-mcp-cleanup-worker.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  namespaceSelector: {matchNames: [{{ .Values.namespace }}]}
  selector:
    matchLabels: {{ include "insight-platform-mcp-cleanup-worker.labels" . | nindent 6 }}
  endpoints:
    - {port: observability, path: /metrics, interval: {{ .Values.monitoring.interval }}, scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}, scheme: http}
{{- end }}

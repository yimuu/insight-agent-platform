image:
  repository: insight-agent-platform
  digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  pullPolicy: IfNotPresent
imagePullSecrets: []
candidate:
  deploymentConfigDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

namespace: platform-mcp-cleanup
replicas: 2
observability: {port: 9090}

config:
  existingConfigMap: insight-platform-mcp-cleanup-worker-candidate
  fileKey: mcp-cleanup-worker.json
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
database:
  existingSecret: insight-platform-mcp-cleanup-worker-database
  urlKey: database-url
egressTls:
  existingSecret: insight-platform-mcp-cleanup-worker-egress-client-tls
  keys: {ca: ca.pem, certificate: client.pem, privateKey: client-key.pem}

networkPolicy:
  enabled: true
  egressNamespace: platform-egress
  egressPodSelector: {app.kubernetes.io/component: egress-broker}
  egressPort: 8443
  dnsNamespaceSelector: {kubernetes.io/metadata.name: kube-system}
  dnsPodSelector: {k8s-app: kube-dns}
  monitoringNamespaceSelector: {insight.platform/monitoring-namespace: "true"}
  monitoringPodSelector: {app.kubernetes.io/name: prometheus}
  postgresCidrs: [10.10.0.0/24]

resources:
  requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
  limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 512Mi}

podDisruptionBudget: {enabled: true, minAvailable: 1}
autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 16, targetCPUUtilizationPercentage: 70}
monitoring: {enabled: true, interval: 30s, scrapeTimeout: 5s}

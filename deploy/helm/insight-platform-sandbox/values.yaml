image:
  repository: insight-agent-platform
  digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  pullPolicy: IfNotPresent
imagePullSecrets: []

namespaces:
  controller: platform-sandbox
  executor: platform-sandbox-exec

admission:
  schedulerName: default-scheduler
  schedulerUsername: system:kube-scheduler
  daemonSetControllerUsername: system:serviceaccount:kube-system:daemon-set-controller

controller:
  replicas: 2
  port: 7443
  database:
    existingSecret: insight-platform-sandbox-database
    urlKey: database-url
    maxConnections: 10
  serviceAccount: {}
  artifactBroker:
    endpoint: https://insight-platform-artifact-broker-sandbox.platform-artifacts.svc:9443
    tlsServerName: insight-platform-artifact-broker-sandbox.platform-artifacts.svc
    maximumRequestBytes: 1048576
    maximumChunkBytes: 262144
    maximumInFlightResponses: 1
  attestor:
    tlsServerName: sandbox-attestor.insight.internal
    identityDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    maximumCachedRoutes: 1024
    allowedNodeCidrs: [10.0.0.0/8]
  connectTimeoutMilliseconds: 5000
  requestTimeoutMilliseconds: 30000
  shutdownGraceMilliseconds: 30000
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

executor:
  serviceAccount:
    annotations: {}
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    insight.platform.node-restriction.kubernetes.io/sandbox-wasi: "true"
  tolerations: []
  workerManifest:
    manifest_version: 1
    worker_role: sandbox-executor.wasi
    work_class: sandbox
    adapter_runtime_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    protocol_version: 1
    max_concurrency: 4
    critical_control_reserved_slots: 1
  runtimeVersion: 42.0.0
  backendContractDigest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  natsEndpoint: tls://nats.platform-runtime.svc:4222
  receiptTtlSeconds: 7200
  claimScanMilliseconds: 100
  claimFailureBackoffMilliseconds: 25
  drainGraceMilliseconds: 30000
  controlRequestTimeoutMilliseconds: 5000
  connectTimeoutMilliseconds: 5000
  requestTimeoutMilliseconds: 30000
  resources:
    requests: {cpu: "1", memory: 512Mi}
    limits: {cpu: "4", memory: 2Gi}

microVmExecutor:
  image:
    repository: insight-platform-sandbox-microvm-executor
    digest: sha256:a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
    pullPolicy: IfNotPresent
  serviceAccount:
    annotations: {}
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    insight.platform.node-restriction.kubernetes.io/sandbox-microvm: "true"
  tolerations:
    - {key: insight.platform/sandbox-microvm, operator: Equal, value: "true", effect: NoSchedule}
  workerManifest:
    manifest_version: 1
    worker_role: sandbox-executor.microvm
    work_class: sandbox
    adapter_runtime_digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    protocol_version: 1
    max_concurrency: 2
    critical_control_reserved_slots: 1
  backendContractDigest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
  natsEndpoint: tls://nats.platform-runtime.svc:4222
  receiptTtlSeconds: 7200
  claimScanMilliseconds: 100
  claimFailureBackoffMilliseconds: 25
  drainGraceMilliseconds: 30000
  controlRequestTimeoutMilliseconds: 5000
  connectTimeoutMilliseconds: 5000
  requestTimeoutMilliseconds: 30000
  provider:
    image:
      repository: insight-platform-sandbox-microvm-provider
      digest: sha256:b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2
      pullPolicy: IfNotPresent
    socketPath: /run/insight-sandbox-provider/provider.sock
    tlsServerName: sandbox-provider.insight.internal
    egressBrokerEndpoint: https://insight-platform-security-egress-egress.platform-egress.svc:8443
    egressBrokerTlsServerName: insight-platform-security-egress-egress.platform-egress.svc
    installation:
      version: 1.16.1
      firecracker_path: /opt/insight/microvm-runtime-assets/firecracker/1.16.1/firecracker
      firecracker_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      jailer_path: /opt/insight/microvm-runtime-assets/firecracker/1.16.1/jailer
      jailer_digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
      chroot_base_directory: /srv/insight-firecracker-jails
      parent_cgroup: insight-sandbox
    runtimes:
      - runtime_family: managed_mcp_server
        runtime_digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
        guest_kernel_digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
        guest_agent_digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
        guest_kernel_path: /opt/insight/microvm-runtime-assets/runtimes/managed-mcp/vmlinux
        rootfs_path: /opt/insight/microvm-runtime-assets/runtimes/managed-mcp/rootfs.ext4
        rootfs_bytes: 536870912
    stateDirectory: /var/lib/insight-sandbox-provider
    ephemeralUidBase: 100000
    ephemeralGidBase: 100000
    ephemeralIdentityCount: 1024
    maximumInstances: 64
    maximumTombstones: 256
    tombstoneRetentionSeconds: 86400
    maximumLifecycleEntries: 128
    apiTimeoutMilliseconds: 3000
    guestChannelTimeoutMilliseconds: 10000
    socketPollMilliseconds: 25
    processTerminationTimeoutMilliseconds: 5000
    connectTimeoutMilliseconds: 3000
    requestTimeoutMilliseconds: 10000
    tlsHandshakeTimeoutMilliseconds: 3000
    shutdownGraceMilliseconds: 30000
    hostPaths:
      kvm: /dev/kvm
      runtimeAssets: /opt/insight/microvm-runtime-assets
      chrootBaseDirectory: /var/lib/insight-firecracker-jails
      stateDirectory: /var/lib/insight-sandbox-provider
      cgroup: /sys/fs/cgroup
    resources:
      requests: {cpu: 500m, memory: 256Mi}
      limits: {cpu: "2", memory: 1Gi}
  managedRecovery:
    shardIndex: 0
    shardCount: 1
    scanMilliseconds: 1000
    scanJitterMilliseconds: 250
    failureBackoffMilliseconds: 250
  resources:
    requests: {cpu: "1", memory: 512Mi}
    limits: {cpu: "4", memory: 2Gi}

attestor:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    insight.platform.node-restriction.kubernetes.io/sandbox-attestor: "true"
  tolerations:
    - {key: insight.platform/sandbox-microvm, operator: Equal, value: "true", effect: NoSchedule}
  controllerPort: 7444
  maximumRegistrations: 10000
  absentRetentionSeconds: 3900
  tlsHandshakeTimeoutMilliseconds: 5000
  shutdownGraceMilliseconds: 30000
  hostPaths:
    proc: /proc
    nodeUid: /var/lib/insight/node-uid
    registryDirectory: /var/lib/insight-sandbox-attestor
    socketDirectory: /var/run/insight-sandbox-attestor
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

tls:
  controllerSecret: insight-platform-sandbox-controller-tls
  wasiExecutorSecret: insight-platform-sandbox-executor-wasi-tls
  microVmExecutorSecret: insight-platform-sandbox-executor-microvm-tls
  microVmProviderSecret: insight-platform-sandbox-provider-microvm-tls
  attestorSecret: insight-platform-sandbox-attestor-tls
  keys:
    controllerServerCa: controller-server-ca.pem
    executorClientCa: executor-client-ca.pem
    controllerClientCa: controller-client-ca.pem
    attestorServerCa: attestor-server-ca.pem
    controllerServerCertificate: controller-server.pem
    controllerServerPrivateKey: controller-server-key.pem
    attestorCa: attestor-ca.pem
    controllerClientCertificate: controller-client.pem
    controllerClientPrivateKey: controller-client-key.pem
    artifactBrokerServerCa: artifact-broker-server-ca.pem
    artifactBrokerClientCertificate: artifact-broker-client.pem
    artifactBrokerClientPrivateKey: artifact-broker-client-key.pem
    executorClientCertificate: executor-client.pem
    executorClientPrivateKey: executor-client-key.pem
    attestorServerCertificate: attestor-server.pem
    attestorServerPrivateKey: attestor-server-key.pem
    providerClientCa: provider-client-ca.pem
    providerServerCertificate: provider-server.pem
    providerServerPrivateKey: provider-server-key.pem
    providerControllerCa: controller-server-ca.pem
    providerEgressCa: egress-server-ca.pem
    providerClientCertificate: provider-client.pem
    providerClientPrivateKey: provider-client-key.pem

natsTls:
  existingSecret: insight-platform-sandbox-nats-tls
  rootCertificateKey: ca.pem
  clientCertificateKey: client.pem
  clientPrivateKeyKey: client-key.pem

networkPolicy:
  enabled: true
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  # Replace these non-routable-safe example ranges with the exact private
  # endpoint CIDRs recorded in the CandidateManifest.
  postgresCidrs: [10.10.0.0/24]
  natsCidrs: [10.20.0.0/24]
  artifactBrokerNamespaceSelector: {insight.platform/artifact-namespace: "true"}
  artifactBrokerPodSelector: {insight.platform/workload-role: artifact-broker-sandbox}
  artifactBrokerPort: 9443
  egressBrokerNamespaceSelector: {insight.platform/egress-namespace: "true"}
  egressBrokerPodSelector: {insight.platform/workload-role: egress-broker}
  egressBrokerPort: 8443
  natsPort: 4222

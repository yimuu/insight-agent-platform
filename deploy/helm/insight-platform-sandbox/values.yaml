image:
  repository: insight-agent-platform
  digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  pullPolicy: IfNotPresent
imagePullSecrets: []

namespaces:
  controller: platform-sandbox
  executor: platform-sandbox-exec
  guest: platform-sandbox-guests

admission:
  schedulerName: default-scheduler
  schedulerUsername: system:kube-scheduler
  daemonSetControllerUsername: system:serviceaccount:kube-system:daemon-set-controller
  replicaSetControllerUsername: system:serviceaccount:kube-system:replicaset-controller

controller:
  replicas: 2
  autoscaling: {minReplicas: 2, maxReplicas: 16, targetCPUUtilizationPercentage: 70}
  port: 7443
  database:
    existingSecret: insight-platform-sandbox-database
    urlKey: database-url
    maxConnections: 10
  serviceAccount: {}
  artifactBroker:
    endpoint: https://insight-platform-artifact-data-worker.platform-artifacts.svc:9443
    tlsServerName: insight-platform-artifact-data-worker.platform-artifacts.svc
    maximumRequestBytes: 1048576
    maximumChunkBytes: 262144
    maximumInFlightResponses: 1
  attestor:
    tlsServerName: sandbox-attestor.insight.internal
    identityDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    maximumCachedRoutes: 1024
    allowedNodeCidrs: [10.0.0.0/8]
  connectTimeoutMilliseconds: 5000
  requestTimeoutMilliseconds: 30000
  shutdownGraceMilliseconds: 30000
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
    limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 512Mi}

executor:
  serviceAccount:
    annotations: {}
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    insight.platform.node-restriction.kubernetes.io/sandbox-wasi: "true"
  tolerations: []
  workerManifest:
    manifest_version: 1
    worker_role: sandbox-executor.wasi
    work_class: sandbox
    adapter_runtime_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    protocol_version: 1
    max_concurrency: 4
    critical_control_reserved_slots: 1
  runtimeVersion: 42.0.0
  backendContractDigest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  natsEndpoint: tls://nats.platform-runtime.svc:4222
  receiptTtlSeconds: 7200
  claimScanMilliseconds: 100
  claimFailureBackoffMilliseconds: 25
  drainGraceMilliseconds: 30000
  controlRequestTimeoutMilliseconds: 5000
  connectTimeoutMilliseconds: 5000
  requestTimeoutMilliseconds: 30000
  resources:
    requests: {cpu: "1", memory: 512Mi, ephemeral-storage: 128Mi}
    limits: {cpu: "4", memory: 2Gi, ephemeral-storage: 2Gi}

gvisor:
  replicas: 2
  autoscaling: {minReplicas: 2, maxReplicas: 16, targetCPUUtilizationPercentage: 70}
  serviceAccount:
    annotations: {}
  guestServiceAccount: sandbox-guest
  runtimeClassName: runsc
  runtimeHandler: runsc
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    insight.platform.node-restriction.kubernetes.io/sandbox-gvisor: "true"
  tolerations: []
  workerManifest:
    manifest_version: 1
    worker_role: sandbox-executor.gvisor
    work_class: sandbox
    adapter_runtime_digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    protocol_version: 1
    max_concurrency: 4
    critical_control_reserved_slots: 1
  backendContractDigest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
  guestImageRepository: insight-sandbox-guest
  guestCommand: /usr/local/bin/platform-sandbox-guest
  bootstrapEndpoint: https://insight-platform-artifact-data-worker.platform-artifacts.svc:9444
  bootstrapCaPath: /etc/ssl/certs/ca-certificates.crt
  bootstrapTokenAudience: insight.platform/sandbox-guest
  bootstrapTokenExpirationSeconds: 600
  observationPollMilliseconds: 100
  receiptTtlSeconds: 7200
  claimScanMilliseconds: 100
  claimFailureBackoffMilliseconds: 25
  drainGraceMilliseconds: 30000
  controlRequestTimeoutMilliseconds: 5000
  connectTimeoutMilliseconds: 5000
  requestTimeoutMilliseconds: 30000
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
    limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 1Gi}
  attestor:
    maximumRegistrations: 10000
    absentRetentionSeconds: 3900
    tlsHandshakeTimeoutMilliseconds: 5000
    shutdownGraceMilliseconds: 30000
    resources:
      requests: {cpu: 25m, memory: 32Mi, ephemeral-storage: 32Mi}
      limits: {cpu: 200m, memory: 128Mi, ephemeral-storage: 256Mi}

attestor:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    insight.platform.node-restriction.kubernetes.io/sandbox-attestor: "true"
  tolerations: []
  controllerPort: 7444
  maximumRegistrations: 10000
  absentRetentionSeconds: 3900
  tlsHandshakeTimeoutMilliseconds: 5000
  shutdownGraceMilliseconds: 30000
  hostPaths:
    proc: /proc
    nodeUid: /var/lib/insight/node-uid
    registryDirectory: /var/lib/insight-sandbox-attestor
    socketDirectory: /var/run/insight-sandbox-attestor
  resources:
    requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 32Mi}
    limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}

tls:
  controllerSecret: insight-platform-sandbox-controller-tls
  wasiExecutorSecret: insight-platform-sandbox-executor-wasi-tls
  attestorSecret: insight-platform-sandbox-attestor-tls
  gvisorExecutorSecret: insight-platform-sandbox-executor-gvisor-tls
  keys:
    controllerServerCa: controller-server-ca.pem
    executorClientCa: executor-client-ca.pem
    controllerClientCa: controller-client-ca.pem
    attestorServerCa: attestor-server-ca.pem
    controllerServerCertificate: controller-server.pem
    controllerServerPrivateKey: controller-server-key.pem
    attestorCa: attestor-ca.pem
    controllerClientCertificate: controller-client.pem
    controllerClientPrivateKey: controller-client-key.pem
    artifactBrokerServerCa: artifact-broker-server-ca.pem
    artifactBrokerClientCertificate: artifact-broker-client.pem
    artifactBrokerClientPrivateKey: artifact-broker-client-key.pem
    executorClientCertificate: executor-client.pem
    executorClientPrivateKey: executor-client-key.pem
    attestorServerCertificate: attestor-server.pem
    attestorServerPrivateKey: attestor-server-key.pem

natsTls:
  existingSecret: insight-platform-sandbox-nats-tls
  rootCertificateKey: ca.pem
  clientCertificateKey: client.pem
  clientPrivateKeyKey: client-key.pem

networkPolicy:
  enabled: true
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  # Replace these non-routable-safe example ranges with the exact private
  # endpoint CIDRs recorded in the CandidateManifest.
  postgresCidrs: [10.10.0.0/24]
  natsCidrs: [10.20.0.0/24]
  artifactBrokerNamespaceSelector: {insight.platform/artifact-namespace: "true"}
  artifactBrokerPodSelector: {insight.platform/workload-role: artifact-data-worker}
  artifactBrokerPort: 9443
  natsPort: 4222
  kubernetesApiCidrs: [10.30.0.0/24]
  kubernetesApiPort: 443
  artifactDataWorkerNamespaceSelector: {insight.platform/artifact-namespace: "true"}
  artifactDataWorkerPodSelector: {insight.platform/workload-role: artifact-data-worker}
  artifactDataWorkerPort: 9444

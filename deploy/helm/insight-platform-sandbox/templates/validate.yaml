{{- $digestPattern := "^sha256:[0-9a-f]{64}$" -}}
{{- range $name, $image := .Values.images -}}
  {{- if not (regexMatch $digestPattern $image.digest) -}}
    {{- fail (printf "%s image must use an exact sha256 digest" $name) -}}
  {{- end -}}
  {{- if or (contains "@" $image.repository) (contains ":latest" $image.repository) -}}
    {{- fail (printf "%s image repository must not contain a tag or digest" $name) -}}
  {{- end -}}
{{- end -}}
{{- range $name, $digest := .Values.runtimeContract -}}
  {{- if not (regexMatch $digestPattern $digest) -}}
    {{- fail (printf "runtimeContract.%s must be an exact sha256 digest" $name) -}}
  {{- end -}}
{{- end -}}
{{- if not (regexMatch $digestPattern .Values.global.deploymentConfigDigest) -}}
  {{- fail "global.deploymentConfigDigest must be an exact sha256 digest" -}}
{{- end -}}
{{- if ne .Values.global.sourceCommit "c39b814f36ded4c61d5ac6f9332ee4dfbab86c00" -}}
  {{- fail "OpenSandbox source commit is a closed CR-216 value" -}}
{{- end -}}
{{- if or (ne (int .Values.dispatcher.replicas) 1) (ne (int .Values.server.replicas) 1) (ne (int .Values.controller.replicas) 1) -}}
  {{- fail "the single-node developer Profile requires exactly one Dispatcher, Server, and Controller replica" -}}
{{- end -}}
{{- if not .Values.networkPolicy.enabled -}}
  {{- fail "sandbox NetworkPolicy closure cannot be disabled" -}}
{{- end -}}
{{- if or (empty .Values.networkPolicy.kubernetesApiCidrs) (empty .Values.networkPolicy.kubernetesApiPorts) (empty .Values.networkPolicy.postgresCidrs) (empty .Values.networkPolicy.directDeniedCidrs) -}}
  {{- fail "Kubernetes API CIDRs/ports, PostgreSQL CIDRs, and Direct deny CIDRs must be explicit" -}}
{{- end -}}
{{- range .Values.networkPolicy.kubernetesApiPorts -}}
  {{- if or (lt (int .) 1) (gt (int .) 65535) -}}
    {{- fail "Kubernetes API ports must be in 1..65535" -}}
  {{- end -}}
{{- end -}}
{{- if or (lt (int .Values.dispatcher.worker.maximumConcurrency) 1) (lt (int .Values.dispatcher.worker.criticalControlReservedSlots) 1) -}}
  {{- fail "Dispatcher business and critical-control capacity must be positive" -}}
{{- end -}}
{{- if or (lt (int .Values.dispatcher.opensandbox.requestTimeoutMilliseconds) 100) (gt (int .Values.dispatcher.opensandbox.requestTimeoutMilliseconds) 4999) -}}
  {{- fail "OpenSandbox request timeout must fit below the Job lease safety budget" -}}
{{- end -}}
{{- if or (lt (int .Values.dispatcher.opensandbox.readinessRequestTimeoutMilliseconds) 5000) (gt (int .Values.dispatcher.opensandbox.readinessRequestTimeoutMilliseconds) 120000) -}}
  {{- fail "OpenSandbox full readiness request timeout must be bounded" -}}
{{- end -}}
{{- if or (lt (int .Values.dispatcher.opensandbox.readinessSuccessTtlMilliseconds) 60000) (gt (int .Values.dispatcher.opensandbox.readinessSuccessTtlMilliseconds) 900000) -}}
  {{- fail "OpenSandbox full readiness success TTL must remain short and bounded" -}}
{{- end -}}
{{- if or (empty .Values.dispatcher.database.existingSecret) (empty .Values.dispatcher.opensandbox.apiKeySecret) (empty .Values.server.apiKeySecret) -}}
  {{- fail "database and OpenSandbox credentials must be existing Secret references" -}}
{{- end -}}
{{- if ne .Values.sandbox.serviceAccountName "sandbox-workload" -}}
  {{- fail "sandbox.serviceAccountName is closed by the Armed runner admission contract" -}}
{{- end -}}
{{- if ne (int .Values.sandbox.runnerPort) 18080 -}}
  {{- fail "sandbox.runnerPort is closed by runner protocol v1" -}}
{{- end -}}
{{- if or (ne (int .Values.sandbox.runAsUser) 65532) (ne (int .Values.sandbox.runAsGroup) 65532) -}}
  {{- fail "the Armed runner UID and GID are closed values" -}}
{{- end -}}
{{- if ne (int .Values.sandbox.packageRunAsUser) 65533 -}}
  {{- fail "the untrusted Package UID is a closed value distinct from the runner" -}}
{{- end -}}

{{- if eq .Values.namespaces.controller .Values.namespaces.executor }}
{{- fail "controller and executor namespaces must be different" }}
{{- end }}
{{- if or (eq .Values.namespaces.guest .Values.namespaces.controller) (eq .Values.namespaces.guest .Values.namespaces.executor) }}
{{- fail "gVisor guest namespace must be isolated from Controller and Executor namespaces" }}
{{- end }}
{{- if lt (int .Values.controller.replicas) 2 }}
{{- fail "controller.replicas must be at least 2" }}
{{- end }}
{{- if not (empty .Values.controller.serviceAccount) }}
{{- fail "Controller ServiceAccount customization is forbidden" }}
{{- end }}
{{- if or (ne .Values.admission.schedulerName "default-scheduler") (empty .Values.admission.schedulerUsername) (eq .Values.admission.schedulerUsername "system:anonymous") }}
{{- fail "admission requires the default scheduler and one exact authenticated scheduler username" }}
{{- end }}
{{- if or (empty .Values.admission.daemonSetControllerUsername) (eq .Values.admission.daemonSetControllerUsername "system:anonymous") (eq .Values.admission.daemonSetControllerUsername .Values.admission.schedulerUsername) }}
{{- fail "admission requires a distinct exact authenticated DaemonSet controller username" }}
{{- end }}
{{- if or (empty .Values.admission.replicaSetControllerUsername) (eq .Values.admission.replicaSetControllerUsername "system:anonymous") (has .Values.admission.replicaSetControllerUsername (list .Values.admission.schedulerUsername .Values.admission.daemonSetControllerUsername)) }}
{{- fail "admission requires a distinct exact authenticated ReplicaSet controller username" }}
{{- end }}
{{- if or (empty .Values.executor.nodeSelector) (empty .Values.attestor.nodeSelector) }}
{{- fail "WASI Executor and attestor require exact node selectors" }}
{{- end }}
{{- $executionArch := get .Values.executor.nodeSelector "kubernetes.io/arch" }}
{{- if or (ne (len .Values.executor.nodeSelector) 3) (ne (get .Values.executor.nodeSelector "insight.platform.node-restriction.kubernetes.io/sandbox-wasi") "true") (ne (get .Values.executor.nodeSelector "kubernetes.io/os") "linux") (not (has $executionArch (list "amd64" "arm64"))) }}
{{- fail "WASI Executor requires an exact NodeRestriction-protected Linux node architecture" }}
{{- end }}
{{- if or (ne (len .Values.attestor.nodeSelector) 3) (ne (get .Values.attestor.nodeSelector "insight.platform.node-restriction.kubernetes.io/sandbox-attestor") "true") (ne (get .Values.attestor.nodeSelector "kubernetes.io/os") "linux") (ne (get .Values.attestor.nodeSelector "kubernetes.io/arch") $executionArch) }}
{{- fail "attestor requires its exact NodeRestriction-protected execution-node selector" }}
{{- end }}
{{- if or (not (empty .Values.executor.tolerations)) (not (empty .Values.attestor.tolerations)) }}
{{- fail "first-release WASI and attestor workloads must not declare broad tolerations" }}
{{- end }}
{{- if or (lt (int .Values.gvisor.replicas) 2) (not (empty .Values.gvisor.tolerations)) (ne .Values.gvisor.runtimeClassName "runsc") (ne .Values.gvisor.runtimeHandler "runsc") }}
{{- fail "gVisor requires two Launchers, no broad tolerations, and the exact runsc RuntimeClass" }}
{{- end }}
{{- $gvisorArch := get .Values.gvisor.nodeSelector "kubernetes.io/arch" }}
{{- if or (ne (len .Values.gvisor.nodeSelector) 3) (ne (get .Values.gvisor.nodeSelector "insight.platform.node-restriction.kubernetes.io/sandbox-gvisor") "true") (ne (get .Values.gvisor.nodeSelector "kubernetes.io/os") "linux") (not (has $gvisorArch (list "amd64" "arm64"))) }}
{{- fail "gVisor requires an exact NodeRestriction-protected Linux node architecture" }}
{{- end }}
{{- if or (empty .Values.gvisor.guestServiceAccount) (empty .Values.gvisor.guestImageRepository) (contains "@" .Values.gvisor.guestImageRepository) (contains ":latest" .Values.gvisor.guestImageRepository) (ne .Values.gvisor.guestCommand "/usr/local/bin/platform-sandbox-guest") }}
{{- fail "gVisor guest identity, immutable image repository, and entrypoint are required" }}
{{- end }}
{{- if or (not (hasPrefix "/" .Values.gvisor.bootstrapCaPath)) (contains ".." .Values.gvisor.bootstrapCaPath) }}
{{- fail "gVisor guest must use the immutable image-baked Artifact Data Worker CA path" }}
{{- end }}
{{- if or (lt (int .Values.gvisor.bootstrapTokenExpirationSeconds) 60) (gt (int .Values.gvisor.bootstrapTokenExpirationSeconds) 3600) (lt (int .Values.gvisor.observationPollMilliseconds) 10) (gt (int .Values.gvisor.observationPollMilliseconds) 10000) }}
{{- fail "gVisor bootstrap token and observation bounds are invalid" }}
{{- end }}
{{- $roleSecrets := list .Values.tls.controllerSecret .Values.tls.wasiExecutorSecret .Values.tls.gvisorExecutorSecret .Values.tls.attestorSecret .Values.natsTls.existingSecret }}
{{- if ne (len (uniq $roleSecrets)) (len $roleSecrets) }}
{{- fail "Controller, WASI Executor, gVisor Launcher, attestor, and NATS roles require distinct Secret names" }}
{{- end }}
{{- if or (lt (int .Values.attestor.controllerPort) 1) (gt (int .Values.attestor.controllerPort) 65535) (lt (int .Values.attestor.absentRetentionSeconds) 3900) }}
{{- fail "attestor port and absence retention are outside the reviewed bounds" }}
{{- end }}
{{- $attestorHostPaths := dict "proc" "/proc" "nodeUid" "/var/lib/insight/node-uid" "registryDirectory" "/var/lib/insight-sandbox-attestor" "socketDirectory" "/var/run/insight-sandbox-attestor" }}
{{- if not (deepEqual .Values.attestor.hostPaths $attestorHostPaths) }}
{{- fail "attestor host paths differ from the reviewed authority" }}
{{- end }}
{{- if or (empty .Values.controller.attestor.allowedNodeCidrs) (empty .Values.networkPolicy.postgresCidrs) (empty .Values.networkPolicy.natsCidrs) (empty .Values.networkPolicy.kubernetesApiCidrs) }}
{{- fail "controller attestor, PostgreSQL, NATS, and Kubernetes API CIDR closures are required" }}
{{- end }}
{{- if or (not (deepEqual .Values.networkPolicy.artifactDataWorkerNamespaceSelector (dict "insight.platform/artifact-namespace" "true"))) (not (deepEqual .Values.networkPolicy.artifactDataWorkerPodSelector (dict "insight.platform/workload-role" "artifact-data-worker"))) }}
{{- fail "gVisor guests must target only the isolated Artifact Data Worker" }}
{{- end }}
{{- if or (lt (int .Values.networkPolicy.kubernetesApiPort) 1) (gt (int .Values.networkPolicy.kubernetesApiPort) 65535) (lt (int .Values.networkPolicy.artifactDataWorkerPort) 1) (gt (int .Values.networkPolicy.artifactDataWorkerPort) 65535) }}
{{- fail "Kubernetes API and Artifact Data Worker ports must be fixed valid ports" }}
{{- end }}
{{- if or (not (deepEqual .Values.networkPolicy.artifactBrokerNamespaceSelector (dict "insight.platform/artifact-namespace" "true"))) (not (deepEqual .Values.networkPolicy.artifactBrokerPodSelector (dict "insight.platform/workload-role" "artifact-data-worker"))) }}
{{- fail "Controller must target only the isolated Sandbox Artifact Broker" }}
{{- end }}
{{- if or (lt (int .Values.networkPolicy.artifactBrokerPort) 1) (gt (int .Values.networkPolicy.artifactBrokerPort) 65535) }}
{{- fail "networkPolicy.artifactBrokerPort must be a valid fixed port" }}
{{- end }}
{{- if or (empty .Values.controller.artifactBroker.endpoint) (empty .Values.controller.artifactBroker.tlsServerName) }}
{{- fail "Controller requires an exact Artifact Broker mTLS endpoint" }}
{{- end }}
{{- $expectedArtifactBrokerEndpoint := printf "https://%s:%d" .Values.controller.artifactBroker.tlsServerName (int .Values.networkPolicy.artifactBrokerPort) }}
{{- if ne .Values.controller.artifactBroker.endpoint $expectedArtifactBrokerEndpoint }}
{{- fail "Controller Artifact Broker endpoint must match TLS identity and NetworkPolicy port" }}
{{- end }}
{{- if or (lt (int .Values.controller.artifactBroker.maximumRequestBytes) 1) (gt (int .Values.controller.artifactBroker.maximumRequestBytes) 1048576) (lt (int .Values.controller.artifactBroker.maximumChunkBytes) 1) (gt (int .Values.controller.artifactBroker.maximumChunkBytes) 262144) (lt (int .Values.controller.artifactBroker.maximumInFlightResponses) 1) (gt (int .Values.controller.artifactBroker.maximumInFlightResponses) 4) }}
{{- fail "Controller Artifact Broker RPC bounds exceed the closed hard caps" }}
{{- end }}
{{- if or (empty .Values.tls.keys.artifactBrokerServerCa) (empty .Values.tls.keys.artifactBrokerClientCertificate) (empty .Values.tls.keys.artifactBrokerClientPrivateKey) }}
{{- fail "Controller Artifact Broker mTLS Secret keys are required" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must remain true" }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}
{{- fail "image.digest must be an immutable lowercase sha256 digest" }}
{{- end }}
{{- if or (not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.gvisor.backendContractDigest)) (not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.gvisor.workerManifest.adapter_runtime_digest)) }}
{{- fail "gVisor backend and worker manifest digests must be immutable lowercase sha256 values" }}
{{- end }}

{{- if eq .Values.namespaces.controller .Values.namespaces.executor }}
{{- fail "controller and executor namespaces must be different" }}
{{- end }}
{{- if lt (int .Values.controller.replicas) 2 }}
{{- fail "controller.replicas must be at least 2" }}
{{- end }}
{{- if not (empty .Values.controller.serviceAccount) }}
{{- fail "Controller ServiceAccount customization is forbidden" }}
{{- end }}
{{- if or (lt (int .Values.attestor.controllerPort) 1) (gt (int .Values.attestor.controllerPort) 65535) }}
{{- fail "attestor.controllerPort must be a valid fixed host port" }}
{{- end }}
{{- if lt (int .Values.attestor.absentRetentionSeconds) 3900 }}
{{- fail "attestor.absentRetentionSeconds must cover the hard wall plus cleanup window" }}
{{- end }}
{{- if or (ne .Values.admission.schedulerName "default-scheduler") (empty .Values.admission.schedulerUsername) (eq .Values.admission.schedulerUsername "system:anonymous") }}
{{- fail "admission requires the default scheduler and one exact authenticated scheduler username" }}
{{- end }}
{{- if or (empty .Values.admission.daemonSetControllerUsername) (eq .Values.admission.daemonSetControllerUsername "system:anonymous") (eq .Values.admission.daemonSetControllerUsername .Values.admission.schedulerUsername) }}
{{- fail "admission requires a distinct exact authenticated DaemonSet controller username" }}
{{- end }}
{{- if or (empty .Values.executor.nodeSelector) (empty .Values.attestor.nodeSelector) }}
{{- fail "WASI Executor and attestor require exact node selectors" }}
{{- end }}
{{- if or (empty .Values.microVmExecutor.nodeSelector) (empty .Values.microVmExecutor.tolerations) }}
{{- fail "microVmExecutor requires an exact nodeSelector and taint toleration" }}
{{- end }}
{{- $roleSecrets := list .Values.tls.controllerSecret .Values.tls.wasiExecutorSecret .Values.tls.microVmExecutorSecret .Values.tls.microVmProviderSecret .Values.tls.attestorSecret .Values.natsTls.existingSecret }}
{{- if ne (len (uniq $roleSecrets)) (len $roleSecrets) }}
{{- fail "Controller, Executor, Provider, attestor, and NATS roles require distinct Secret names" }}
{{- end }}
{{- if or (empty .Values.microVmExecutor.image.repository) (not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.microVmExecutor.image.digest)) }}
{{- fail "microVmExecutor.image requires a repository and immutable lowercase sha256 digest" }}
{{- end }}
{{- if or (empty .Values.microVmExecutor.provider.image.repository) (not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.microVmExecutor.provider.image.digest)) }}
{{- fail "microVmExecutor.provider.image requires a repository and immutable lowercase sha256 digest" }}
{{- end }}
{{- if or (eq .Values.microVmExecutor.image.repository .Values.microVmExecutor.provider.image.repository) (eq .Values.microVmExecutor.image.digest .Values.microVmExecutor.provider.image.digest) }}
{{- fail "microVM Executor and Provider must use distinct image repositories and digests" }}
{{- end }}
{{- if or (eq .Values.image.repository .Values.microVmExecutor.image.repository) (eq .Values.image.repository .Values.microVmExecutor.provider.image.repository) (eq .Values.image.digest .Values.microVmExecutor.image.digest) (eq .Values.image.digest .Values.microVmExecutor.provider.image.digest) }}
{{- fail "microVM Executor and Provider images must be distinct from the shared control-plane image" }}
{{- end }}
{{- $executionArch := get .Values.executor.nodeSelector "kubernetes.io/arch" }}
{{- if or (ne (len .Values.executor.nodeSelector) 3) (ne (get .Values.executor.nodeSelector "insight.platform.node-restriction.kubernetes.io/sandbox-wasi") "true") (ne (get .Values.executor.nodeSelector "kubernetes.io/os") "linux") (not (has $executionArch (list "amd64" "arm64"))) }}
{{- fail "WASI Executor requires an exact NodeRestriction-protected Linux node architecture" }}
{{- end }}
{{- if or (ne (len .Values.attestor.nodeSelector) 3) (ne (get .Values.attestor.nodeSelector "insight.platform.node-restriction.kubernetes.io/sandbox-attestor") "true") (ne (get .Values.attestor.nodeSelector "kubernetes.io/os") "linux") (ne (get .Values.attestor.nodeSelector "kubernetes.io/arch") $executionArch) }}
{{- fail "attestor requires its exact NodeRestriction-protected execution-node selector" }}
{{- end }}
{{- if or (ne (len .Values.microVmExecutor.nodeSelector) 3) (ne (get .Values.microVmExecutor.nodeSelector "insight.platform.node-restriction.kubernetes.io/sandbox-microvm") "true") (ne (get .Values.microVmExecutor.nodeSelector "kubernetes.io/os") "linux") (ne (get .Values.microVmExecutor.nodeSelector "kubernetes.io/arch") $executionArch) }}
{{- fail "microVmExecutor requires its exact NodeRestriction-protected Linux node architecture" }}
{{- end }}
{{- $microVmToleration := dict "key" "insight.platform/sandbox-microvm" "operator" "Equal" "value" "true" "effect" "NoSchedule" }}
{{- if not (deepEqual .Values.microVmExecutor.tolerations (list $microVmToleration)) }}
{{- fail "microVmExecutor requires the exact dedicated KVM-node taint toleration" }}
{{- end }}
{{- if not (deepEqual .Values.attestor.tolerations (list $microVmToleration)) }}
{{- fail "attestor requires the exact KVM-node toleration so registration is present on both execution pools" }}
{{- end }}
{{- if not (empty .Values.executor.tolerations) }}
{{- fail "WASI Executor must not tolerate the dedicated microVM node taint" }}
{{- end }}
{{- $providerHostPaths := dict "kvm" "/dev/kvm" "runtimeAssets" "/opt/insight/microvm-runtime-assets" "chrootBaseDirectory" "/var/lib/insight-firecracker-jails" "stateDirectory" "/var/lib/insight-sandbox-provider" "cgroup" "/sys/fs/cgroup" }}
{{- if not (deepEqual .Values.microVmExecutor.provider.hostPaths $providerHostPaths) }}
{{- fail "microVM Provider host paths must retain the exact disjoint device, read-only asset, jail, state, and cgroup authorities" }}
{{- end }}
{{- $attestorHostPaths := dict "proc" "/proc" "nodeUid" "/var/lib/insight/node-uid" "registryDirectory" "/var/lib/insight-sandbox-attestor" "socketDirectory" "/var/run/insight-sandbox-attestor" }}
{{- if not (deepEqual .Values.attestor.hostPaths $attestorHostPaths) }}
{{- fail "attestor host paths must retain the exact reviewed proc, node identity, registry, and socket authorities" }}
{{- end }}
{{- $firecrackerVersion := .Values.microVmExecutor.provider.installation.version | toString }}
{{- if ne $firecrackerVersion "1.16.1" }}
{{- fail "Firecracker version must equal the reviewed 1.16.1 security baseline" }}
{{- end }}
{{- $firecrackerVersionRoot := printf "/opt/insight/microvm-runtime-assets/firecracker/%s" $firecrackerVersion }}
{{- if or (ne .Values.microVmExecutor.provider.installation.firecracker_path (printf "%s/firecracker" $firecrackerVersionRoot)) (ne .Values.microVmExecutor.provider.installation.jailer_path (printf "%s/jailer" $firecrackerVersionRoot)) }}
{{- fail "Firecracker and jailer paths must exactly bind the declared security-baseline version" }}
{{- end }}
{{- if or (not (hasPrefix "/opt/insight/microvm-runtime-assets/" .Values.microVmExecutor.provider.installation.firecracker_path)) (not (hasPrefix "/opt/insight/microvm-runtime-assets/" .Values.microVmExecutor.provider.installation.jailer_path)) (regexMatch "(^|/)\\.\\.(/|$)" .Values.microVmExecutor.provider.installation.firecracker_path) (regexMatch "(^|/)\\.\\.(/|$)" .Values.microVmExecutor.provider.installation.jailer_path) }}
{{- fail "Firecracker and jailer paths must be below the read-only runtime asset mount" }}
{{- end }}
{{- range .Values.microVmExecutor.provider.runtimes }}
{{- if or (not (hasPrefix "/opt/insight/microvm-runtime-assets/" .guest_kernel_path)) (not (hasPrefix "/opt/insight/microvm-runtime-assets/" .rootfs_path)) (regexMatch "(^|/)\\.\\.(/|$)" .guest_kernel_path) (regexMatch "(^|/)\\.\\.(/|$)" .rootfs_path) }}
{{- fail "microVM kernel and rootfs paths must be below the read-only runtime asset mount" }}
{{- end }}
{{- end }}
{{- if ne .Values.microVmExecutor.provider.installation.chroot_base_directory "/srv/insight-firecracker-jails" }}
{{- fail "microVM provider chroot_base_directory must match its exact container mount" }}
{{- end }}
{{- if ne .Values.microVmExecutor.provider.stateDirectory "/var/lib/insight-sandbox-provider" }}
{{- fail "microVM provider stateDirectory must match its exact container mount" }}
{{- end }}
{{- if or (empty .Values.microVmExecutor.provider.runtimes) (lt (int .Values.microVmExecutor.provider.maximumInstances) 1) }}
{{- fail "microVM provider requires an installed runtime and bounded nonzero capacity" }}
{{- end }}
{{- if or (empty .Values.microVmExecutor.provider.egressBrokerEndpoint) (empty .Values.microVmExecutor.provider.egressBrokerTlsServerName) }}
{{- fail "microVM provider requires an exact Egress Broker mTLS endpoint" }}
{{- end }}
{{- if gt (int .Values.microVmExecutor.workerManifest.max_concurrency) (int .Values.microVmExecutor.provider.maximumInstances) }}
{{- fail "microVM worker concurrency cannot exceed provider instance capacity" }}
{{- end }}
{{- if or (lt (int .Values.microVmExecutor.managedRecovery.shardIndex) 0) (lt (int .Values.microVmExecutor.managedRecovery.shardCount) 1) (ge (int .Values.microVmExecutor.managedRecovery.shardIndex) (int .Values.microVmExecutor.managedRecovery.shardCount)) }}
{{- fail "microVM Managed recovery requires a valid bounded shard" }}
{{- end }}
{{- if or (lt (int .Values.microVmExecutor.managedRecovery.scanMilliseconds) 1) (lt (int .Values.microVmExecutor.managedRecovery.scanJitterMilliseconds) 0) (ge (int .Values.microVmExecutor.managedRecovery.scanJitterMilliseconds) (int .Values.microVmExecutor.managedRecovery.scanMilliseconds)) (lt (int .Values.microVmExecutor.managedRecovery.failureBackoffMilliseconds) 1) (gt (int .Values.microVmExecutor.managedRecovery.failureBackoffMilliseconds) (int .Values.microVmExecutor.managedRecovery.scanMilliseconds)) }}
{{- fail "microVM Managed recovery timing is invalid" }}
{{- end }}
{{- if empty .Values.controller.attestor.allowedNodeCidrs }}
{{- fail "controller.attestor.allowedNodeCidrs is required" }}
{{- end }}
{{- if empty .Values.networkPolicy.postgresCidrs }}
{{- fail "networkPolicy.postgresCidrs is required" }}
{{- end }}
{{- if empty .Values.networkPolicy.natsCidrs }}
{{- fail "networkPolicy.natsCidrs is required" }}
{{- end }}
{{- if or (empty .Values.networkPolicy.artifactBrokerNamespaceSelector) (empty .Values.networkPolicy.artifactBrokerPodSelector) }}
{{- fail "Artifact Broker NetworkPolicy selectors are required" }}
{{- end }}
{{- if or (not (deepEqual .Values.networkPolicy.artifactBrokerNamespaceSelector (dict "insight.platform/artifact-namespace" "true"))) (not (deepEqual .Values.networkPolicy.artifactBrokerPodSelector (dict "insight.platform/workload-role" "artifact-broker-sandbox"))) }}
{{- fail "Controller must target only the isolated Sandbox Artifact Broker workload role" }}
{{- end }}
{{- if or (lt (int .Values.networkPolicy.artifactBrokerPort) 1) (gt (int .Values.networkPolicy.artifactBrokerPort) 65535) }}
{{- fail "networkPolicy.artifactBrokerPort must be a valid fixed port" }}
{{- end }}
{{- if or (empty .Values.networkPolicy.egressBrokerNamespaceSelector) (empty .Values.networkPolicy.egressBrokerPodSelector) }}
{{- fail "Egress Broker NetworkPolicy selectors are required" }}
{{- end }}
{{- if or (lt (int .Values.networkPolicy.egressBrokerPort) 1) (gt (int .Values.networkPolicy.egressBrokerPort) 65535) }}
{{- fail "networkPolicy.egressBrokerPort must be a valid fixed port" }}
{{- end }}
{{- if or (empty .Values.controller.artifactBroker.endpoint) (empty .Values.controller.artifactBroker.tlsServerName) }}
{{- fail "Controller requires an exact Artifact Broker mTLS endpoint" }}
{{- end }}
{{- $expectedArtifactBrokerEndpoint := printf "https://%s:%d" .Values.controller.artifactBroker.tlsServerName (int .Values.networkPolicy.artifactBrokerPort) }}
{{- if ne .Values.controller.artifactBroker.endpoint $expectedArtifactBrokerEndpoint }}
{{- fail "Controller Artifact Broker endpoint must exactly match TLS identity and NetworkPolicy port" }}
{{- end }}
{{- if or (lt (int .Values.controller.artifactBroker.maximumRequestBytes) 1) (gt (int .Values.controller.artifactBroker.maximumRequestBytes) 1048576) (lt (int .Values.controller.artifactBroker.maximumChunkBytes) 1) (gt (int .Values.controller.artifactBroker.maximumChunkBytes) 262144) }}
{{- fail "Controller Artifact Broker RPC bounds exceed the closed hard caps" }}
{{- end }}
{{- if or (lt (int .Values.controller.artifactBroker.maximumInFlightResponses) 1) (gt (int .Values.controller.artifactBroker.maximumInFlightResponses) 4) }}
{{- fail "Controller Artifact response capacity must be between 1 and 4" }}
{{- end }}
{{- if or (empty .Values.tls.keys.artifactBrokerServerCa) (empty .Values.tls.keys.artifactBrokerClientCertificate) (empty .Values.tls.keys.artifactBrokerClientPrivateKey) }}
{{- fail "Controller Artifact Broker mTLS Secret keys are required" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must remain true" }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}
{{- fail "image.digest must be an immutable lowercase sha256 digest" }}
{{- end }}

{{- $executorConfig := include "insight-platform-sandbox.microVmExecutorConfig" . -}}
{{- $providerConfig := include "insight-platform-sandbox.microVmProviderConfig" . -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "insight-platform-sandbox.microVmExecutorName" . }}
  namespace: {{ .Values.namespaces.executor }}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: executor-microvm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: executor-microvm
        insight.platform/workload-role: sandbox-provider.microvm
      annotations:
        checksum/executor-config: {{ $executorConfig | sha256sum }}
        checksum/provider-config: {{ $providerConfig | sha256sum }}
    spec:
      serviceAccountName: {{ include "insight-platform-sandbox.microVmExecutorName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      nodeSelector: {{ toYaml .Values.microVmExecutor.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.microVmExecutor.tolerations | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-for-node-attestor
          image: {{ include "insight-platform-sandbox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec", "until test -S /run/insight-sandbox-attestor/registration.sock; do sleep 1; done"]
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: attestor-socket, mountPath: /run/insight-sandbox-attestor, readOnly: true}
      containers:
        - name: executor
          image: {{ include "insight-platform-sandbox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec", "until test -S /run/insight-sandbox-provider/provider.sock; do sleep 1; done; exec /usr/local/bin/platform-sandbox-executor"]
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          env:
            - {name: PLATFORM_SANDBOX_EXECUTOR_CONFIG, value: /etc/insight/executor-config/executor.json}
            - {name: PLATFORM_SANDBOX_EXECUTOR_CONFIG_DIGEST, value: {{ printf "sha256:%s" ($executorConfig | sha256sum) | quote }}}
            - {name: PLATFORM_SANDBOX_GRPC_CA_PATH, value: /etc/insight/executor-tls/{{ .Values.tls.keys.controllerServerCa }}}
            - {name: PLATFORM_SANDBOX_GRPC_CERT_PATH, value: /etc/insight/executor-tls/{{ .Values.tls.keys.executorClientCertificate }}}
            - {name: PLATFORM_SANDBOX_GRPC_KEY_PATH, value: /etc/insight/executor-tls/{{ .Values.tls.keys.executorClientPrivateKey }}}
            - {name: PLATFORM_SANDBOX_ATTESTOR_CA_PATH, value: /etc/insight/executor-tls/{{ .Values.tls.keys.attestorServerCa }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_CA_PATH, value: /etc/insight/executor-tls/{{ .Values.tls.keys.providerClientCa }}}
            - {name: PLATFORM_SANDBOX_NATS_CA_PATH, value: /etc/insight/nats-tls/{{ .Values.natsTls.rootCertificateKey }}}
            - {name: PLATFORM_SANDBOX_NATS_CERT_PATH, value: /etc/insight/nats-tls/{{ .Values.natsTls.clientCertificateKey }}}
            - {name: PLATFORM_SANDBOX_NATS_KEY_PATH, value: /etc/insight/nats-tls/{{ .Values.natsTls.clientPrivateKeyKey }}}
          startupProbe: {exec: {command: ["sh", "-ec", "kill -0 1 && test -S /run/insight-sandbox-attestor/registration.sock && test -S /run/insight-sandbox-provider/provider.sock"]}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {exec: {command: ["sh", "-ec", "kill -0 1 && test -S /run/insight-sandbox-provider/provider.sock"]}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {exec: {command: ["sh", "-ec", "kill -0 1"]}, periodSeconds: 10, timeoutSeconds: 2}
          resources: {{ toYaml .Values.microVmExecutor.resources | nindent 12 }}
          volumeMounts:
            - {name: executor-config, mountPath: /etc/insight/executor-config, readOnly: true}
            - {name: executor-tls, mountPath: /etc/insight/executor-tls, readOnly: true}
            - {name: nats-tls, mountPath: /etc/insight/nats-tls, readOnly: true}
            - {name: attestor-socket, mountPath: /run/insight-sandbox-attestor, readOnly: true}
            - {name: provider-socket, mountPath: /run/insight-sandbox-provider}
            - {name: executor-tmp, mountPath: /tmp}
        - name: provider
          image: {{ include "insight-platform-sandbox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/platform-sandbox-microvm-provider"]
          securityContext:
            runAsUser: 0
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "KILL", "SETGID", "SETUID", "SYS_ADMIN", "SYS_RESOURCE"]
          env:
            - {name: PLATFORM_SANDBOX_MICROVM_PROVIDER_CONFIG, value: /etc/insight/provider-config/provider.json}
            - {name: PLATFORM_SANDBOX_MICROVM_PROVIDER_CONFIG_DIGEST, value: {{ printf "sha256:%s" ($providerConfig | sha256sum) | quote }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_CLIENT_CA_PATH, value: /etc/insight/provider-tls/{{ .Values.tls.keys.providerClientCa }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_CERT_PATH, value: /etc/insight/provider-tls/{{ .Values.tls.keys.providerServerCertificate }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_KEY_PATH, value: /etc/insight/provider-tls/{{ .Values.tls.keys.providerServerPrivateKey }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_BROKER_CA_PATH, value: /etc/insight/provider-tls/{{ .Values.tls.keys.providerControllerCa }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_BROKER_CERT_PATH, value: /etc/insight/provider-tls/{{ .Values.tls.keys.providerClientCertificate }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_BROKER_KEY_PATH, value: /etc/insight/provider-tls/{{ .Values.tls.keys.providerClientPrivateKey }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_EGRESS_CA_PATH, value: /etc/insight/provider-tls/{{ .Values.tls.keys.providerEgressCa }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_EGRESS_CERT_PATH, value: /etc/insight/provider-tls/{{ .Values.tls.keys.providerClientCertificate }}}
            - {name: PLATFORM_SANDBOX_PROVIDER_EGRESS_KEY_PATH, value: /etc/insight/provider-tls/{{ .Values.tls.keys.providerClientPrivateKey }}}
          startupProbe: {exec: {command: ["sh", "-ec", "kill -0 1 && test -S /run/insight-sandbox-provider/provider.sock"]}, failureThreshold: 90, periodSeconds: 2}
          readinessProbe: {exec: {command: ["sh", "-ec", "kill -0 1 && test -S /run/insight-sandbox-provider/provider.sock"]}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {exec: {command: ["sh", "-ec", "kill -0 1"]}, periodSeconds: 10, timeoutSeconds: 2}
          resources: {{ toYaml .Values.microVmExecutor.provider.resources | nindent 12 }}
          volumeMounts:
            - {name: provider-config, mountPath: /etc/insight/provider-config, readOnly: true}
            - {name: provider-tls, mountPath: /etc/insight/provider-tls, readOnly: true}
            - {name: provider-socket, mountPath: /run/insight-sandbox-provider}
            - {name: kvm, mountPath: /dev/kvm}
            - {name: firecracker-jails, mountPath: /srv/insight-firecracker-jails}
            - {name: provider-state, mountPath: /var/lib/insight-sandbox-provider}
            - {name: host-cgroup, mountPath: /sys/fs/cgroup}
            - {name: provider-tmp, mountPath: /tmp}
      volumes:
        - {name: executor-config, configMap: {name: {{ include "insight-platform-sandbox.microVmExecutorName" . }}}}
        - {name: provider-config, configMap: {name: {{ include "insight-platform-sandbox.microVmExecutorName" . }}-provider}}
        - {name: executor-tls, secret: {secretName: {{ .Values.tls.microVmExecutorSecret }}, defaultMode: 0440}}
        - {name: provider-tls, secret: {secretName: {{ .Values.tls.microVmProviderSecret }}, defaultMode: 0440}}
        - {name: nats-tls, secret: {secretName: {{ .Values.natsTls.existingSecret }}, defaultMode: 0440}}
        - {name: attestor-socket, hostPath: {path: {{ .Values.attestor.hostPaths.socketDirectory }}, type: Directory}}
        - {name: provider-socket, emptyDir: {sizeLimit: 16Mi}}
        - {name: kvm, hostPath: {path: {{ .Values.microVmExecutor.provider.hostPaths.kvm }}, type: CharDevice}}
        - {name: firecracker-jails, hostPath: {path: {{ .Values.microVmExecutor.provider.hostPaths.chrootBaseDirectory }}, type: DirectoryOrCreate}}
        - {name: provider-state, hostPath: {path: {{ .Values.microVmExecutor.provider.hostPaths.stateDirectory }}, type: DirectoryOrCreate}}
        - {name: host-cgroup, hostPath: {path: {{ .Values.microVmExecutor.provider.hostPaths.cgroup }}, type: Directory}}
        - {name: executor-tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: provider-tmp, emptyDir: {sizeLimit: 64Mi}}

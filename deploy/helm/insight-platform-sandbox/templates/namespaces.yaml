apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.control }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.control }}
    insight.platform/sandbox-control-namespace: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.workloads }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.workloads }}
    insight.platform/sandbox-workload-namespace: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.dispatcher.serviceAccountName }}
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatcher
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.server.serviceAccountName }}
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox-server
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccountName }}
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox-controller
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.sandbox.serviceAccountName }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-workload
automountServiceAccountToken: false

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-dispatcher
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: dispatcher}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringPodSelector | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.dispatcher.observabilityPort }}}
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: opensandbox-server}
      ports:
        - {protocol: TCP, port: {{ .Values.server.port }}}
    - to:
        {{- range .Values.networkPolicy.postgresCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.postgresPort }}}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensandbox-server
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: opensandbox-server}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: dispatcher}
      ports:
        - {protocol: TCP, port: {{ .Values.server.port }}}
  egress:
    - to:
        {{- range .Values.networkPolicy.kubernetesApiCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels: {insight.platform/sandbox-workload-namespace: "true"}
          podSelector:
            matchLabels: {platform.insight.dev/schema: v1}
      ports:
        - {protocol: TCP, port: {{ .Values.sandbox.runnerPort }}}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensandbox-controller
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: opensandbox-controller}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringPodSelector | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.controller.metricsPort }}}
  egress:
    - to:
        {{- range .Values.networkPolicy.kubernetesApiCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: armed-runner-ingress
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {platform.insight.dev/schema: v1}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {insight.platform/sandbox-control-namespace: "true"}
          podSelector:
            matchLabels: {app.kubernetes.io/component: opensandbox-server}
      ports:
        - {protocol: TCP, port: {{ .Values.sandbox.runnerPort }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: armed-runner-direct
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      platform.insight.dev/schema: v1
      platform.insight.dev/network: direct
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.directExternalCidr }}
            except:
              {{- toYaml .Values.networkPolicy.directDeniedCidrs | nindent 14 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: armed-runner-disabled
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      platform.insight.dev/schema: v1
      platform.insight.dev/network: disabled
  policyTypes: [Egress]
  egress: []
{{- end }}

{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sandbox-dispatcher
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatcher
spec:
  selector:
    matchLabels: {app.kubernetes.io/component: dispatcher}
  namespaceSelector:
    matchNames: [{{ .Values.namespaces.control }}]
  endpoints:
    - port: observability
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opensandbox-controller
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox-controller
spec:
  selector:
    matchLabels: {app.kubernetes.io/component: opensandbox-controller}
  namespaceSelector:
    matchNames: [{{ .Values.namespaces.control }}]
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
{{- end }}

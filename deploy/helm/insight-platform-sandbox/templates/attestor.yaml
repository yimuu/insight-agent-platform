{{- $config := include "insight-platform-sandbox.attestorConfig" . -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "insight-platform-sandbox.attestorName" . }}
  namespace: {{ .Values.namespaces.executor }}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: attestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: attestor
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      serviceAccountName: {{ include "insight-platform-sandbox.attestorName" . }}
      automountServiceAccountToken: false
      hostPID: true
      terminationGracePeriodSeconds: 40
      schedulerName: {{ .Values.admission.schedulerName }}
      nodeSelector: {{ toYaml .Values.attestor.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.attestor.tolerations | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 0, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}, appArmorProfile: {type: RuntimeDefault}}
      containers:
        - name: attestor
          image: {{ include "insight-platform-sandbox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/platform-sandbox-attestor"]
          securityContext: {runAsUser: 0, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"], add: ["SYS_PTRACE"]}}
          env:
            - {name: PLATFORM_SANDBOX_ATTESTOR_CONFIG, value: /etc/insight/config/attestor.json}
            - {name: PLATFORM_SANDBOX_ATTESTOR_CONFIG_DIGEST, value: {{ printf "sha256:%s" ($config | sha256sum) | quote }}}
            - name: NODE_IP
              valueFrom: {fieldRef: {apiVersion: v1, fieldPath: status.hostIP}}
            - {name: PLATFORM_SANDBOX_ATTESTOR_ADVERTISED_IP, value: $(NODE_IP)}
            - {name: PLATFORM_SANDBOX_ATTESTOR_EXECUTOR_CA_PATH, value: /etc/insight/tls/{{ .Values.tls.keys.executorClientCa }}}
            - {name: PLATFORM_SANDBOX_ATTESTOR_REGISTRATION_CERT_PATH, value: /etc/insight/tls/{{ .Values.tls.keys.attestorServerCertificate }}}
            - {name: PLATFORM_SANDBOX_ATTESTOR_REGISTRATION_KEY_PATH, value: /etc/insight/tls/{{ .Values.tls.keys.attestorServerPrivateKey }}}
            - {name: PLATFORM_SANDBOX_ATTESTOR_CONTROLLER_CA_PATH, value: /etc/insight/tls/{{ .Values.tls.keys.controllerClientCa }}}
            - {name: PLATFORM_SANDBOX_ATTESTOR_CONTROLLER_CERT_PATH, value: /etc/insight/tls/{{ .Values.tls.keys.attestorServerCertificate }}}
            - {name: PLATFORM_SANDBOX_ATTESTOR_CONTROLLER_KEY_PATH, value: /etc/insight/tls/{{ .Values.tls.keys.attestorServerPrivateKey }}}
          ports:
            - {name: attest, containerPort: {{ int .Values.attestor.controllerPort }}, hostPort: {{ int .Values.attestor.controllerPort }}, protocol: TCP}
            - {name: observability, containerPort: {{ int .Values.attestor.observabilityPort }}, protocol: TCP}
          startupProbe: {httpGet: {path: /livez, port: observability}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: observability}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /livez, port: observability}, periodSeconds: 10, timeoutSeconds: 2}
          resources: {{ toYaml .Values.attestor.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/insight/config, readOnly: true}
            - {name: tls, mountPath: /etc/insight/tls, readOnly: true}
            - {name: host-proc, mountPath: /host/proc, readOnly: true}
            - {name: node-uid, mountPath: /host/node-uid, readOnly: true}
            - {name: registry, mountPath: /var/lib/insight-sandbox-attestor}
            - {name: socket, mountPath: /run/insight-sandbox-attestor}
      volumes:
        - {name: config, configMap: {name: {{ include "insight-platform-sandbox.attestorName" . }}}}
        - {name: tls, secret: {secretName: {{ .Values.tls.attestorSecret }}, defaultMode: 0440}}
        - {name: host-proc, hostPath: {path: {{ .Values.attestor.hostPaths.proc }}, type: Directory}}
        - {name: node-uid, hostPath: {path: {{ .Values.attestor.hostPaths.nodeUid }}, type: File}}
        - {name: registry, hostPath: {path: {{ .Values.attestor.hostPaths.registryDirectory }}, type: DirectoryOrCreate}}
        - {name: socket, hostPath: {path: {{ .Values.attestor.hostPaths.socketDirectory }}, type: DirectoryOrCreate}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-platform-sandbox.attestorName" . }}
  namespace: {{ .Values.namespaces.executor }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: attestor
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: attestor
  ports: [{name: observability, port: {{ int .Values.attestor.observabilityPort }}, targetPort: observability}]

{{- $wasiConfig := include "insight-platform-sandbox.executorConfig" . -}}
{{- $attestorConfig := include "insight-platform-sandbox.attestorConfig" . -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "insight-platform-sandbox.name" . }}-executor-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
        scope: Namespaced
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['app.kubernetes.io/name'] == {{ .Chart.Name | quote }} &&
        object.metadata.labels['app.kubernetes.io/instance'] == {{ .Release.Name | quote }} &&
        object.metadata.labels['app.kubernetes.io/component'] in ['attestor', 'executor-wasi'] &&
        object.metadata.labels.all(k, v, k in [
          'app.kubernetes.io/name', 'app.kubernetes.io/instance',
          'app.kubernetes.io/component', 'controller-revision-hash',
          'pod-template-generation'])
      message: only the installed WASI Executor and attestor pod roles are allowed
    - expression: >-
        has(object.metadata.annotations) &&
        ((object.metadata.labels['app.kubernetes.io/component'] == 'executor-wasi' &&
          object.metadata.annotations['checksum/config'] == {{ $wasiConfig | sha256sum | quote }}) ||
         (object.metadata.labels['app.kubernetes.io/component'] == 'attestor' &&
          object.metadata.annotations['checksum/config'] == {{ $attestorConfig | sha256sum | quote }})) &&
        object.metadata.annotations.all(k, v, k in ['checksum/config', 'deprecated.daemonset.template.generation'])
      message: Sandbox execution pods require the installed immutable configuration digest
    - expression: >-
        ((request.operation == 'CREATE' && request.userInfo.username == {{ .Values.admission.daemonSetControllerUsername | quote }}) ||
         (request.operation == 'UPDATE' && object.metadata.ownerReferences == oldObject.metadata.ownerReferences)) &&
        has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() == 1 &&
        ((object.metadata.labels['app.kubernetes.io/component'] == 'executor-wasi' &&
          object.metadata.ownerReferences.exists_one(r,
            r.apiVersion == 'apps/v1' && r.kind == 'DaemonSet' &&
            r.name == {{ include "insight-platform-sandbox.executorName" . | quote }} && r.uid != '' &&
            has(r.controller) && r.controller && has(r.blockOwnerDeletion) && r.blockOwnerDeletion)) ||
         (object.metadata.labels['app.kubernetes.io/component'] == 'attestor' &&
          object.metadata.ownerReferences.exists_one(r,
            r.apiVersion == 'apps/v1' && r.kind == 'DaemonSet' &&
            r.name == {{ include "insight-platform-sandbox.attestorName" . | quote }} && r.uid != '' &&
            has(r.controller) && r.controller && has(r.blockOwnerDeletion) && r.blockOwnerDeletion)))
      message: Sandbox execution pods require the exact DaemonSet controller identity and owner
    - expression: >-
        object.spec.automountServiceAccountToken == false &&
        !object.spec.hostNetwork && !object.spec.hostIPC &&
        object.spec.schedulerName == {{ .Values.admission.schedulerName | quote }} &&
        (!has(object.spec.runtimeClassName) || object.spec.runtimeClassName == '') &&
        (!has(object.spec.resourceClaims) || object.spec.resourceClaims.size() == 0) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.size() == 0) &&
        has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        has(object.spec.securityContext.appArmorProfile) &&
        object.spec.securityContext.appArmorProfile.type == 'RuntimeDefault' &&
        ((object.metadata.labels['app.kubernetes.io/component'] == 'executor-wasi' &&
          object.spec.nodeSelector == {{ .Values.executor.nodeSelector | toJson }} &&
          (!has(object.spec.hostPID) || !object.spec.hostPID) &&
          object.spec.serviceAccountName == {{ include "insight-platform-sandbox.executorName" . | quote }}) ||
         (object.metadata.labels['app.kubernetes.io/component'] == 'attestor' &&
          object.spec.nodeSelector == {{ .Values.attestor.nodeSelector | toJson }} &&
          object.spec.hostPID &&
          object.spec.serviceAccountName == {{ include "insight-platform-sandbox.attestorName" . | quote }}))
      message: Sandbox execution pods require their exact node, identity, and host isolation contract
    - expression: >-
        object.spec.containers.all(c,
          c.securityContext.allowPrivilegeEscalation == false &&
          c.securityContext.readOnlyRootFilesystem &&
          (!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
          c.securityContext.capabilities.drop == ['ALL'] &&
          (!has(c.volumeDevices) || c.volumeDevices.size() == 0) &&
          (!has(c.envFrom) || c.envFrom.size() == 0) && !has(c.lifecycle)) &&
        object.spec.initContainers.all(c,
          c.securityContext.allowPrivilegeEscalation == false &&
          c.securityContext.readOnlyRootFilesystem &&
          (!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
          c.securityContext.capabilities.drop == ['ALL'])
      message: Sandbox execution containers retain the closed privilege boundary
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "insight-platform-sandbox.name" . }}-executor-pods
spec:
  policyName: {{ include "insight-platform-sandbox.name" . }}-executor-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.namespaces.executor }}
    objectSelector:
      matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values: [attestor, executor-wasi]

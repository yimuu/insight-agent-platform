            r.apiVersion == 'apps/v1' && r.kind == 'DaemonSet' &&
            r.name == {{ include "insight-platform-sandbox.attestorName" . | quote }} && r.uid != '' &&
            has(r.controller) && r.controller && has(r.blockOwnerDeletion) && r.blockOwnerDeletion)))

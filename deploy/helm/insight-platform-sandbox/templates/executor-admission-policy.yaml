{{- $wasiConfig := include "insight-platform-sandbox.executorConfig" . -}}
{{- $microVmExecutorConfig := include "insight-platform-sandbox.microVmExecutorConfig" . -}}
{{- $microVmProviderConfig := include "insight-platform-sandbox.microVmProviderConfig" . -}}
{{- $attestorConfig := include "insight-platform-sandbox.attestorConfig" . -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "insight-platform-sandbox.name" . }}-executor-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]

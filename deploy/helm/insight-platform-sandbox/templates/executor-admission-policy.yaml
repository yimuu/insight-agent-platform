           c.volumeMounts.size() == 1 &&
           c.volumeMounts.exists_one(v, v.name == 'socket' && v.mountPath == '/run/insight-sandbox-attestor' && v.readOnly) &&
           c.volumeMounts.all(v, (!has(v.subPath) || v.subPath == '') && (!has(v.subPathExpr) || v.subPathExpr == '') && (!has(v.mountPropagation) || v.mountPropagation == 'None')) &&
           (!has(c.volumeDevices) || c.volumeDevices.size() == 0) &&
           (!has(c.env) || c.env.size() == 0) && (!has(c.envFrom) || c.envFrom.size() == 0) &&
           (!has(c.ports) || c.ports.size() == 0) && !has(c.lifecycle) && !has(c.restartPolicy) &&
           !has(c.startupProbe) && !has(c.readinessProbe) && !has(c.livenessProbe)) &&
         object.spec.containers.exists_one(c, c.name == 'executor' &&

           (!has(c.envFrom) || c.envFrom.size() == 0) && (!has(c.ports) || c.ports.size() == 0) && !has(c.lifecycle) &&
           c.startupProbe.exec.command == ['sh', '-ec', 'kill -0 1 && test -S /run/insight-sandbox-attestor/registration.sock'] &&
           c.readinessProbe.exec.command == ['sh', '-ec', 'kill -0 1 && test -S /run/insight-sandbox-attestor/registration.sock'] &&

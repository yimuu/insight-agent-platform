  validations:
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['app.kubernetes.io/name'] == {{ .Chart.Name | quote }} &&
        object.metadata.labels['app.kubernetes.io/instance'] == {{ .Release.Name | quote }} &&
        object.metadata.labels['app.kubernetes.io/component'] in ['attestor', 'executor-wasi', 'executor-microvm'] &&
        object.metadata.labels.all(k, v,
          k in ['app.kubernetes.io/name', 'app.kubernetes.io/instance', 'app.kubernetes.io/component', 'controller-revision-hash', 'pod-template-generation'] ||
          (object.metadata.labels['app.kubernetes.io/component'] == 'executor-microvm' && k == 'insight.platform/workload-role')) &&
        (object.metadata.labels['app.kubernetes.io/component'] != 'executor-microvm' ||
          object.metadata.labels['insight.platform/workload-role'] == 'sandbox-provider.microvm')

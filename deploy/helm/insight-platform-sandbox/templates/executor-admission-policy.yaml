           c.volumeMounts.exists_one(v, v.name == 'tls' && v.mountPath == '/etc/insight/tls' && v.readOnly) &&
           c.volumeMounts.exists_one(v, v.name == 'nats-tls' && v.mountPath == '/etc/insight/nats-tls' && v.readOnly) &&
           c.volumeMounts.exists_one(v, v.name == 'socket' && v.mountPath == '/run/insight-sandbox-attestor' && v.readOnly) &&

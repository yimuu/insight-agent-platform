apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "insight-platform-sandbox.name" . }}-executor-pods
spec:
  policyName: {{ include "insight-platform-sandbox.name" . }}-executor-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.namespaces.executor | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "insight-platform-sandbox.name" . }}-restricted-subresources
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/resize"]
        scope: Namespaced
  validations:
    - expression: "false"
      message: interactive exec, attach, port-forward, and in-place resize are forbidden in the Sandbox executor namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "insight-platform-sandbox.name" . }}-restricted-subresources
spec:
  policyName: {{ include "insight-platform-sandbox.name" . }}-restricted-subresources
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.namespaces.executor | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "insight-platform-sandbox.name" . }}-pod-binding
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
        scope: Namespaced
  validations:
    - expression: >-
        request.userInfo.username == {{ .Values.admission.schedulerUsername | quote }} &&
        object.target.kind == 'Node' && object.target.name != '' &&
        (!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) &&
        (!has(object.metadata.labels) || object.metadata.labels.all(k, v,
          k in ['topology.kubernetes.io/region', 'topology.kubernetes.io/zone']))

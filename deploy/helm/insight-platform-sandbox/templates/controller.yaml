apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensandbox-controller-leader-election
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox-controller
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensandbox-controller-leader-election
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensandbox-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccountName }}
    namespace: {{ .Values.namespaces.control }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-opensandbox-controller
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox-controller
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs/status]
    verbs: [get, patch, update]
  - apiGroups: [sandbox.opensandbox.io]
    resources: [batchsandboxes]
    verbs: [delete, get, list, patch, update, watch]
  - apiGroups: [sandbox.opensandbox.io]
    resources: [pools, sandboxsnapshots]
    verbs: [delete, get, list, patch, update, watch]
  - apiGroups: [sandbox.opensandbox.io]
    resources: [batchsandboxes/finalizers, pools/finalizers, sandboxsnapshots/finalizers]
    verbs: [update]
  - apiGroups: [sandbox.opensandbox.io]
    resources: [batchsandboxes/status, pools/status, sandboxsnapshots/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-opensandbox-controller
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-opensandbox-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccountName }}
    namespace: {{ .Values.namespaces.control }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-controller
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox-controller
    app.kubernetes.io/version: "0.2.0"
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: insight-platform-sandbox
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: opensandbox-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insight-platform-sandbox
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: opensandbox-controller
      annotations:
        insight.platform/deployment-config-digest: {{ .Values.global.deploymentConfigDigest | quote }}
        insight.platform/upstream-commit: {{ .Values.global.sourceCommit | quote }}
        insight.platform/image-digest: {{ .Values.images.controller.digest | quote }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccountName }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "insight-platform-sandbox.image" .Values.images.controller }}
          imagePullPolicy: {{ .Values.images.controller.pullPolicy }}
          command: [/workspace/server]
          args:
            - --leader-elect
            - --health-probe-bind-address=:{{ .Values.controller.healthPort }}
            - --metrics-bind-address=:{{ .Values.controller.metricsPort }}
            - --metrics-secure=false
            - --zap-log-level=info
            - --kube-client-qps=100
            - --kube-client-burst=200
            - --concurrency=batchsandbox=4;pool=1
          ports:
            - {name: metrics, containerPort: {{ .Values.controller.metricsPort }}, protocol: TCP}
            - {name: health, containerPort: {{ .Values.controller.healthPort }}, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-controller-metrics
  namespace: {{ .Values.namespaces.control }}
  labels:
    {{- include "insight-platform-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox-controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: insight-platform-sandbox
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: opensandbox-controller
  ports:
    - {name: metrics, port: {{ .Values.controller.metricsPort }}, targetPort: metrics, protocol: TCP}

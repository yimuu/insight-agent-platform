# Source-reviewed Platform overlay for OpenSandbox server/v0.2.3 at
# c39b814f36ded4c61d5ac6f9332ee4dfbab86c00. Runtime-generated fields win;
# OpenSandbox then explicitly merges only these fixed volumes, mounts, and main-container security.
metadata:
  labels:
    insight.platform/sandbox-template: armed-runner-v2
spec:
  replicas: 1
  template:
    metadata:
      labels:
        insight.platform/sandbox-template: armed-runner-v2
    spec:
      serviceAccountName: sandbox-workload
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroupsPolicy: Strict
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: [ALL]
              add: [KILL, SETGID, SETUID]
          volumeMounts:
            - name: runner-state
              mountPath: /run/insight-sandbox
            - name: sandbox-tmp
              mountPath: /tmp
      volumes:
        - name: runner-state
          emptyDir:
            medium: Memory
            sizeLimit: 2Mi
        - name: sandbox-tmp
          emptyDir:
            sizeLimit: 256Mi

{{- if lt (int .Values.replicas) 2 -}}{{- fail "MCP Host requires at least two replicas" -}}{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) -}}{{- fail "image.digest must be exact sha256" -}}{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.config.digest) -}}{{- fail "config.digest must be exact sha256" -}}{{- end -}}
{{- if or (empty .Values.config.existingConfigMap) (empty .Values.serverTls.existingSecret) (empty .Values.egressTls.existingSecret) -}}{{- fail "config and both TLS identities are required" -}}{{- end -}}
{{- if or (empty .Values.networkPolicy.callerNamespace) (empty .Values.networkPolicy.callerPodSelector) (empty .Values.networkPolicy.egressNamespace) (empty .Values.networkPolicy.egressPodSelector) -}}{{- fail "exact caller and Egress selectors are required" -}}{{- end -}}
{{- if .Values.autoscaling.enabled -}}
{{- if lt (int .Values.autoscaling.minReplicas) 2 -}}{{- fail "HPA requires at least two replicas" -}}{{- end -}}
{{- if lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas) -}}{{- fail "HPA maximum must be at least minimum" -}}{{- end -}}
{{- end -}}

{{- if lt (int .Values.replicas) 2 -}}{{- fail "MCP Host requires at least two replicas" -}}{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) -}}{{- fail "image.digest must be exact sha256" -}}{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.config.digest) -}}{{- fail "config.digest must be exact sha256" -}}{{- end -}}
{{- if or (empty .Values.config.existingConfigMap) (empty .Values.serverTls.existingSecret) (empty .Values.egressTls.existingSecret) -}}{{- fail "config and both TLS identities are required" -}}{{- end -}}
{{- if or (empty .Values.networkPolicy.callerNamespace) (empty .Values.networkPolicy.callerPodSelector) (empty .Values.networkPolicy.egressNamespace) (empty .Values.networkPolicy.egressPodSelector) -}}{{- fail "exact caller and Egress selectors are required" -}}{{- end -}}
{{- if or (lt (int .Values.observability.port) 1) (gt (int .Values.observability.port) 65535) (eq (int .Values.observability.port) (int .Values.service.port)) -}}{{- fail "observability port must be distinct and in 1..65535" -}}{{- end -}}
{{- if and .Values.monitoring.enabled (or (empty .Values.networkPolicy.monitoringNamespaceSelector) (empty .Values.networkPolicy.monitoringPodSelector)) -}}{{- fail "monitoring requires exact namespace and Pod selectors" -}}{{- end -}}
{{- if .Values.autoscaling.enabled -}}
{{- if lt (int .Values.autoscaling.minReplicas) 2 -}}{{- fail "HPA requires at least two replicas" -}}{{- end -}}
{{- if lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas) -}}{{- fail "HPA maximum must be at least minimum" -}}{{- end -}}
{{- end -}}
{{- if .Values.resourcePool.enabled -}}
{{- if lt (int .Values.resourcePool.replicas) 2 -}}{{- fail "MCP Resource Host requires at least two replicas" -}}{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.resourcePool.config.digest) -}}{{- fail "resourcePool config.digest must be exact sha256" -}}{{- end -}}
{{- if or (empty .Values.resourcePool.config.existingConfigMap) (empty .Values.resourcePool.database.existingSecret) (empty .Values.resourcePool.serverTls.existingSecret) -}}{{- fail "MCP Resource Host config, database and server TLS are required" -}}{{- end -}}
{{- if or (empty .Values.resourcePool.callerNamespace) (empty .Values.resourcePool.callerPodSelector) (empty .Values.resourcePool.postgresCidrs) -}}{{- fail "MCP Resource Host exact caller and PostgreSQL CIDRs are required" -}}{{- end -}}
{{- if eq (int .Values.resourcePool.service.port) (int .Values.resourcePool.observability.port) -}}{{- fail "MCP Resource Host observability port must be distinct" -}}{{- end -}}
{{- if and .Values.resourcePool.autoscaling.enabled (lt (int .Values.resourcePool.autoscaling.minReplicas) 2) -}}{{- fail "MCP Resource Host HPA requires at least two replicas" -}}{{- end -}}
{{- end -}}

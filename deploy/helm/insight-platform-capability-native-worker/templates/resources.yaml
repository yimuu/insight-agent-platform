apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    insight.platform/workload-namespace: capability-native-worker
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ include "insight-platform-capability-native-worker.name" . }}, namespace: {{ .Values.namespace }}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-platform-capability-native-worker.name" . }}
  namespace: {{ .Values.namespace }}
  labels: {{ include "insight-platform-capability-native-worker.labels" . | nindent 4 }}
spec:
  selector: {{ include "insight-platform-capability-native-worker.labels" . | nindent 4 }}
  ports: [{name: observability, port: {{ int .Values.observability.port }}, targetPort: observability, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-platform-capability-native-worker.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ int .Values.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels:
      {{- include "insight-platform-capability-native-worker.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-platform-capability-native-worker.labels" . | nindent 8 }}
        insight.platform/workload-role: capability-native-worker
        insight.platform/component-role: capability_native_worker
      annotations:
        insight.platform/deployment-config-digest: {{ .Values.candidate.deploymentConfigDigest | quote }}
    spec:
      serviceAccountName: {{ include "insight-platform-capability-native-worker.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "insight-platform-capability-native-worker.labels" . | nindent 14 }}
      containers:
        - name: capability-native-worker
          image: {{ include "insight-platform-capability-native-worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/platform-capability-native-worker"]
          ports: [{name: observability, containerPort: {{ int .Values.observability.port }}, protocol: TCP}]
          env:
            - {name: PLATFORM_CAPABILITY_NATIVE_WORKER_CONFIG, value: /etc/insight/config/capability-native-worker.json}
            - {name: PLATFORM_CAPABILITY_NATIVE_WORKER_CONFIG_DIGEST, value: {{ .Values.config.digest | quote }}}
            - name: PLATFORM_CAPABILITY_NATIVE_WORKER_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.urlKey }}}}
          startupProbe: {httpGet: {path: /livez, port: observability}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: observability}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /livez, port: observability}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 6}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/insight/config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap }}
            items: [{key: {{ .Values.config.fileKey }}, path: capability-native-worker.json}]
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ include "insight-platform-capability-native-worker.name" . }}, namespace: {{ .Values.namespace }}}
spec:
  minAvailable: {{ int .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "insight-platform-capability-native-worker.labels" . | nindent 6 }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ include "insight-platform-capability-native-worker.name" . }}, namespace: {{ .Values.namespace }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "insight-platform-capability-native-worker.name" . }}}
  minReplicas: {{ int .Values.autoscaling.minReplicas }}
  maxReplicas: {{ int .Values.autoscaling.maxReplicas }}
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}, scaleUp: {stabilizationWindowSeconds: 30}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ int .Values.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}

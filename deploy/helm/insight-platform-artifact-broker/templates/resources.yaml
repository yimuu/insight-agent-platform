{{- $root := . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    insight.platform/artifact-namespace: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
{{ range $audience, $broker := .Values.brokers }}
{{ $context := dict "audience" $audience }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insight-platform-artifact-broker.name" $context }}
  namespace: {{ $root.Values.namespace }}
  annotations:
    {{- toYaml $broker.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-platform-artifact-broker.name" $context }}
  namespace: {{ $root.Values.namespace }}
spec:
  type: ClusterIP
  selector:
    {{- include "insight-platform-artifact-broker.labels" $context | nindent 4 }}
  ports:
    - {name: grpc-mtls, protocol: TCP, port: {{ int $broker.port }}, targetPort: grpc-mtls}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-platform-artifact-broker.name" $context }}
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "insight-platform-artifact-broker.labels" $context | nindent 4 }}
spec:
  replicas: {{ int $broker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "insight-platform-artifact-broker.labels" $context | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-platform-artifact-broker.labels" $context | nindent 8 }}
    spec:
      serviceAccountName: {{ include "insight-platform-artifact-broker.name" $context }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      imagePullSecrets: {{ toYaml $root.Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "insight-platform-artifact-broker.labels" $context | nindent 14 }}
      containers:
        - name: artifact-broker
          image: {{ include "insight-platform-artifact-broker.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/usr/local/bin/platform-artifact-broker"]
          ports: [{name: grpc-mtls, containerPort: {{ int $broker.port }}, protocol: TCP}]
          env:
            - {name: PLATFORM_ARTIFACT_BROKER_AUDIENCE, value: {{ $audience | quote }}}
            - {name: PLATFORM_ARTIFACT_BROKER_CONFIG, value: /etc/insight/config/artifact-broker.json}
            - {name: PLATFORM_ARTIFACT_BROKER_CONFIG_DIGEST, value: {{ $broker.config.digest | quote }}}
            - name: PLATFORM_ARTIFACT_BROKER_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $broker.database.existingSecret }}, key: {{ $broker.database.urlKey }}}}
            - {name: PLATFORM_ARTIFACT_BROKER_CLIENT_CA_PATH, value: /etc/insight/tls/client-ca.pem}
            - {name: PLATFORM_ARTIFACT_BROKER_CERT_PATH, value: /etc/insight/tls/server.pem}
            - {name: PLATFORM_ARTIFACT_BROKER_KEY_PATH, value: /etc/insight/tls/server-key.pem}
          startupProbe: {tcpSocket: {port: grpc-mtls}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: grpc-mtls}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: grpc-mtls}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 6}
          resources: {{ toYaml $broker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/insight/config, readOnly: true}
            - {name: tls, mountPath: /etc/insight/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ $broker.config.existingConfigMap }}
            items: [{key: {{ $broker.config.fileKey }}, path: artifact-broker.json}]
        - name: tls
          secret:
            secretName: {{ $broker.tls.existingSecret }}
            items:
              - {key: {{ $broker.tls.keys.clientCa }}, path: client-ca.pem}
              - {key: {{ $broker.tls.keys.serverCertificate }}, path: server.pem}
              - {key: {{ $broker.tls.keys.serverPrivateKey }}, path: server-key.pem}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
{{- if $broker.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "insight-platform-artifact-broker.name" $context }}
  namespace: {{ $root.Values.namespace }}
spec:
  minAvailable: {{ int $broker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "insight-platform-artifact-broker.labels" $context | nindent 6 }}
{{- end }}
{{- if $broker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "insight-platform-artifact-broker.name" $context }}
  namespace: {{ $root.Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "insight-platform-artifact-broker.name" $context }}
  minReplicas: {{ int $broker.autoscaling.minReplicas }}
  maxReplicas: {{ int $broker.autoscaling.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ int $broker.autoscaling.targetCPUUtilizationPercentage }}
{{ end }}
{{ end }}

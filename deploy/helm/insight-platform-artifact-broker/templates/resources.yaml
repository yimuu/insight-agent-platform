apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    insight.platform/artifact-namespace: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insight-platform-artifact-broker.name" . }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-platform-artifact-broker.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    {{- include "insight-platform-artifact-broker.labels" . | nindent 4 }}
  ports:
    - {name: grpc-mtls, protocol: TCP, port: {{ int .Values.port }}, targetPort: grpc-mtls}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-platform-artifact-broker.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "insight-platform-artifact-broker.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "insight-platform-artifact-broker.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-platform-artifact-broker.labels" . | nindent 8 }}
        insight.platform/workload-role: artifact-broker
    spec:
      serviceAccountName: {{ include "insight-platform-artifact-broker.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "insight-platform-artifact-broker.labels" . | nindent 14 }}
      containers:
        - name: artifact-broker
          image: {{ include "insight-platform-artifact-broker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/platform-artifact-broker"]
          ports: [{name: grpc-mtls, containerPort: {{ int .Values.port }}, protocol: TCP}]
          env:
            - {name: PLATFORM_ARTIFACT_BROKER_CONFIG, value: /etc/insight/config/artifact-broker.json}
            - {name: PLATFORM_ARTIFACT_BROKER_CONFIG_DIGEST, value: {{ .Values.config.digest | quote }}}
            - name: PLATFORM_ARTIFACT_BROKER_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.urlKey }}}}
            - {name: PLATFORM_ARTIFACT_BROKER_CLIENT_CA_PATH, value: /etc/insight/tls/client-ca.pem}
            - {name: PLATFORM_ARTIFACT_BROKER_CERT_PATH, value: /etc/insight/tls/server.pem}
            - {name: PLATFORM_ARTIFACT_BROKER_KEY_PATH, value: /etc/insight/tls/server-key.pem}
          startupProbe: {tcpSocket: {port: grpc-mtls}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: grpc-mtls}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: grpc-mtls}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 6}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/insight/config, readOnly: true}
            - {name: tls, mountPath: /etc/insight/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap }}
            items: [{key: {{ .Values.config.fileKey }}, path: artifact-broker.json}]
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            items:
              - {key: {{ .Values.tls.keys.clientCa }}, path: client-ca.pem}
              - {key: {{ .Values.tls.keys.serverCertificate }}, path: server.pem}
              - {key: {{ .Values.tls.keys.serverPrivateKey }}, path: server-key.pem}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "insight-platform-artifact-broker.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: {{ int .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "insight-platform-artifact-broker.labels" . | nindent 6 }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "insight-platform-artifact-broker.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "insight-platform-artifact-broker.name" . }}
  minReplicas: {{ int .Values.autoscaling.minReplicas }}
  maxReplicas: {{ int .Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ int .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

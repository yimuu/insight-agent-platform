{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ .Values.namespace }}}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
{{ range $audience, $broker := .Values.brokers }}
{{ $context := dict "audience" $audience }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "insight-platform-artifact-broker.name" $context }}
  namespace: {{ $root.Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "insight-platform-artifact-broker.labels" $context | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml $root.Values.networkPolicy.sandboxControllerNamespaceSelector | nindent 16 }}
          podSelector:
            matchLabels: {{ toYaml $root.Values.networkPolicy.sandboxControllerPodSelector | nindent 16 }}
      ports: [{protocol: TCP, port: {{ int $broker.port }}}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {{ toYaml $root.Values.networkPolicy.dnsNamespaceSelector | nindent 16 }}
          podSelector:
            matchLabels: {{ toYaml $root.Values.networkPolicy.dnsPodSelector | nindent 16 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        {{- range $root.Values.networkPolicy.postgresCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        {{- range $root.Values.networkPolicy.storageProviderCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    - to:
        {{- range $root.Values.networkPolicy.kmsProviderCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    - to:
        {{- range $root.Values.networkPolicy.workloadIdentityCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
{{ end }}
{{- end }}

{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}
{{- fail "image.digest must be an exact lowercase sha256 digest" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "Artifact Broker NetworkPolicy must remain enabled" }}
{{- end }}
{{- if ne (join "," (keys .Values.brokers | sortAlpha)) "model,sandbox" }}
{{- fail "brokers must contain exactly the isolated model and sandbox audiences" }}
{{- end }}
{{- range $audience, $broker := .Values.brokers }}
{{- if lt (int $broker.replicas) 2 }}
{{- fail (printf "%s Artifact Broker requires at least two replicas" $audience) }}
{{- end }}
{{- if or (lt (int $broker.port) 1) (gt (int $broker.port) 65535) }}
{{- fail (printf "%s Artifact Broker port must be valid" $audience) }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $broker.config.digest) }}
{{- fail (printf "%s config.digest must be an exact lowercase sha256 digest" $audience) }}
{{- end }}
{{- if or (empty $broker.config.existingConfigMap) (empty $broker.config.fileKey) }}
{{- fail (printf "%s immutable config input is required" $audience) }}
{{- end }}
{{- if or (empty $broker.database.existingSecret) (empty $broker.database.urlKey) }}
{{- fail (printf "%s restricted database input is required" $audience) }}
{{- end }}
{{- if empty $broker.serviceAccount.annotations }}
{{- fail (printf "%s Artifact Broker workload-identity annotation is required" $audience) }}
{{- end }}
{{- if or (empty $broker.tls.existingSecret) (empty $broker.tls.keys.clientCa) (empty $broker.tls.keys.serverCertificate) (empty $broker.tls.keys.serverPrivateKey) }}
{{- fail (printf "%s server mTLS inputs are required" $audience) }}
{{- end }}
{{- if $broker.autoscaling.enabled }}
{{- if lt (int $broker.autoscaling.minReplicas) 2 }}
{{- fail (printf "%s Artifact Broker HPA requires at least two replicas" $audience) }}
{{- end }}
{{- if lt (int $broker.autoscaling.maxReplicas) (int $broker.autoscaling.minReplicas) }}
{{- fail (printf "%s Artifact Broker HPA maximum must be at least its minimum" $audience) }}
{{- end }}
{{- if or (lt (int $broker.autoscaling.targetCPUUtilizationPercentage) 1) (gt (int $broker.autoscaling.targetCPUUtilizationPercentage) 100) }}
{{- fail (printf "%s Artifact Broker HPA CPU target must be in 1..100" $audience) }}
{{- end }}
{{- end }}
{{- end }}
{{- $model := index .Values.brokers "model" }}
{{- $sandbox := index .Values.brokers "sandbox" }}
{{- if eq $model.config.existingConfigMap $sandbox.config.existingConfigMap }}
{{- fail "Model and Sandbox Artifact Brokers require isolated config maps" }}
{{- end }}
{{- if eq $model.database.existingSecret $sandbox.database.existingSecret }}
{{- fail "Model and Sandbox Artifact Brokers require isolated database pools and credentials" }}
{{- end }}
{{- if eq $model.tls.existingSecret $sandbox.tls.existingSecret }}
{{- fail "Model and Sandbox Artifact Brokers require isolated server identities" }}
{{- end }}
{{- if deepEqual $model.serviceAccount.annotations $sandbox.serviceAccount.annotations }}
{{- fail "Model and Sandbox Artifact Brokers require isolated workload identities" }}
{{- end }}
{{- if or (empty .Values.networkPolicy.modelWorkerNamespaceSelector) (empty .Values.networkPolicy.modelWorkerPodSelector) }}
{{- fail "exact Model Worker caller selectors are required" }}
{{- end }}
{{- if or (empty .Values.networkPolicy.sandboxControllerNamespaceSelector) (empty .Values.networkPolicy.sandboxControllerPodSelector) }}
{{- fail "exact Sandbox Controller caller selectors are required" }}
{{- end }}
{{- if or (empty .Values.networkPolicy.dnsNamespaceSelector) (empty .Values.networkPolicy.dnsPodSelector) }}
{{- fail "exact DNS selectors are required" }}
{{- end }}
{{- if or (empty .Values.networkPolicy.postgresCidrs) (empty .Values.networkPolicy.storageProviderCidrs) (empty .Values.networkPolicy.kmsProviderCidrs) (empty .Values.networkPolicy.workloadIdentityCidrs) }}
{{- fail "PostgreSQL, storage, KMS and workload-identity CIDRs are required" }}
{{- end }}

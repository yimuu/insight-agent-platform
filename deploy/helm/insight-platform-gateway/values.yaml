image:
  repository: insight-agent-platform
  digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  pullPolicy: IfNotPresent
imagePullSecrets: []

namespace: platform-public
replicas: 2
port: 8080

config:
  existingConfigMap: insight-platform-gateway-candidate
  fileKey: gateway.json
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
database:
  existingSecret: insight-platform-gateway-database
  urlKey: database-url
runEventCursorKey:
  existingSecret: insight-platform-gateway-run-event-cursor
  key: cursor-key
  digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
artifactGateway:
  endpoint: https://insight-platform-artifact-gateway.platform-artifacts.svc:8080/
  namespaceSelector: {insight.platform/artifact-namespace: "true"}
  podSelector: {app.kubernetes.io/component: artifact-gateway}
  tls:
    existingSecret: insight-platform-gateway-artifact-client-tls
    keys: {ca: ca.pem, certificate: client.pem, privateKey: client-key.pem}

ingress:
  enabled: true
  className: nginx
  host: api.example.invalid
  tlsSecret: insight-platform-gateway-public-tls
  namespaceSelector: {insight.platform/ingress-namespace: "true"}
  podSelector: {app.kubernetes.io/component: ingress-controller}

networkPolicy:
  enabled: true
  dnsNamespaceSelector: {kubernetes.io/metadata.name: kube-system}
  dnsPodSelector: {k8s-app: kube-dns}
  postgresCidrs: [10.10.0.0/24]

monitoring:
  enabled: true
  interval: 30s
  scrapeTimeout: 5s
  namespaceSelector: {insight.platform/monitoring-namespace: "true"}
  podSelector: {app.kubernetes.io/name: prometheus}

resources:
  requests: {cpu: 200m, memory: 256Mi}
  limits: {cpu: "2", memory: 1Gi}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCpuUtilizationPercentage: 70

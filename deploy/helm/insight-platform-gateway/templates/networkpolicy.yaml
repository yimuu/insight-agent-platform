{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ .Values.namespace }}}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "insight-platform-gateway.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "insight-platform-gateway.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.ingress.namespaceSelector | nindent 16 }}
          podSelector:
            matchLabels: {{ toYaml .Values.ingress.podSelector | nindent 16 }}
      ports: [{protocol: TCP, port: {{ int .Values.port }}}]
  egress:
    - to:
        {{- range .Values.networkPolicy.postgresCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}

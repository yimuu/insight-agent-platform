{{- $root := . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    insight.platform/workload-namespace: public-api
    insight.platform/public-gateway-namespace: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
{{ range $role, $component := .Values.roles }}
{{- $ctx := dict "root" $root "role" $role }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ include "insight-platform-gateway.name" $ctx }}, namespace: {{ $root.Values.namespace }}}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-platform-gateway.name" $ctx }}
  namespace: {{ $root.Values.namespace }}
  labels: {{ include "insight-platform-gateway.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ int $component.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {{ include "insight-platform-gateway.labels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-platform-gateway.labels" $ctx | nindent 8 }}
        insight.platform/workload-role: {{ $role }}
        insight.platform/component-role: {{ $component.componentRole }}
    spec:
      serviceAccountName: {{ include "insight-platform-gateway.name" $ctx }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets: {{ toYaml $root.Values.imagePullSecrets | nindent 8 }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {{ include "insight-platform-gateway.labels" $ctx | nindent 14 }}
      containers:
        - name: {{ $role }}
          image: {{ include "insight-platform-gateway.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/usr/local/bin/platform-gateway"]
          ports: [{name: http, containerPort: {{ int $root.Values.port }}, protocol: TCP}]
          env:
            - {name: PLATFORM_GATEWAY_CONFIG, value: /etc/insight/config/gateway.json}
            - {name: PLATFORM_GATEWAY_CONFIG_DIGEST, value: {{ $component.config.digest | quote }}}
            - name: PLATFORM_GATEWAY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $component.database.existingSecret }}, key: {{ $component.database.urlKey }}}}
            {{- if eq $role "runtime-api" }}
            - {name: PLATFORM_GATEWAY_RUN_EVENT_CURSOR_KEY_PATH, value: /etc/insight/run-event-cursor/key}
            - {name: PLATFORM_GATEWAY_RUN_EVENT_CURSOR_KEY_DIGEST, value: {{ $root.Values.runEventCursorKey.digest | quote }}}
            - {name: PLATFORM_GATEWAY_ARTIFACT_ENDPOINT, value: {{ $root.Values.artifactGateway.endpoint | quote }}}
            - {name: PLATFORM_GATEWAY_ARTIFACT_CA_PATH, value: /etc/insight/artifact-tls/ca.pem}
            - {name: PLATFORM_GATEWAY_ARTIFACT_CERT_PATH, value: /etc/insight/artifact-tls/client.pem}
            - {name: PLATFORM_GATEWAY_ARTIFACT_KEY_PATH, value: /etc/insight/artifact-tls/client-key.pem}
            {{- end }}
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 6}
          resources: {{ toYaml $component.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: config, mountPath: /etc/insight/config, readOnly: true}
            {{- if eq $role "runtime-api" }}
            - {name: run-event-cursor-key, mountPath: /etc/insight/run-event-cursor, readOnly: true}
            - {name: artifact-tls, mountPath: /etc/insight/artifact-tls, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $component.config.existingConfigMap }}, items: [{key: {{ $component.config.fileKey }}, path: gateway.json}]}
        {{- if eq $role "runtime-api" }}
        - name: run-event-cursor-key
          secret: {secretName: {{ $root.Values.runEventCursorKey.existingSecret }}, items: [{key: {{ $root.Values.runEventCursorKey.key }}, path: key}]}
        - name: artifact-tls
          secret:
            secretName: {{ $root.Values.artifactGateway.tls.existingSecret }}
            items:
              - {key: {{ $root.Values.artifactGateway.tls.keys.ca }}, path: ca.pem}
              - {key: {{ $root.Values.artifactGateway.tls.keys.certificate }}, path: client.pem}
              - {key: {{ $root.Values.artifactGateway.tls.keys.privateKey }}, path: client-key.pem}
        {{- end }}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-platform-gateway.name" $ctx }}
  namespace: {{ $root.Values.namespace }}
  labels: {{ include "insight-platform-gateway.labels" $ctx | nindent 4 }}
spec:
  selector: {{ include "insight-platform-gateway.labels" $ctx | nindent 4 }}
  ports: [{name: http, port: {{ int $root.Values.port }}, targetPort: http, protocol: TCP}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ include "insight-platform-gateway.name" $ctx }}, namespace: {{ $root.Values.namespace }}}
spec:
  minAvailable: {{ int $root.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{ include "insight-platform-gateway.labels" $ctx | nindent 6 }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ include "insight-platform-gateway.name" $ctx }}, namespace: {{ $root.Values.namespace }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "insight-platform-gateway.name" $ctx }}}
  minReplicas: {{ int $component.autoscaling.minReplicas }}
  maxReplicas: {{ int $component.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ int $component.autoscaling.targetCpuUtilizationPercentage }}}}
{{ end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: {{ .Release.Name }}-public-api, namespace: {{ .Values.namespace }}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecret }}}]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "agents" "skills" "capabilities" "contexts" "context-datasets" "models" "mcp-servers" "policies" "sandboxes" "operations" }}
          - path: /v1/{{ . }}
            pathType: Prefix
            backend: {service: {name: {{ $root.Release.Name }}-management-api, port: {name: http}}}
          {{- end }}
          {{- range list "runs" "tasks" "artifacts" }}
          - path: /v1/{{ . }}
            pathType: Prefix
            backend: {service: {name: {{ $root.Release.Name }}-runtime-api, port: {name: http}}}
          {{- end }}
{{- end }}

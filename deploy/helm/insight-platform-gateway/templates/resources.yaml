apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    insight.platform/workload-namespace: public-gateway
    insight.platform/public-gateway-namespace: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insight-platform-gateway.name" . }}
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-platform-gateway.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "insight-platform-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "insight-platform-gateway.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-platform-gateway.labels" . | nindent 8 }}
        insight.platform/workload-role: public-gateway
    spec:
      serviceAccountName: {{ include "insight-platform-gateway.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "insight-platform-gateway.labels" . | nindent 14 }}
      containers:
        - name: gateway
          image: {{ include "insight-platform-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/platform-gateway"]
          ports: [{name: http, containerPort: {{ int .Values.port }}, protocol: TCP}]
          env:
            - {name: PLATFORM_GATEWAY_CONFIG, value: /etc/insight/config/gateway.json}
            - {name: PLATFORM_GATEWAY_CONFIG_DIGEST, value: {{ .Values.config.digest | quote }}}
            - name: PLATFORM_GATEWAY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.urlKey }}}}
            - {name: PLATFORM_GATEWAY_RUN_EVENT_CURSOR_KEY_PATH, value: /etc/insight/run-event-cursor/key}
            - {name: PLATFORM_GATEWAY_RUN_EVENT_CURSOR_KEY_DIGEST, value: {{ .Values.runEventCursorKey.digest | quote }}}
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 6}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/insight/config, readOnly: true}
            - {name: run-event-cursor-key, mountPath: /etc/insight/run-event-cursor, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap }}
            items: [{key: {{ .Values.config.fileKey }}, path: gateway.json}]
        - name: run-event-cursor-key
          secret:
            secretName: {{ .Values.runEventCursorKey.existingSecret }}
            items: [{key: {{ .Values.runEventCursorKey.key }}, path: key}]
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-platform-gateway.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    {{- include "insight-platform-gateway.labels" . | nindent 4 }}
  ports: [{name: http, port: {{ int .Values.port }}, targetPort: http, protocol: TCP}]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "insight-platform-gateway.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "insight-platform-gateway.name" . }}
                port: {name: http}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "insight-platform-gateway.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: {{ int .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "insight-platform-gateway.labels" . | nindent 6 }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "insight-platform-gateway.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "insight-platform-gateway.name" . }}}
  minReplicas: {{ int .Values.autoscaling.minReplicas }}
  maxReplicas: {{ int .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ int .Values.autoscaling.targetCpuUtilizationPercentage }}}
{{- end }}

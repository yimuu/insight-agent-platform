{{- if lt (int .Values.replicas) 2 }}
{{- fail "replicas must be at least 2" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must remain true" }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}
{{- fail "image.digest must be an immutable lowercase sha256 digest" }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.config.digest) }}
{{- fail "config.digest must be a lowercase sha256 digest" }}
{{- end }}
{{- if or (empty .Values.config.existingConfigMap) (empty .Values.config.fileKey) }}
{{- fail "immutable Gateway config reference is required" }}
{{- end }}
{{- if empty .Values.database.existingSecret }}
{{- fail "Gateway database Secret is required" }}
{{- end }}
{{- if or (empty .Values.runEventCursorKey.existingSecret) (empty .Values.runEventCursorKey.key) }}
{{- fail "Gateway Run event cursor Secret reference is required" }}
{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.runEventCursorKey.digest) }}
{{- fail "Gateway Run event cursor key digest must be lowercase sha256" }}
{{- end }}
{{- if or (not (hasPrefix "https://" .Values.artifactGateway.endpoint)) (empty .Values.artifactGateway.tls.existingSecret) (empty .Values.artifactGateway.tls.keys.ca) (empty .Values.artifactGateway.tls.keys.certificate) (empty .Values.artifactGateway.tls.keys.privateKey) }}
{{- fail "Gateway to Artifact Gateway requires an HTTPS endpoint and exact mTLS Secret keys" }}
{{- end }}
{{- if empty .Values.networkPolicy.postgresCidrs }}
{{- fail "networkPolicy.postgresCidrs is required" }}
{{- end }}
{{- if and .Values.ingress.enabled (or (empty .Values.ingress.host) (empty .Values.ingress.tlsSecret)) }}
{{- fail "enabled Gateway Ingress requires exact host and TLS Secret" }}
{{- end }}
{{- if not .Values.monitoring.enabled }}
{{- fail "monitoring.enabled must remain true for the production Gateway" }}
{{- end }}
{{- if or (empty .Values.monitoring.namespaceSelector) (empty .Values.monitoring.podSelector) }}
{{- fail "Gateway monitoring requires exact namespace and Pod selectors" }}
{{- end }}
{{- if or (not (regexMatch "^[1-9][0-9]*s$" .Values.monitoring.interval)) (not (regexMatch "^[1-9][0-9]*s$" .Values.monitoring.scrapeTimeout)) }}
{{- fail "Gateway monitoring interval and scrape timeout must be positive seconds" }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- if or (lt (int .Values.autoscaling.minReplicas) 2) (lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas)) }}
{{- fail "autoscaling bounds are invalid" }}
{{- end }}
{{- end }}

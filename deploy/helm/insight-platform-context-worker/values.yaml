image:
  repository: insight-agent-platform
  digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  pullPolicy: IfNotPresent
imagePullSecrets: []
candidate:
  deploymentConfigDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

namespace: platform-context-worker
replicas: 2
observability: {port: 9090}

config:
  existingConfigMap: insight-platform-context-worker-candidate
  fileKey: context-worker.json
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
database:
  existingSecret: insight-platform-context-worker-database
  urlKey: database-url

networkPolicy:
  enabled: true
  dnsNamespaceSelector: {kubernetes.io/metadata.name: kube-system}
  dnsPodSelector: {k8s-app: kube-dns}
  postgresCidrs: [10.10.0.0/24]
  monitoringNamespaceSelector: {insight.platform/monitoring-namespace: "true"}
  monitoringPodSelector: {app.kubernetes.io/name: prometheus}
monitoring: {enabled: true, interval: 30s, scrapeTimeout: 5s}

resources:
  requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
  limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 512Mi}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 16
  targetCPUUtilizationPercentage: 70
datasetPool:
  enabled: true
  replicas: 2
  observability: {port: 9290}
  config:
    existingConfigMap: insight-platform-context-dataset-worker-candidate
    fileKey: context-dataset-worker.json
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  database:
    existingSecret: insight-platform-context-dataset-worker-database
    urlKey: database-url
  artifactDataWorker:
    namespace: platform-artifact
    podSelector: {app.kubernetes.io/component: artifact-data-worker}
    port: 9443
  artifactTls:
    existingSecret: insight-platform-context-dataset-worker-artifact-client-tls
    keys: {ca: ca.pem, certificate: client.pem, privateKey: client-key.pem}
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
    limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 512Mi}
  podDisruptionBudget: {enabled: true, minAvailable: 1}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 16
    targetCPUUtilizationPercentage: 70
subscriptionPool:
  enabled: true
  replicas: 2
  observability: {port: 9190}
  config:
    existingConfigMap: insight-platform-subscription-context-worker-candidate
    fileKey: subscription-context-worker.json
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  database:
    existingSecret: insight-platform-context-worker-database
    urlKey: database-url
  host:
    namespace: platform-mcp-host
    podSelector: {app.kubernetes.io/component: mcp-resource-host}
    port: 9543
  hostTls:
    existingSecret: insight-platform-subscription-context-worker-host-client-tls
    keys: {ca: ca.pem, certificate: client.pem, privateKey: client-key.pem}
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
    limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 512Mi}
  podDisruptionBudget: {enabled: true, minAvailable: 1}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 16
    targetCPUUtilizationPercentage: 70

{{- if .Values.subscriptionPool.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ include "insight-platform-context-worker.subscriptionName" . }}, namespace: {{ .Values.namespace }}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-platform-context-worker.subscriptionName" . }}
  namespace: {{ .Values.namespace }}
  labels: {{ include "insight-platform-context-worker.subscriptionLabels" . | nindent 4 }}
spec:
  selector: {{ include "insight-platform-context-worker.subscriptionLabels" . | nindent 4 }}
  ports: [{name: observability, port: {{ int .Values.subscriptionPool.observability.port }}, targetPort: observability, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "insight-platform-context-worker.subscriptionName" . }}, namespace: {{ .Values.namespace }}}
spec:
  replicas: {{ int .Values.subscriptionPool.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels:
      {{- include "insight-platform-context-worker.subscriptionLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-platform-context-worker.subscriptionLabels" . | nindent 8 }}
        insight.platform/workload-role: context-worker
        insight.platform/component-role: context_worker
      annotations:
        insight.platform/deployment-config-digest: {{ .Values.candidate.deploymentConfigDigest | quote }}
    spec:
      serviceAccountName: {{ include "insight-platform-context-worker.subscriptionName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 150
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: subscription-context-worker
          image: {{ include "insight-platform-context-worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/platform-subscription-context-worker"]
          ports: [{name: observability, containerPort: {{ int .Values.subscriptionPool.observability.port }}, protocol: TCP}]
          env:
            - {name: PLATFORM_SUBSCRIPTION_CONTEXT_WORKER_CONFIG, value: /etc/insight/config/subscription-context-worker.json}
            - {name: PLATFORM_SUBSCRIPTION_CONTEXT_WORKER_CONFIG_DIGEST, value: {{ .Values.subscriptionPool.config.digest | quote }} }
            - name: PLATFORM_SUBSCRIPTION_CONTEXT_WORKER_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.subscriptionPool.database.existingSecret }}, key: {{ .Values.subscriptionPool.database.urlKey }}}}
            - {name: PLATFORM_SUBSCRIPTION_CONTEXT_WORKER_HOST_CA_PATH, value: /etc/insight/host-tls/ca.pem}
            - {name: PLATFORM_SUBSCRIPTION_CONTEXT_WORKER_HOST_CERT_PATH, value: /etc/insight/host-tls/client.pem}
            - {name: PLATFORM_SUBSCRIPTION_CONTEXT_WORKER_HOST_KEY_PATH, value: /etc/insight/host-tls/client-key.pem}
          startupProbe: {httpGet: {path: /livez, port: observability}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: observability}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /livez, port: observability}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 6}
          resources: {{ toYaml .Values.subscriptionPool.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/insight/config, readOnly: true}
            - {name: host-tls, mountPath: /etc/insight/host-tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.subscriptionPool.config.existingConfigMap }}
            items: [{key: {{ .Values.subscriptionPool.config.fileKey }}, path: subscription-context-worker.json}]
        - name: host-tls
          secret:
            secretName: {{ .Values.subscriptionPool.hostTls.existingSecret }}
            items:
              - {key: {{ .Values.subscriptionPool.hostTls.keys.ca }}, path: ca.pem}
              - {key: {{ .Values.subscriptionPool.hostTls.keys.certificate }}, path: client.pem}
              - {key: {{ .Values.subscriptionPool.hostTls.keys.privateKey }}, path: client-key.pem}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
{{- if .Values.subscriptionPool.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ include "insight-platform-context-worker.subscriptionName" . }}, namespace: {{ .Values.namespace }}}
spec:
  minAvailable: {{ int .Values.subscriptionPool.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "insight-platform-context-worker.subscriptionLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.subscriptionPool.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ include "insight-platform-context-worker.subscriptionName" . }}, namespace: {{ .Values.namespace }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "insight-platform-context-worker.subscriptionName" . }}}
  minReplicas: {{ int .Values.subscriptionPool.autoscaling.minReplicas }}
  maxReplicas: {{ int .Values.subscriptionPool.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ int .Values.subscriptionPool.autoscaling.targetCPUUtilizationPercentage }}}}
{{- end }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: {{ include "insight-platform-context-worker.subscriptionName" . }}, namespace: {{ .Values.namespace }}}
spec:
  namespaceSelector: {matchNames: [{{ .Values.namespace }}]}
  selector:
    matchLabels: {{ include "insight-platform-context-worker.subscriptionLabels" . | nindent 6 }}
  endpoints: [{port: observability, path: /metrics, interval: {{ .Values.monitoring.interval }}, scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}, scheme: http}]
{{- end }}
{{- end }}

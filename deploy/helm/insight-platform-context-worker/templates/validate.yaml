{{- if lt (int .Values.replicas) 2 -}}
{{- fail "Context Worker requires at least two replicas" -}}
{{- end -}}
{{- if .Values.subscriptionPool.enabled -}}
{{- if lt (int .Values.subscriptionPool.replicas) 2 -}}{{- fail "Subscription Context Worker requires at least two replicas" -}}{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.subscriptionPool.config.digest) -}}{{- fail "subscriptionPool config.digest must be exact sha256" -}}{{- end -}}
{{- if or (empty .Values.subscriptionPool.config.existingConfigMap) (empty .Values.subscriptionPool.database.existingSecret) (empty .Values.subscriptionPool.host.namespace) (empty .Values.subscriptionPool.host.podSelector) (empty .Values.subscriptionPool.hostTls.existingSecret) -}}{{- fail "Subscription Context Worker exact config, database, Host and TLS inputs are required" -}}{{- end -}}
{{- if and .Values.subscriptionPool.autoscaling.enabled (lt (int .Values.subscriptionPool.autoscaling.minReplicas) 2) -}}{{- fail "Subscription Context Worker HPA requires at least two replicas" -}}{{- end -}}
{{- end -}}
{{- if .Values.datasetPool.enabled -}}
{{- if lt (int .Values.datasetPool.replicas) 2 -}}{{- fail "Context Dataset Worker requires at least two replicas" -}}{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.datasetPool.config.digest) -}}{{- fail "datasetPool config.digest must be exact sha256" -}}{{- end -}}
{{- if or (empty .Values.datasetPool.config.existingConfigMap) (empty .Values.datasetPool.database.existingSecret) (empty .Values.datasetPool.artifactDataWorker.namespace) (empty .Values.datasetPool.artifactDataWorker.podSelector) (empty .Values.datasetPool.artifactTls.existingSecret) -}}{{- fail "Context Dataset Worker exact config, database, Artifact Data Worker and TLS inputs are required" -}}{{- end -}}
{{- if and .Values.datasetPool.autoscaling.enabled (lt (int .Values.datasetPool.autoscaling.minReplicas) 2) -}}{{- fail "Context Dataset Worker HPA requires at least two replicas" -}}{{- end -}}
{{- if and .Values.datasetPool.autoscaling.enabled (lt (int .Values.datasetPool.autoscaling.maxReplicas) (int .Values.datasetPool.autoscaling.minReplicas)) -}}{{- fail "Context Dataset Worker HPA maximum must be at least its minimum" -}}{{- end -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) -}}
{{- fail "image.digest must be an exact sha256 digest" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.config.digest) -}}
{{- fail "config.digest must be an exact sha256 digest" -}}
{{- end -}}
{{- if or (empty .Values.config.existingConfigMap) (empty .Values.database.existingSecret) -}}
{{- fail "config and database inputs must be existing projected objects" -}}
{{- end -}}
{{- if empty .Values.networkPolicy.postgresCidrs -}}
{{- fail "PostgreSQL CIDRs are required" -}}
{{- end -}}
{{- if or (lt (int .Values.observability.port) 1) (gt (int .Values.observability.port) 65535) -}}{{- fail "observability port must be in 1..65535" -}}{{- end -}}
{{- if and .Values.monitoring.enabled (or (empty .Values.networkPolicy.monitoringNamespaceSelector) (empty .Values.networkPolicy.monitoringPodSelector)) -}}{{- fail "monitoring requires exact namespace and Pod selectors" -}}{{- end -}}
{{- if .Values.autoscaling.enabled -}}
{{- if lt (int .Values.autoscaling.minReplicas) 2 -}}
{{- fail "Context Worker HPA requires at least two replicas" -}}
{{- end -}}
{{- if lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas) -}}
{{- fail "Context Worker HPA maximum must be at least its minimum" -}}
{{- end -}}
{{- end -}}

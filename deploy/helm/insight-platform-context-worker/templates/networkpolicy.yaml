{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ .Values.namespace }}}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "insight-platform-context-worker.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "insight-platform-context-worker.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.monitoring.enabled }}
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 16 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.monitoringPodSelector | nindent 16 }}
      ports: [{protocol: TCP, port: {{ int .Values.observability.port }}}]
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 16 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.dnsPodSelector | nindent 16 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        {{- range .Values.networkPolicy.postgresCidrs }}
        - ipBlock: {cidr: {{ . }} }
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.subscriptionPool.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "insight-platform-context-worker.subscriptionName" . }}, namespace: {{ .Values.namespace }}}
spec:
  podSelector:
    matchLabels:
      {{- include "insight-platform-context-worker.subscriptionLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.monitoring.enabled }}
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 16 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.monitoringPodSelector | nindent 16 }}
      ports: [{protocol: TCP, port: {{ int .Values.subscriptionPool.observability.port }}}]
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.subscriptionPool.host.namespace }} }
          podSelector:
            matchLabels: {{ toYaml .Values.subscriptionPool.host.podSelector | nindent 16 }}
      ports: [{protocol: TCP, port: {{ int .Values.subscriptionPool.host.port }}}]
    - to:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 16 }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.dnsPodSelector | nindent 16 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        {{- range .Values.networkPolicy.postgresCidrs }}
        - ipBlock: {cidr: {{ . }} }
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}

image:
  repository: insight-agent-platform
  digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  pullPolicy: IfNotPresent
imagePullSecrets: []
candidate:
  deploymentConfigDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

namespace: platform-orchestration-worker
replicas: 2
observability:
  port: 9090

config:
  existingConfigMap: insight-platform-orchestration-worker-candidate
  fileKey: orchestration-worker.json
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
database:
  existingSecret: insight-platform-orchestration-worker-database
  urlKey: database-url
artifactTls:
  existingSecret: insight-platform-orchestration-worker-artifact-client-tls
  keys:
    ca: ca.pem
    certificate: client.pem
    privateKey: client-key.pem

networkPolicy:
  enabled: true
  artifactNamespace: platform-artifacts
  artifactPodSelector: {app.kubernetes.io/component: artifact-data-worker}
  artifactPort: 9443
  dnsNamespaceSelector: {kubernetes.io/metadata.name: kube-system}
  dnsPodSelector: {k8s-app: kube-dns}
  postgresCidrs: [10.10.0.0/24]
  monitoringNamespaceSelector: {insight.platform/monitoring-namespace: "true"}
  monitoringPodSelector: {app.kubernetes.io/name: prometheus}

monitoring:
  enabled: true
  interval: 30s
  scrapeTimeout: 5s

resources:
  requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 64Mi}
  limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 1Gi}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 16
  targetCPUUtilizationPercentage: 70

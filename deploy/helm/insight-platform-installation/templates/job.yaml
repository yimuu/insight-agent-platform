apiVersion: batch/v1
kind: Job
metadata:
  name: installation-{{ .Release.Revision }}
  labels:
    {{- include "installation.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    insight.platform/input-digest: {{ .Values.plan.input_digest | quote }}
    insight.platform/phase: install
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "installation.labels" . | nindent 8 }}
    spec:
      {{- include "installation.scheduling" . | nindent 6 }}
      restartPolicy: Never
      containers:
        - name: installation
          image: {{ .Values.plan.runtime_image | quote }}
          command: [/bin/sh, -ec]
          args:
            - "exec /usr/local/bin/platform-installation install --input /installation-input/input.json --state /installation/private --output /output --binaries /usr/local/bin > /tmp/installation-result.json"
          terminationMessagePath: /tmp/installation-result.json
          terminationMessagePolicy: File
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          env:
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
            - {name: AWS_CONFIG_FILE, value: /dev/null}
            - {name: AWS_PROFILE, value: default}
            - {name: AWS_SHARED_CREDENTIALS_FILE, value: /installation/private/s3-artifact-gateway-credentials}
            - {name: SSL_CERT_FILE, value: /installation/private/ca.pem}
            - {name: SSL_CERT_DIR, value: /etc/ssl/certs}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            {{- include "installation.outputMounts" . | nindent 12 }}
      volumes:
        {{- include "installation.outputVolumes" . | nindent 8 }}

{{- if or (ne (int .Values.plan.schema_version) 1) (ne .Values.plan.namespace .Release.Namespace) (ne .Values.plan.input.name .Release.Namespace) (ne .Values.plan.input.network.topology "kubernetes_local") -}}{{ fail "the shared Kubernetes installation plan is required" }}{{- end -}}
{{- if not .Values.node -}}{{ fail "a node is required for the development ReadWriteOnce volumes" }}{{- end -}}
{{- if or (not (kindIs "map" .Values.plan.dependency_stop_grace_seconds)) (ne (mustToJson .Values.plan.dependency_stop_grace_seconds.s3) "45") -}}{{ fail "the shared S3 shutdown grace is required" }}{{- end -}}
{{- range list .Values.plan.runtime_image .Values.plan.console_image .Values.plan.dependencies.postgres .Values.plan.dependencies.nats .Values.plan.dependencies.s3 .Values.plan.dependencies.openbao -}}
{{- if not (regexMatch "^[A-Za-z0-9._/:-]+@sha256:[a-f0-9]{64}$" .) -}}{{ fail "repository image digests are required" }}{{- end -}}
{{- end -}}
{{- range .Values.plan.processes -}}
{{- if or (not (regexMatch "^[a-z][a-z0-9-]{0,62}$" .name)) (not (regexMatch "^platform-[a-z0-9-]+$" .binary)) -}}{{ fail "invalid process identity" }}{{- end -}}
{{- end -}}

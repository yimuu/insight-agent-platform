apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    insight.platform/workload-namespace: callback-api
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insight-platform-callback-api.name" . }}
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-platform-callback-api.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "insight-platform-callback-api.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "insight-platform-callback-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-platform-callback-api.labels" . | nindent 8 }}
        insight.platform/workload-role: mcp-callback-api
    spec:
      serviceAccountName: {{ include "insight-platform-callback-api.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "insight-platform-callback-api.labels" . | nindent 14 }}
      containers:
        - name: callback-api
          image: {{ include "insight-platform-callback-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/platform-callback-api"]
          ports: [{name: http, containerPort: {{ int .Values.port }}, protocol: TCP}]
          env:
            - {name: PLATFORM_CALLBACK_API_CONFIG, value: /etc/insight/config/callback-api.json}
            - {name: PLATFORM_CALLBACK_API_CONFIG_DIGEST, value: {{ .Values.config.digest | quote }}}
            - name: PLATFORM_CALLBACK_API_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.urlKey }}}}
            - {name: PLATFORM_CALLBACK_API_EGRESS_CA_PATH, value: /etc/insight/egress-tls/ca.pem}
            - {name: PLATFORM_CALLBACK_API_EGRESS_CERT_PATH, value: /etc/insight/egress-tls/client.pem}
            - {name: PLATFORM_CALLBACK_API_EGRESS_KEY_PATH, value: /etc/insight/egress-tls/client-key.pem}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 6}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/insight/config, readOnly: true}
            - {name: oauth-state-keys, mountPath: /etc/insight/oauth-state-keys, readOnly: true}
            - {name: egress-tls, mountPath: /etc/insight/egress-tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap }}
            items: [{key: {{ .Values.config.fileKey }}, path: callback-api.json}]
        - name: oauth-state-keys
          secret:
            secretName: {{ .Values.oauthStateKeys.existingSecret }}
            defaultMode: 0440
        - name: egress-tls
          secret:
            secretName: {{ .Values.egressTls.existingSecret }}
            items:
              - {key: {{ .Values.egressTls.keys.ca }}, path: ca.pem}
              - {key: {{ .Values.egressTls.keys.certificate }}, path: client.pem}
              - {key: {{ .Values.egressTls.keys.privateKey }}, path: client-key.pem}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-platform-callback-api.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    {{- include "insight-platform-callback-api.labels" . | nindent 4 }}
  ports: [{name: http, port: {{ int .Values.port }}, targetPort: http, protocol: TCP}]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "insight-platform-callback-api.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /v1/mcp/oauth/callback
            pathType: Exact
            backend:
              service:
                name: {{ include "insight-platform-callback-api.name" . }}
                port: {name: http}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "insight-platform-callback-api.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: {{ int .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "insight-platform-callback-api.labels" . | nindent 6 }}
{{- end }}

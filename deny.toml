[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # sqlx-sqlite 0.9.0 -> flume 0.12.0 currently hard-depends on this yanked
    # release. Keep the global deny policy and remove this exact exception once
    # upstream publishes a non-yanked dependency path.
    { crate = "spin@0.9.8", reason = "transitive sqlx-sqlite dependency has no non-yanked compatible release" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # For borrow-or-share via jsonschema 0.47 -> referencing -> fluent-uri -> borrow-or-share.
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
